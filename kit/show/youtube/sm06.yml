  en: ["No land. No shortcut. No light.", "Level 1: the Burj Al Arab vs the waves", "Level 2: the Suez Canal vs the detour",
       "Level 3: the Lighthouse of Alexandria vs the dark", "Final level: the Dutch storm barrier vs the North Sea", "Results"]
  ar: ["بدون أرض ولا طريق مختصر ولا نور", "المرحلة الأولى: برج العرب والموج", "المرحلة الثانية: قناة السويس ولفّة أفريقيا",
