# Survival Mode 4: You vs Time. Four builds that had to beat the clock, all four with the Saudi narrator (Mansour) in Arabic,
# on a ladder of time: one second (Big Ben), one wait (Tower Bridge), five centuries (Shibam), two thousand years (the Great Wall).
levels:
  - kit: bigben
    music: arctic                     # its sting in the cold open is two bells
    color: "#FFD166"
    en: {world: "LONDON", boss: "THE LOST SECOND", sub: "TO THE SECOND  ·  WIND, HEAT AND COLD", unlocked: "BIG BEN'S CLOCK",
         stamp: "LATE", chips: [["7 m", "EACH DIAL"], ["13.7 t", "THE BELL"], ["300 kg", "THE PENDULUM"]],
         shot: 4.2, still: 5.0}       # the whole tower at sunset, not the pendulum close-up the hook starts on
    ar: {world: "لندن", boss: "الثانية الضايعة", sub: "في ثانيتها بالضبط  ·  والريح والحر والبرد", unlocked: "ساعة بيغ بن",
         stamp: "متأخرة", chips: [["7 m", "كل وجه"], ["13.7 t", "الجرس"], ["300 kg", "البندول"]],
         shot: 4.2, still: 5.0}
  - kit: towerbridge
    music: oasis
    color: "#7FC8FF"
    en: {world: "STILL LONDON", boss: "THE LONG WAIT", sub: "A TALL SHIP  ·  YOUR ROAD IS IN ITS WAY", unlocked: "TOWER BRIDGE",
         stamp: "STUCK", chips: [["1,000+ t", "EACH HALF"], ["~800", "LIFTS A YEAR"], ["£0", "TO OPEN IT"]],
         shot: 2.4, still: 3.0}       # the road standing up with the ship in the gap
    ar: {world: "للحين في لندن", boss: "الانتظار", sub: "سفينة طويلة  ·  وطريقك في وجهها", unlocked: "جسر البرج",
         stamp: "زحمة", chips: [["1,000+", "طن كل جهة"], ["~800", "فتحة في السنة"], ["0", "ريال، ببلاش"]],
         shot: 2.4, still: 3.0}
  - kit: shibam
    music: desert
    color: "#F2B880"
    en: {world: "THE DESERT VALLEY", boss: "THE RAIN", sub: "TOWERS OF MUD  ·  MUD MELTS IN THE RAIN", unlocked: "SHIBAM",
         stamp: "MELTING", chips: [["~500", "TOWER HOUSES"], ["11", "FLOORS, AT MOST"], ["30+ m", "OF MUD"]],
         shot: 1.6, still: 2.6}
    ar: {world: "وادي وسط الصحرا", boss: "المطر", sub: "أبراج من طين  ·  والطين يذوب مع المطر", unlocked: "شبام",
         stamp: "يذوب", chips: [["~500", "بيت برج"], ["11", "دور"], ["30+ m", "من الطين"]],
         shot: 1.6, still: 2.6}
  - kit: greatwall
    music: ondol
    color: "#9BE08A"
    en: {world: "CHINA", boss: "2,000 YEARS", sub: "RAIDERS  ·  RAIN  ·  CRUMBLING MORTAR", unlocked: "THE GREAT WALL",
         stamp: "CRUMBLING", chips: [["21,196", "KM OF WALL"], ["2,000+", "YEARS OF BUILDING"], ["0", "SEEN FROM THE MOON"]],
         shot: 1.1, still: 1.8}
    ar: {world: "الصين", boss: "ألفين سنة", sub: "غزاة على خيل  ·  وجير يتفتت مع المطر", unlocked: "سور الصين العظيم",
         stamp: "يتفتت", chips: [["21,196", "كيلو سور"], ["2,000+", "سنة بناء"], ["0", "من القمر"]],
         shot: 1.1, still: 1.8}
