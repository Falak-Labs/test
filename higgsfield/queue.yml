# Seedance job queue for the Build-It series (kit/series/SEEDANCE_STYLE.md). The hourly "Higgsfield runner" task
# takes the first job with status: todo, generates it on higgsfield.ai (unlimited mode only), and when it is done
# fetches it into the ai-media release as `file` and sets status: done + url. Other chats share the account:
# never start a job while History shows "Generating".
# status: todo | generating (started: <PT time>) | done | failed (why)
style: >-
  Cinematic photoreal 3D, documentary style, one consistent look, volumetric light, shallow depth of field,
  no text, no logos, no subtitles. Six shots with hard cuts, 5 seconds each.
jobs:
  - {id: taipei-A, build: 83, kit: taipei, status: done, file: buildit-taipei-sdA.mp4}
  - {id: taipei-B, build: 83, kit: taipei, status: done, file: buildit-taipei-sdB.mp4}

  - id: cooker-A
    build: 76
    kit: cooker
    status: done
    url: https://d8j0ntlcm91z4.cloudfront.net/user_3JVoPmIx9s2blaONPVU7QOaTPpM/hf_20261124_045937_078dee7d-f3a5-434e-a0ea-2d97fdc2c76c.mp4
    file: buildit-cooker-sdA.mp4
    shots: >-
      Shot 1 (0-5 s): extreme close-up of a steel pressure cooker on a gas flame, the whistle on the lid shrieks and
      shoots a jet of steam to the ceiling, slow push-in. Shot 2 (5-10 s): a mountain village kitchen high in the
      Andes, a pot of beans boiling for hours and still hard, a tired cook pokes them. Shot 3 (10-15 s): a heavy lid
      with a rubber ring is locked onto the pot with a twist, close-up of the seal closing tight. Shot 4 (15-20 s):
      the lid bulges and the pot rattles violently on the stove, the family steps back from the kitchen. Shot 5
      (20-25 s): close-up of a small weighted valve on the lid lifting and hissing, letting out a thin jet of steam.
      Shot 6 (25-30 s): the valve gets clogged with a bean skin, the pressure gauge needle climbs into the red.
  - id: cooker-B
    build: 76
    kit: cooker
    status: done
    url: https://d8j0ntlcm91z4.cloudfront.net/user_3JVoPmIx9s2blaONPVU7QOaTPpM/hf_20261124_051727_0a2c6fc9-40d1-48d6-8858-751ef3feed34.mp4
    file: buildit-cooker-sdB.mp4
    shots: >-
      Shot 1 (0-5 s): cutaway of the lid showing a small metal safety plug that melts and vents the steam sideways,
      calm. Shot 2 (5-10 s): a cook tries to twist the lid open while it is still full of pressure, the lid will not
      budge. Shot 3 (10-15 s): close-up of a little locking pin that pops up and holds the lid shut until the steam
      is gone, then drops. Shot 4 (15-20 s): a giant steel suspension bridge at sunrise rising out of thick fog, orange
      towers, slow drone push. Shot 5 (20-25 s): a busy Indian family kitchen, four pressure cookers whistling at
      once on one stove, grandma smiling calmly. Shot 6 (25-30 s): funny slow motion, a man opens a pressure cooker
      too early and a cloud of soup splashes onto the ceiling and his face, shocked expression.

