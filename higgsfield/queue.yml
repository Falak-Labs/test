# Seedance job queue for the Build-It series (kit/series/SEEDANCE_STYLE.md). The hourly "Higgsfield runner" task
# takes the first job with status: todo, generates it on higgsfield.ai (unlimited mode only), and when it is done
# fetches it into the ai-media release as `file` and sets status: done + url. Other chats share the account:
# never start a job while History shows "Generating".
# status: todo | "generating (started: <PT time>)" | done | "failed (why)"  (keep the quotes: a bare ": " breaks the YAML)
style: >-
  Cinematic photoreal 3D, documentary style, one consistent look, volumetric light, shallow depth of field,
  no text, no logos, no subtitles. Six shots with hard cuts, 5 seconds each.
jobs:
  - {id: taipei-A, build: 83, kit: taipei, status: done, file: buildit-taipei-sdA.mp4}
  - {id: taipei-B, build: 83, kit: taipei, status: done, file: buildit-taipei-sdB.mp4}

