  - id: hoover-A
    build: 84
    kit: hooverdam
    # Facts: 726 ft high, 660 ft thick at the base, 45 ft at the crest; an arch-gravity dam: the water's push
    # "travel[s] along the dam's great wall into the cliffs on both sides" (NPS, ASCE). The river went around the
    # site through four 56 ft tunnels (nearly 16,000 ft, 3 ft concrete lining, drilled by eight "jumbos" built on
    # 10-ton trucks; river turned into them Nov 1932). High scalers, lowered over the rim in safety belts or bosun
    # chairs, knocked loose rock off the walls with steel bars and drilled blast holes with 44 lb jackhammers;
    # summer days of 115-120 F.
    # One pour would take "125 years for the concrete to cool" (usbr.gov/lc/hooverdam/History/essays/concrete.html
    # and tunnels.html; nps.gov/articles/nevada-and-arizona-hoover-dam.htm; ASCE landmark page; PBS American
    # Experience "The Men Who Built the Dam").
