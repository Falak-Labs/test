  title: "How a Humanoid Robot Keeps Its Balance 🤖"
  text: |
    How does a robot on two legs not fall over? 🤖
    An inner ear that feels every tilt, its weight moved over one foot before every step, thousands of copies practicing in a computer, and touch sensors so it can hold an egg without crushing it.
    Would you let it fold your laundry? 👇
  next: "a stadium that cools itself 🏟️"
  seo: "Humanoid robot engineering: an IMU (the robot's inner ear) and joint motors correcting balance hundreds of times a second, shifting the center of mass over the standing foot before each step, reinforcement learning in simulation with thousands of robots and years of practice in hours, tactile sensors in the fingertips for grip force, Beijing's 2025 humanoid robot half marathon: 21 km, the fastest robot in 2 h 40 min with three battery changes."
