  title: "إزاي الروبوت اللي شبه البني آدم بيمشي من غير ما يقع؟ 🤖"
  text: |
    إزاي روبوت على رجلين ما يقعش؟ 🤖
    ودن من جوه بتحس بأي ميلة، ووزنه بيتنقل على رجل واحدة قبل كل خطوة، وآلاف النسخ منه بتتمرن في الكمبيوتر، وحساسات لمس في صوابعه عشان يمسك البيضة من غير ما يفعصها.
    تبعته يجيب العيش؟ 👇
  next: "استاد بيبرّد نفسه 🏟️"
  seo: "الروبوت اللي شبه البني آدم من جوه: حساس توازن زي الودن الداخلية وموتورات بتعدل وقفته مئات المرات في الثانية، نقل الوزن على الرجل التانية قبل كل خطوة، تمرين آلاف النسخ في محاكاة على الكمبيوتر، حساسات لمس في الصوابع، ونص ماراتون الروبوتات في بكين: واحد وعشرين كيلو في ساعتين وأربعين دقيقة لأسرع روبوت."
