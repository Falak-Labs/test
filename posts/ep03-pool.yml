  title: "مسبح يختفي ويصير حوش بضغطة زر 🤯 كيف يشتغل؟"
  text: |
    حوش ينزل ويصير مسبح بضغطة زر 🤯
    يبدأ بأرضية خشب تطفي فوق الموية، ويخرب أربع مرات: ينقلب، ما يرضى ينزل، الموية ما تلقى لها مكان، وعوامة تعلق تحته.
    تتجرأ توقف عليه؟ 👇
  next: "قطار موت 🎢"
  seo: "أرضية ستانلس ستيل فيها غرف هوا، كيابل وبكرات، مكبس يشتغل بالموية، فتحة حول الطرف تمشي فيها الموية، وحساسات أمان."
