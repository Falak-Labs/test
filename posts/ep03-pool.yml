en:
  title: "How a Disappearing Pool Works (Patio to Pool in 5 Min) 🤯"
  text: |
    A patio that sinks into a pool at the press of a button 🤯
    It starts as a floating deck. Then it breaks 4 times: it tips, it won't go down, the water has nowhere to go, and a pool float gets stuck under it.
    Would you stand on it? 👇
  next: "a roller coaster 🎢"
  seo: "How a hidden pool floor works: a stainless steel deck with air chambers, cables and pulleys, a piston that runs on water, a gap for the water to flow around, and safety sensors."
