  title: "إزاي توربينة الرياح بتعمل كهربا من الهوا؟ 🌬️"
  text: |
    لفة واحدة من ريشها تشغّل بيت يومين كاملين! 🌬️
    ريش زي جناح الطيارة عشان الهوا يرفعها، وراس بتلف في وش الهوا، وفتيس بيكبّر اللفة مية مرة، وريش بتلف بحرفها لما تيجي عاصفة.
    شوفتها على طريق الزعفرانة؟ 👇
  next: "تلسكوب فضائي 🔭"
  seo: "توربينة الرياح من جوه: ريش زي جناح الطيارة بتلف بالرفع مش بالزق، دوّارة هوا ومواتير بتلف الراس في وش الهوا، فتيس بيحوّل حوالي عشر لفات في الدقيقة لأكتر من ألف للمولّد، والريش بتلف بحرفها وقت العاصفة والفرامل بتقفلها. ريشة طولها مية وسبعة متر، لفة واحدة تشغّل بيت يومين، طرف الريشة أسرع من تلتمية كيلو في الساعة، وريشة سودا قللت خبطات الطيور حوالي سبعين في المية. مزارع الرياح في الزعفرانة وجبل الزيت على البحر الأحمر."
