  title: "How a Wind Turbine Makes Power From Thin Air 🌬️"
  text: |
    One turn of its blades can power a home for two days. 🌬️
    Blades shaped like airplane wings so the wind lifts them, a head that turns to face the wind, a gearbox that spins the generator a hundred times faster, and blades that turn their edges into a storm.
    Would you live next to one? 👇
  next: "a space telescope 🔭"
  seo: "How a wind turbine works: wing-shaped blades turned by lift, not push; a wind vane and yaw motors that turn the head into the wind; a gearbox that turns about ten rotor turns a minute into over a thousand for the generator; pitch control that turns the blades edge-on in a storm, then a brake. GE's Haliade-X: 107 m blades, one turn powers a home for two days. Blade tips faster than 300 km/h. Painting one blade black cut bird deaths about 70% at Smøla, Norway."
