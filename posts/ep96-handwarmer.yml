  title: "دفاية اليد: تسخن لأنها تتجمد 🧤"
  text: |
    تطق قرص حديد صغير، والسائل البارد يقلب كريستال حار! 🧤
    الكيس فيه ملح مذوب (نفس ملح شيبس الملح والخل) يظل سائل وهو أبرد من درجة تجمده بواجد. الضغطة تبدأ حبة كريستال، والباقي يلحقها مثل الدومينو، ولما يصير صلب يطلع حرارة: حوالي ٥٤ درجة. تغليه كم دقيقة ويرجع جاهز. واللي ينرمى يخلي برادة الحديد تصدّي بقصد ويدفي لساعات.
    مرة جلست على وحدة بالغلط؟ 👇
  next: "متحف شكله خاتم فضي 🏛️"
  seo: "كيف تشتغل دفاية اليد: الكيس فيه محلول أسيتات الصوديوم أبرد من درجة تجمده (حوالي ٥٤ درجة). لما تطق القرص الحديد الصغير تبدأ حبة كريستال، والتبلور ينتشر في الكيس ويطلع الحرارة اللي كانت مخزنة في السائل، فيسخن لحوالي ٥٤ درجة. تغليه كم دقيقة والكريستال يذوب ويرجع جاهز. والدفاية اللي تنرمى تسخن لما برادة الحديد تصدّي مع الهوا، بمساعدة الملح والموية والفحم والفيرميكوليت، لين حوالي عشر ساعات."
