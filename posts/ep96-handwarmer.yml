  title: "Hand Warmer: It Gets Hot by Freezing 🧤"
  text: |
    Click a tiny metal disc and the cold liquid turns into hot crystals. 🧤
    The pouch holds a salt solution (the same salt that flavors salt and vinegar chips) that stays liquid far below its freezing point. The click starts one crystal, the rest follow like dominoes, and turning solid lets out heat: about 54 °C. Boil it a few minutes and it's ready again. The throwaway kind rusts iron powder on purpose and stays warm for hours.
    Ever sat on one by accident? 👇
  next: "a museum shaped like a silver ring 🏛️"
  seo: "How a reusable hand warmer works: the pouch holds sodium acetate solution supercooled below its freezing point (about 54 °C). Flexing the small metal disc starts a crystal, crystallization spreads through the pouch and releases the heat stored in the liquid, warming it to about 54 °C. Boiling the pouch for a few minutes melts the crystals so it can be used again. Disposable hand warmers heat up when iron powder rusts in air, helped by salt, water, activated carbon and vermiculite, for up to about ten hours."
