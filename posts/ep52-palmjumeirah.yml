  title: "نخلة جميرا: جزيرة على شكل نخلة طالعة من البحر 🌴"
  text: |
    طلّعوا نخلة من وسط البحر، والناس عايشة عليها! 🌴
    ستاشر سعفة حواليها بلاج، ورمل اتشفط من قاع البحر واترشّ في الهوا على شكل قوس، وهلال صخر طوله حداشر كيلو يصد العواصف، ومكن عملاق بيترج عشان الرمل ميسيحش لو حصل زلزال.
    تسكن على سعفة؟ 👇
  next: "تلاجة 🧊"
  seo: "إزاي نخلة جميرا في دبي اتبنت: دبي شطها الطبيعي قصير، فعملوا جزيرة جديدة على شكل نخلة، جذع وستاشر سعفة، عشان يكسبوا أكبر طول بلاج. رمل الصحرا ناعم أوي والموج يشيله، فالمراكب شفطت حوالي أربعة وتسعين مليون متر مكعب رمل من قاع البحر ورشّته في الهوا على شكل قوس، وبيسمّوها قوس قزح، والمراكب ماشية بالأقمار الصناعية. وحواليها هلال صخر طوله حوالي حداشر كيلو، فيه حوالي سبعة مليون طن صخر، كل صخرة حطها ونش، يصد العواصف والموج. والرمل المبلول ممكن يسيح زي الشوربة لو حصل زلزال، فغرزوا فيه مكن عملاق بيترج يرصّ الحبايات في بعض. وفي الهلال فتحتين عشان مية البحر تدخل وتتجدد. والجزيرة نفسها معمولة من رمل وصخر بس، من غير حديد ولا خرسانة، والبناء بدأ سنة ألفين وواحد."
