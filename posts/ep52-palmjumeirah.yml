  title: "Palm Jumeirah: An Island Shaped Like a Palm Tree 🌴"
  text: |
    They grew a palm tree out of the sea, and people live on it. 🌴
    Sixteen fronds lined with beach, sand sucked off the sea floor and sprayed into place in huge arcs ("rainbowing"), an 11 km crescent of rock against the storms, and giant vibrating probes that shake the sand tight so it can't turn to soup in an earthquake.
    Would you live on a frond? 👇
  next: "a refrigerator 🧊"
  seo: "How Dubai's Palm Jumeirah was built: Dubai had only a short natural coastline, so a new island was shaped like a palm tree, a trunk and sixteen fronds, to add as much beach as possible. Desert sand is too fine and would be washed away, so dredgers sucked about 94 million cubic meters of sand off the sea floor and sprayed it into place in high arcs, a technique called rainbowing, steered by satellite positioning. A crescent breakwater about 11 km long, made of about 7 million tonnes of rock with every boulder placed by crane, protects the fronds from storms and waves. Loose wet sand can liquefy in an earthquake, so the island was compacted with vibrating probes (vibro-compaction) that shake the grains tight. Two gaps in the crescent let fresh sea water flow in so the lagoon doesn't go stale. The island itself was built from sand and rock, with no concrete or steel, and astronauts photograph it from space. Building started in 2001."
