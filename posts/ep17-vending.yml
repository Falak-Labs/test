en:
  title: "How a Vending Machine Knows Your Snack Dropped 🥤"
  text: |
    How does a vending machine know you got your snack? 🥤
    It checks every coin for size and metal, scans bills with light, turns a spiral exactly once, and watches light beams at the bottom. Nothing falls? It tries again.
    What's the worst thing that ever got stuck on you? 👇
  next: "a metro 🚇"
