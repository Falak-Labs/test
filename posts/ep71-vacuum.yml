ar:
  at: "2026-11-24T11:00:00Z"    # 03:00 PT Tue Nov 24 = 2 pm Riyadh
  title: "المكنسة الكهربا: إعصار داخل علبة 🌪️"
  text: |
    المكنسة ما تشفط فعليا: هوا الغرفة نفسه يدف الوساخة داخلها! 🌪️
    مروحة تلف أكثر من مية ألف لفة بالدقيقة تطلّع الهوا من علبة مقفلة، والضغط داخلها يطيح، وهوا الغرفة يندفع من الفتحة ومعه الوساخة. وفرشاة تلف تضرب الزولية وتطيّر الوساخة، وإعصار صغير داخلها يرمي الغبار في العلبة، وفلتر يمسك ذرات أنعم من الشعرة بميتين مرة. وفي ألف وتسعمية وواحد، هيوبرت بوث جرّب الفكرة وشفط كرسي بفمه من ورا منديل!
    روبوت المكنسة حقكم يعلق بعد؟ 👇
  next: "أبراج بتروناس والجسر اللي بينها 🌉"
  seo: "كيف تشتغل المكنسة الكهربا: الموتور يلف مروحة تطلّع الهوا من جسم المكنسة المقفل، فيصير الضغط داخلها أقل من ضغط الهوا في الغرفة، وهوا الغرفة يدف نفسه داخل من الفتحة ومعه الغبار والفتات. وفي راس المكنسة فرشاة تلف تضرب الزولية وتطلّع الوساخة من بين الشعر للهوا. في مكنسة الكيس، الهوا يعدي من كيس فيه مسام صغيرة يمسك الوساخة، بس كل ما تنسد المسام يضعف الهوا ويضعف الشفط. وفي مكنسة الإعصار، الهوا يلف بسرعة داخل مخروط، والغبار الثقيل ينرمي على الجدار ويطيح في العلبة، وجيمس دايسون سوى خمسة آلاف ومية وسبعة وعشرين نموذج قبل أول مكنسة بدون كيس، والفكرة جته من إعصار ينشّف نشارة الخشب في منشرة. وأنعم غبار يمسكه فلتر مثل فلتر الهيبا اللي يمسك تسعة وتسعين بالمية من الذرات اللي حجمها ثلاثة من عشرة من الميكرون، يعني أنعم من الشعرة بمئات المرات. والمواتير الحديثة تلف لين مية وخمسة وعشرين ألف لفة بالدقيقة. والسالفة: في ألف وتسعمية وواحد، المهندس البريطاني هيوبرت سيسل بوث جرّب فكرة الشفط وحط منديل على كرسي مغبّر في مطعم وشفط بفمه، وبعدها سوى مكينة يجرها حصان، توقف في الشارع وخراطيمها تدخل البيوت من الشبابيك."
