  title: "Vacuum Cleaner: A Tornado in a Box 🌪️"
  text: |
    Your vacuum doesn't really suck: the air in the room shoves the dirt in. 🌪️
    A fan spinning over 100,000 times a minute throws air out of a sealed can, the pressure inside drops, and the room's air rushes in through the nozzle with the dirt. A spinning brush beats the dirt out of the carpet, a little tornado flings the dust out of the air into the bin, and a filter catches specks hundreds of times thinner than a hair. In 1901 Hubert Booth tested the idea by sucking a dusty chair through a handkerchief.
    Does your robot vacuum get stuck too? 👇
  next: "the Petronas Twin Towers and their sky bridge 🌉"
  seo: "How a vacuum cleaner works: a fan (the impeller) driven by the motor throws air out of the machine's sealed body, so the pressure inside drops below the air pressure in the room, and the room's air pushes in through the nozzle, carrying dust and crumbs with it. A rotating brush roll in the floor head beats the carpet and lifts dirt out of the pile into the airflow. In a bag vacuum the air passes through a porous bag that traps the dirt, but as the pores fill up the airflow and the suction drop. A cyclone vacuum spins the air fast inside a cone, so the heavier dust is flung against the wall and falls into a bin; James Dyson, inspired by the cyclone that separated sawdust at a sawmill, built 5,127 prototypes before his first bagless vacuum. The finest dust is caught by filters such as HEPA filters, rated to trap 99.97% of particles 0.3 microns across, hundreds of times thinner than a human hair. Modern cordless motors spin at up to about 125,000 revolutions a minute. History: in 1901 the British engineer Hubert Cecil Booth tested the idea of suction by putting a handkerchief on a dusty restaurant chair and sucking through it, then built a horse-drawn, engine-powered machine nicknamed 'Puffing Billy' that parked in the street and ran long hoses in through the windows. In 1907 James Spangler, a janitor in Ohio, built a portable electric vacuum and sold his patent to William Hoover."
