  title: "ساعة بيغ بن: تنضبط بقروش قديمة 🕰️"
  text: |
    أشهر ساعة في العالم يضبطونها بكم قرش قديم فوق البندول! 🕰️
    بندول طوله قرابة أربعة متر يتك كل ثانيتين، وميزان بالجاذبية عشان هوا العقارب ما يوصل له، وعقارب نحاس أطول من أربعة متر على وجه عرضه سبعة متر، وكل قرش يسرّعها أقل من نص ثانية في اليوم. والمفاجأة: بيغ بن هو الجرس مو البرج، وانشق من أول سنة وللحين يدق.
    وأنت، خمس دقايقك كم ساعة؟ 👇
  next: "شبام، ناطحات سحاب من طين 🏜️"
  seo: "كيف ساعة بيغ بن مضبوطة: الساعة الكبيرة في برج إليزابيث في لندن بدأت تشتغل سنة ألف وثمنمية وتسعة وخمسين. الفلكي الملكي جورج إيري طلب إن أول دقة في كل ساعة تكون مضبوطة لحد الثانية، وتنفحص مرتين في اليوم بالتلغراف مع مرصد غرينتش. البندول طوله حوالي ثلاثة متر وتسعين سانتي، ووزنه حوالي ثلاثمية كيلو، ويتك مرة كل ثانيتين. وإدموند دينيسون صمم ميزان بالجاذبية: ذراعين صغار يعطون البندول نفس الدفّة الصغيرة كل مرة، عشان الهوا والثلج والطيور اللي تدف العقارب الكبيرة برا ما يلخبطون نبضه. أول عقارب كانت حديد صب وثقيلة لدرجة إن الساعة ما قدرت تلفها، فبدلوها بعقارب نحاس أخف، طولها حوالي أربعة متر وعشرين سانتي، على وجه عرضه سبعة متر من ثلاثمية واثنعش قطعة زجاج. ولضبط الوقت يحطون قروش إنجليزية قديمة على رف صغير فوق البندول أو يشيلونها: كل قرش يرفع مركز الثقل شوي ويخلي الساعة تسرّع حوالي أربعة أعشار الثانية في اليوم. وبيغ بن في الأصل اسم الجرس الكبير اللي وزنه حوالي أربعطعش طن، مو الساعة ولا البرج، وانشق سنة ألف وثمنمية وتسعة وخمسين بعد أشهر من أول دقة، ولفّوه عشان المطرقة تضرب مكان ثاني، وللحين يدق وهو مشقوق."
