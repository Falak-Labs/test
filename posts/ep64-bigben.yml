  title: "Big Ben's Clock: Kept on Time With Old Pennies 🕰️"
  text: |
    The most famous clock in the world is fine-tuned with a stack of old pennies. 🕰️
    A pendulum almost 4 meters long that ticks every 2 seconds, a gravity escapement so the wind on the hands never reaches it, copper minute hands over 4 meters long on 7-meter dials, and pennies on the pendulum: each one makes it gain 0.4 seconds a day. The twist: Big Ben is the bell, not the tower, and it has rung cracked since its first year.
    Are you always "on my way"? 👇
  next: "Shibam, the mud skyscraper city 🏜️"
  seo: "How Big Ben's clock keeps time: the Great Clock of Westminster in London's Elizabeth Tower was started in 1859. The Astronomer Royal, George Airy, asked for the first stroke of every hour to be right to within a second, checked twice a day by telegraph with the Royal Observatory in Greenwich. Its pendulum is about 3.9 m long, weighs about 300 kg and beats once every two seconds. Edmund Beckett Denison designed a double three-legged gravity escapement: two small gravity arms give the pendulum the same small push on every swing, so the wind, snow or birds pushing on the huge hands outside cannot disturb its beat. The first cast-iron minute hands were too heavy for the clock to turn, so they were replaced with lighter copper ones, about 4.2 m long, sweeping dials 7 m wide made of 312 pieces of glass. To adjust the time, keepers add or remove old pre-decimal pennies on a small shelf on the pendulum: each penny raises its centre of mass a little and makes the clock gain about 0.4 seconds a day. Big Ben is really the name of the 13.7-tonne Great Bell, not the clock or the tower; it cracked in 1859, months after it first rang, was turned so the hammer strikes a new spot, and still rings with its crack today."
