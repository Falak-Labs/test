  title: "Eiffel Tower: 18,000 Iron Pieces in Two Years 🗼"
  text: |
    300 meters of iron over Paris, built in just two years. 🗼
    Open iron lace the wind blows straight through, iron boxes full of pumped-in air so workers could dig down to firm ground by the river, hydraulic jacks that nudged the legs into line a millimeter at a time, and two and a half million red-hot rivets.
    Have you taken the pinch photo? 👇
  next: "the Suez Canal 🚢"
  seo: "How the Eiffel Tower was built: it went up in Paris in about two years (1887-1889) for the 1889 World's Fair, 300 meters of wrought iron, the tallest structure in the world for about 40 years. A solid tower that tall would catch the wind like a sail, so it is an open lattice the wind blows through, and the curve of its four legs carries the wind's push down to the ground. Two legs stand near the Seine on soft, wet ground, so their foundations were dug inside iron caissons filled with compressed air that kept the water out while workers dug down to firm ground. The legs lean inward and had to meet exactly at the first platform, 57 meters up: hydraulic jacks at the feet adjusted each leg a millimeter at a time. Its 18,038 iron parts are held together by about 2.5 million rivets, heated red hot and hammered in; as they cool they shrink and clamp the pieces tight. It is repainted by hand about every seven years with about 60 tonnes of paint, in three shades that get lighter toward the top so it looks one color. It was meant to stand for only 20 years, it grows up to about 15 cm in summer heat, and melted down its iron would make a layer only about 6 cm thick over its base."
