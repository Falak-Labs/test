  title: "برج إيفل: تمنتاشر ألف حتة حديد في سنتين 🗼"
  text: |
    تلتميت متر حديد فوق باريس، اتبنوا في سنتين بس! 🗼
    حديد مخرّم زي الدانتيلا والهوا يعدّي منه، وصناديق حديد مليانة هوا مضغوط عشان العمال يحفروا جنب النهر وهي ناشفة، وجاك هيدروليك يظبط الرجول مللي مللي، ومليونين ونص مسمار برشام أحمر نار.
    اتصورت الصورة إياها؟ 👇
  next: "قناة السويس 🚢"
  seo: "إزاي برج إيفل اتبنى: اتبنى في باريس في حوالي سنتين، من سنة ألف تمنمية سبعة وتمانين لسنة ألف تمنمية تسعة وتمانين، عشان معرض باريس، تلتميت متر حديد، وفضل أعلى مبنى في العالم حوالي أربعين سنة. البرج المقفول بالطول ده كان هيمسك الهوا زي الشراع، فاتعمل حديد مخرّم الهوا يعدّي منه، ورجليه المقوّسة بتوصّل زقة الهوا للأرض. رجلين منهم جنب نهر السين على أرض طرية ومبلولة، فاتحفر أساسهم جوه صناديق حديد مليانة هوا مضغوط يمنع المية، والعمال يحفروا لحد الأرض الجامدة. والرجول مايلة لجوه ولازم تتقابل بالظبط عند الدور الأول على ارتفاع سبعة وخمسين متر، فحطوا جاك هيدروليك تحت كل رجل يظبطها مللي مللي. وفيه حوالي تمنتاشر ألف حتة حديد ماسكين في بعض بحوالي مليونين ونص مسمار برشام بيتحطوا وهما أحمر نار، ولما يبردوا يتقلصوا ويقفلوا على الحديد. وبيتدهن بالإيد كل حوالي سبع سنين بحوالي ستين طن بوية، بتفتّح لفوق عشان يبان لون واحد. وكان المفروض يتشال بعد عشرين سنة، وبيطول لحد خمستاشر سانتي في حر الصيف، ولو سيّحته يبقى لوح سمكه حوالي ستة سانتي."
