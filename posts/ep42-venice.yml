  title: "فينيسيا: مدينة واقفة على غابة مقلوبة 🛶"
  text: |
    مدينة كاملة واقفة على ملايين جذوع الشجر المقلوبة في طين البحر، من ستاشر قرن! 🛶
    عواميد خشب اتدقت بالإيد والعمال بيغنوا على الدقة، لفّة لفّة من برة لجوة، والطين ماسكها بالاحتكاك، ومن غير هوا الخشب مبيعفّنش، وحجر استريا بيمنع الملح يطلع في الطوب.
    تسكن في بيت واقف على خشب؟ 👇
  next: "سور الصين العظيم 🧱"
  seo: "إزاي فينيسيا واقفة على عواميد خشب: المدينة اتبنت على جزر في بحيرة أرضها طين طري. عمال اسمهم الباتيبالي دقوا ملايين العواميد الخشب في الطين بإيديهم، حوالي تسعة في كل متر، لفّة لفّة من برة لجوة، وكانوا بيغنوا عشان يمشوا على نفس الدقة. العواميد قصيرة، من أقل من متر لحد تلاتة متر ونص، ومبتوصلش للصخر، بس الطين بيحضنها جامد والاحتكاك هو اللي شايل الوزن. وتحت في الطين والمية مفيش هوا، فلا عفن ولا حشرات، والعواميد تعيش قرون. بعدها بيقصوا العواميد على مستوى واحد تحت المية، ويحطوا فوقها ألواح خشب تخينة، وتبدأ كل حيطة بحجر استريا، وده حجر جيري مقفول بيمنع مية البحر المالحة تطلع في الطوب. كوبري ريالتو لوحده واقف على حوالي أربعتاشر ألف عمود، وعمر فينيسيا حوالي ستاشر قرن."
