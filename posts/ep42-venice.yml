  title: "Venice: A Whole City Standing on an Upside-Down Forest 🛶"
  text: |
    A whole city standing on millions of upside-down tree trunks, in the mud of a lagoon, for 1,600 years. 🛶
    Crews hammered wooden piles in by hand, singing to keep the beat, nine per square meter, in a spiral from the outside in. The mud grips them, there's no air down there so they don't rot, and a band of dense stone stops the salt from climbing into the bricks.
    Would you live on wooden sticks? 👇
  next: "the Great Wall of China 🧱"
  seo: "How Venice stands on wooden piles: the city was built on islands in a lagoon whose floor is soft mud. Workers called battipali drove millions of short wooden piles (larch, oak, alder, pine, spruce and elm, from under 1 m to 3.5 m long) into the mud by hand, about nine per square metre, in a spiral from the outside in, singing to keep the rhythm. The piles do not reach bedrock: the packed mud grips them and friction carries the weight. Buried in mud and water with no oxygen, they are safe from fungi and insects (bacteria work only very slowly), so they last for centuries. The tops were sawn level below the water and covered with thick wooden boards, and walls start on Istrian stone, a dense limestone that stops salt water from creeping up into the brick. The Rialto Bridge stands on about 14,000 piles. Venice is about 1,600 years old."
