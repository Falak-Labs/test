  title: "ماتشو بيتشو: مدينة ما انزلقت من الجبل خمس قرون ⛰️"
  text: |
    مدينة حجر على جبل حاد، يطيح عليها مترين مطر بالسنة، وما انزلقت خمس قرون! ⛰️
    مئات المدرجات معبّاة طبقات: حجر وحصى ورمل وتربة عشان المطر ينزل ويطلع، وقناة حجر تجيب موية العين للنوافير، وكل حجر مقصوص على جاره لين الورقة ما تدخل بينهم.
    تقدر تطلع كل هالدرج؟ 👇
  next: "السد العالي في أسوان 🌊"
  seo: "كيف صمدت ماتشو بيتشو: مدينة الإنكا انبنت حوالي سنة ألف وأربعمية وخمسين للإمبراطور باتشاكوتي، على ارتفاع ألفين وأربعمية وثلاثين متر في جبال الأنديز في بيرو، فوق حافة جبل حادة وفوق صدوع زلازل، ويطيح عليها حوالي مترين مطر بالسنة. المهندس كينيث رايت قدّر إن حوالي ستين بالمية من شغلها تحت الأرض: أساسات وتصريف. المدرجات جدران حجر معبّاة طبقات: حجر كبير تحت، بعدين حصى، بعدين رمل، وفوقها تربة، فالمطر ينزل ويطلع بدل ما يتجمع ويدف الجدار. وقناة حجر طولها حوالي سبعمية وخمسين متر تنزّل موية العين بميل خفيف لست عشرة نافورة، وحوالي مية وثلاثين فتحة تصرّف السيول. الجدران بدون أسمنت، وكل حجر مقصوص على جاره لين الورقة ما تدخل بينهم، والأبواب والشبابيك مايلة لداخل. والإسبان ما لقوها أبد."
