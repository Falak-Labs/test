  title: "Machu Picchu: The City That Never Slides Off Its Mountain ⛰️"
  text: |
    A stone city on a knife-edge mountain, in two meters of rain a year, that hasn't slid in five centuries. ⛰️
    Hundreds of terraces filled in layers of stones, gravel, sand and topsoil drain the rain, a stone canal feeds 16 fountains, and the stones are cut so tight that paper won't slip between them. About 60% of the work is underground.
    Would you climb all those steps? 👇
  next: "the Aswan High Dam 🌊"
  seo: "How Machu Picchu survives: the Inca city, built around 1450 as a royal estate for the emperor Pachacuti about 2,430 m up in Peru's Andes, sits on a steep ridge on top of geological faults and gets about 2,000 mm of rain a year. Civil engineer Kenneth Wright estimated that about 60 percent of its construction is underground: foundations and drainage. Its terraces are retaining walls filled in layers, large stones at the bottom, then gravel, sandy material and topsoil, so rain drains through instead of building up and pushing the walls out. A stone canal about 749 m long brings spring water down a slope of about 3 percent to a staircase of 16 fountains, and about 130 drainage holes carry runoff away to a main drain. The ashlar walls use no mortar and are cut so tightly that a sheet of paper won't fit between the stones, with trapezoid doors and windows that lean inward. The Spanish never found it; Hiram Bingham brought it to world attention in 1911."
