  title: "إزاي اتحفرت البترا في الجبل؟ 🏜️"
  text: |
    قصر أربعين متر محفور في الجبل نفسه، من غير ولا طوبة! 🏜️
    حفروه من فوق لتحت، ومدّوا مواسير فخار في حيطة الوادي من عين مية لحد المدينة، وعملوا سد ونفق يلفّوا السيل بعيد، وخبّوها في آخر ممر عرضه تلاتة متر في حتت.
    نفسك تزور البترا؟ 👇
  next: "برج خشب ياباني بيرقص مع الزلازل 🏯"
  seo: "إزاي الأنباط بنوا البترا في الأردن: واجهة الخزنة طولها حوالي أربعين متر، محفورة في صخر الجبل الوردي من حوالي ألفين سنة، والحفر كان بيبدأ من فوق وينزل لتحت. مدّوا مواسير فخار في قناة محفورة في حيطة السيق عشان المية توصل لمدينة فيها حوالي عشرين ألف واحد، وعملوا سد ونفق عند مدخل السيق يلفّوا السيل بعيد عن المدينة. المدينة مستخبية في آخر السيق، ممر متعرّج طوله حوالي كيلو ومتين متر، وعرضه في حتت تلاتة متر بس. مقابرها ومسرحها فضلوا مستخبيين عن أوروبا لحد ما الرحالة بوركهارت وصلها سنة ألف وتمنمية واتناشر. والعلامات اللي على الجرة فوق الخزنة من ناس كانوا بيضربوا عليها رصاص فاكرين جواها كنز."
