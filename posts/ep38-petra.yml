  title: "How Petra Was Carved Out of a Cliff 🏜️"
  text: |
    A palace 40 m tall, cut straight out of a cliff, without a single brick. 🏜️
    They carved from the top down, piped spring water through the canyon in clay pipes, dammed the canyon and dug a tunnel to send flash floods around the city, and hid it all at the end of a canyon only 3 m wide in places.
    Is Petra on your list? 👇
  next: "a Japanese pagoda that dances through earthquakes 🏯"
  seo: "How the Nabataeans built Petra in Jordan: the facade of the Treasury (Al-Khazneh) is about 40 m tall and was carved into the rose-red sandstone cliff around 2,000 years ago, working from the top down; clay pipes laid in a channel cut into the wall of the Siq brought spring water into a city of about 20,000 people; a dam and a tunnel at the Siq's entrance sent flash floods around the city; the city lies at the end of the Siq, a winding canyon about 1.2 km long and only 3 m wide at its narrowest. Its rock-cut tombs and theater stayed unknown to Europe until Johann Ludwig Burckhardt reached Petra in 1812. The marks on the Treasury's urn come from people who shot at it, believing it held treasure."
