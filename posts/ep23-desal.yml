  title: "How a Desalination Plant Turns the Sea Into Tap Water 💧"
  text: |
    How do you turn the sea into drinking water? 💧
    Boiling it would burn a mountain of fuel, so you squeeze seawater through a filter so tight that salt can't pass, at the pressure of 2,000 feet under the sea, and let the salty water leaving push the next batch in.
    Would you drink it? 👇
