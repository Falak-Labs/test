  title: "Dutch Storm Barrier: Two Steel Arms That Stop the Sea 🌊"
  text: |
    Two floating steel arms, each longer than two football fields, swing shut across a river to stop the North Sea. 🌊
    A quarter of the Netherlands is below sea level, so the hollow gates wait in dry docks, float out on giant ball joints, then fill with water and sink into a 22 m steel wall. A computer decides when, by itself.
    Would you hand the button to a computer? 👇
  next: "Venice, a city on wooden piles 🛶"
  seo: "How the Maeslantkering, the storm surge barrier on the Nieuwe Waterweg near Rotterdam, works: about a quarter of the Netherlands lies below sea level, and after the North Sea flood of 1953 the Delta Works were built. A dam here would close the shipping route to the Port of Rotterdam, Europe's biggest port, so the barrier has two hollow gates, each 210 m long and 22 m high, that wait in dry docks on the banks. Each is held by a steel truss arm 237 m long that weighs 6,800 tonnes and turns on a ball joint 10 m across, one of the largest moving structures on Earth. When a computer system predicts a storm surge 3 m above normal at Rotterdam, it closes the barrier by itself: the docks flood, the gates float out and meet in the middle, water is let into them and they sink to the bottom. Finished in 1997, it waited ten years for its first real storm (8 November 2007) and closed again for storm Pia in December 2023. It is tested every autumn."
