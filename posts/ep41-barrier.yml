  title: "حاجز العواصف الهولندي: ذراعين حديد توقف البحر 🌊"
  text: |
    ذراعين حديد، كل وحدة أطول من ملعبين، تسكّر النهر وتوقف بحر الشمال! 🌊
    ربع هولندا تحت مستوى البحر، والبوابات تنتظر في أحواض، تطفو وتلف على كورة حديد، وبعدين تتعبّى موية وتنزل القاع وتصير جدار حديد طوله اثنين وعشرين متر. والكمبيوتر هو اللي يسكّرها بروحه.
    تعطي الزر للكمبيوتر ولا تسكّرها بيدك؟ 👇
  next: "فينيسيا، مدينة واقفة على خشب 🛶"
  seo: "كيف يشتغل حاجز ميسلانت للعواصف قرب روتردام في هولندا: ربع هولندا تقريبًا تحت مستوى البحر، وبعد فيضان بحر الشمال سنة ألف وتسعمية وثلاثة وخمسين بنوا مشاريع الدلتا. النهر هنا طريق السفن لميناء روتردام، أكبر ميناء في أوروبا، فما ينفع يسكّرونه بسد. الحل بوابتين مجوفة، كل وحدة طولها ميتين وعشرة متر وارتفاعها اثنين وعشرين متر، تنتظر مفتوحة في أحواض على طرف النهر. كل بوابة لها ذراع حديد طوله ميتين وسبعة وثلاثين متر ووزنه ستة آلاف وثمنمية طن، يلف على كورة حديد عرضها عشرة متر. إذا توقّع الكمبيوتر إن البحر بيرتفع ثلاثة متر عند روتردام، يسكّر الحاجز بروحه: تتعبّى الأحواض موية، تطفو البوابات وتتقابل في النص، وبعدين تتعبّى هي موية وتنزل لقاع النهر. خلص بناه سنة سبعة وتسعين، وانتظر عشر سنين لين أول عاصفة جد سنة ألفين وسبعة، وسكّر مرة ثانية مع العاصفة بيا سنة ألفين وثلاثة وعشرين."
