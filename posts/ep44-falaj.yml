  title: "الفلج العماني: مية بتطلع من أرض الصحرا 💧"
  text: |
    مية بتطلع من أرض الصحرا من غير طلمبة ولا كهربا، بقالها خمستاشر قرن! 💧
    بير أم تحت الجبال، ونفق ميله خفيف خالص والجاذبية هي اللي بتجيب المية للقرية، وكل أرض ليها دور نص ساعة: بالنهار بالمزولة وبالليل بالنجوم.
    عيلتك تعرف تقسم كده؟ 👇
  next: "ماتشو بيتشو ⛰️"
  seo: "إزاي الأفلاج في عمان بتشتغل: في واحدة من أنشف الأماكن في الدنيا، بيحفروا بير أم لحد المية اللي تحت جبال الحجر، ساعات ستين متر. وبعدين يحفروا نفق راجع من القرية للبير، ميله خفيف خالص لدرجة إن الجاذبية لوحدها تجيب المية للغيطان، من غير طلمبة ولا كهربا. العمال كانوا بيحفروا بإيديهم في الحر والهوا الوحش، وساعات العامل يستحمل عشرين دقيقة بس، وفيه آبار من فوق للهوا والنور وطلعة الصخر، ومن الطيارة تبان زي خط منقط في الصحرا. المية بتتقسم بالوقت: كل نصيب حوالي نص ساعة من المية كلها، بالنهار بالمزولة وبالليل بالنجوم. والمية بتعدي على الشرب الأول، بعدين الاستحمام، بعدين الغسيل، وفي الآخر النخل والغيطان. لسه فيه أكتر من تلات آلاف فلج شغالين في عمان، وفيه منهم ممكن يكون عمره خمستاشر قرن، وخمسة منهم في قايمة التراث العالمي لليونسكو."
