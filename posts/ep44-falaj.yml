  title: "Omani Falaj: A Stream That Flows Out of the Desert 💧"
  text: |
    A stream that flows out of the desert ground with no pump and no power, for 1,500 years. 💧
    A mother well taps water deep under the mountains, a gently sloping tunnel lets gravity carry it out to the village, and every farm gets its half-hour turn, timed by a sundial by day and the stars by night.
    Could your family share water this fairly? 👇
  next: "Machu Picchu ⛰️"
  seo: "How Oman's aflaj (falaj irrigation channels) work: in one of the driest places on Earth, a mother well (umm al-falaj) is dug down to groundwater under the Hajar mountains, sometimes 60 m deep. A tunnel is then dug back from the village to the well, sloping so gently that gravity alone carries the water out to the fields, with no pump or power. Diggers worked by hand in heat and bad air, often only about 20 minutes at a time, and a line of access shafts brought air and light and let them haul up rock; from a plane they look like a dotted line across the desert. The water is shared by time: each share (athar) is about half an hour of the whole flow, timed by a sundial by day and by the stars at night. It reaches drinking water first, then bathing places, then washing, and only then the date palms and fields. More than 3,000 aflaj still flow in Oman, some may date to about AD 500, and five of them are a UNESCO World Heritage Site."
