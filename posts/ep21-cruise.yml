  text: |
    Why doesn't a 20-deck cruise ship tip over? 🚢
    The heavy stuff sits at the very bottom, two underwater wings cancel up to 90% of the rocking, a water factory below deck turns the sea into showers, and spinning propeller pods slide it sideways into the dock.
    Which deck would you live on? 👇
