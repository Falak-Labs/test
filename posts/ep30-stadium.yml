  title: "إزاي قطر برّدت استاد مفتوح في الصحرا؟ 🏟️"
  text: |
    إزاي تخلي استاد في الصحرا ساقع وسقفه مفتوح؟ 🏟️
    السقف بيضلل على الكراسي وحرفه زي جناح الطيارة عشان الهوا السخن يعدي من فوق، وهوا ساقع بيطلع من تحت كل كرسي، ومية متبردة بالليل بتفضل ساقعة لحد الماتش.
    هتاخد جاكيت معاك؟ 👇
  next: "توربينة رياح 🌬️"
  seo: "استادات كاس العالم في قطر من جوه: تبريد مكان الناس بس، فتحات تحت كل كرسي وفتحات كبيرة جنب الملعب، سقف متصمم ومتجرب في نفق هوا عشان الهوا السخن ما يدخلش، ألوان فاتحة برة، مية بتتبرد بالليل وتتخزن، والهوا بيرجع يتنضف ويتبرد تاني، حوالي واحد وعشرين درجة في الملعب، شغل الدكتور سعود عبد الغني اللي بيسموه دكتور كول."
