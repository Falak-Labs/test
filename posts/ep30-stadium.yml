  title: "How Qatar Cooled an Open-Air Stadium in the Desert 🏟️"
  text: |
    How do you keep a stadium cold in the desert with the roof wide open? 🏟️
    The roof shades the seats and its edge is shaped like a wing so the hot wind slides over, cold air blows from a grille under every seat, and water chilled at night keeps it cool for the match.
    Would you bring a jacket? 👇
  next: "a wind turbine 🌬️"
  seo: "How Qatar's 2022 World Cup stadiums were cooled: spot cooling of only the seats and the pitch, air outlets under every seat and big nozzles beside the pitch, a roof shaped and wind-tunnel tested to keep hot air out, light facade colors, chilled water made at night and stored, the air pulled back, filtered and cooled again, about 21°C on the pitch, the work of Qatar University's Dr Saud Abdulaziz Abdul Ghani, known as Dr Cool."
