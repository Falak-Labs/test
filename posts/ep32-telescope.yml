  title: "How the James Webb Telescope Sees 13 Billion Years Back 🔭"
  text: |
    A golden mirror taller than a giraffe, folded like origami to fit in a rocket. 🔭
    Gold to bounce the faint heat of the oldest galaxies, a sunshade the size of a tennis court, and tiny motors that line up 18 mirrors in steps ten thousand times thinner than a hair.
    What would you point it at? 👇
  next: "a robot camel jockey 🐪"
  seo: "How the James Webb Space Telescope works: a 6.5 m primary mirror of 18 gold-coated beryllium hexagons (about 48 grams of gold), side wings folded like a drop-leaf table to fit the Ariane 5 rocket, a five-layer Kapton sunshield about the size of a tennis court (85°C on the Sun side, -233°C on the cold side), actuators that move each segment in 10-nanometer steps until 18 images of a star become one, parked 1.5 million km from Earth, seeing galaxies more than 13 billion light-years away in infrared."
