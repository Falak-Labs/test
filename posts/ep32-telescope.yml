    دهب بيرجّع حرارة أقدم المجرات، وشمسية قد ملعب تنس، ومواتير صغيرة بتظبط تمنتاشر مراية لحد ما يبقوا مراية واحدة.
    تبص بيه على إيه؟ 👇
  next: "روبوت سباق الهجن 🐪"
  seo: "تلسكوب جيمس ويب من جوه: مراية عرضها ستة متر ونص من تمنتاشر حتة سداسية متغطية دهب (حوالي تمانية وأربعين جرام دهب)، جنابها بتتطبق عشان تدخل الصاروخ، شمسية من خمس طبقات قد ملعب تنس (خمسة وتمانين درجة ناحية الشمس وميتين تلاتة وتلاتين تحت الصفر في الضل)، مواتير بتحرك كل مراية خطوات أرفع من الشعرة بعشر تلاف مرة، على بعد مليون ونص كيلو من الأرض، وبيشوف مجرات بعيدة أكتر من تلتاشر مليار سنة ضوئية."
