  title: "Escalator: Half the Steps Ride Back Upside Down 🛍️"
  text: |
    Stairs that climb themselves, while half the steps ride back upside down under the floor. 🛍️
    A loop of steps on a chain pulled by a motor at the top, two pairs of wheels on two tracks that run level at the ends so the steps flatten out, a steel comb that lifts your shoelace off, and a handrail driven by the same motor.
    Do you walk up the escalator or just stand? 👇
  next: "the Sydney Opera House 🎭"
  seo: "How an escalator works: the steps are a loop on a chain, pulled around by an electric motor at the top, and under the floor the steps travel back upside down. Each step rides on two pairs of wheels running on two separate tracks: on the slope the tracks are apart and the steps form stairs, and at the top and bottom the tracks run level so the steps flatten into a moving floor you can step onto. At each end a comb plate with steel teeth sits in the grooves of the steps and lifts anything off before it can be pulled under. The rubber handrail is driven by the same motor, so it moves at the same speed as the steps. Jesse Reno built a moving inclined elevator at Coney Island in 1896, and the name escalator came with Charles Seeberger's design, shown by Otis at the 1900 Paris Exposition. London's first, at Harrods in 1898, worried shoppers so much that staff waited at the top with brandy and smelling salts. Escalators usually run at about half a meter a second; Moscow's Park Pobedy metro station has escalators about 126 m long, and a shopping center in Kawasaki, Japan has one with just five steps."
