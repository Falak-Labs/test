  title: "السلم الكهربا: نص درجه راجع مقلوب تحت الأرض 🛍️"
  text: |
    سلم بيطلّعك لوحده، ونص درجه راجع مقلوب تحت الأرض! 🛍️
    حلقة درج على جنزير وموتور فوق بيلفّها، وكل درجة على أربع عجل فوق قضيبين بيتساووا عند الطرفين عشان الدرج يفرد، ومشط حديد بيشيل رباط الجزمة، ودرابزين بيلف مع الدرج بنفس السرعة.
    انت بتطلع السلم الكهربا ماشي ولا واقف؟ 👇
  next: "أوبرا سيدني 🎭"
  seo: "إزاي السلم الكهربا بيشتغل: الدرج حلقة متركبة على جنزير، وموتور كهربا فوق بيلفّها، وتحت الأرض الدرج راجع مقلوب. كل درجة ماشية على أربع عجل فوق قضيبين منفصلين: على الطلعة القضيبين بيبعدوا عن بعض والدرج يبقى سلم، وعند الطرفين بيبقوا في مستوى واحد والدرج يفرد ويبقى أرض تعرف تطلع عليها. وعند كل طرف فيه مشط سنانه الحديد داخلة في مجاري الدرجة، يشيل أي حاجة قبل ما تدخل تحت. والدرابزين الكاوتش بيلفّه نفس الموتور، فبيمشي بنفس سرعة الدرج. أول سلم كهربا في لندن اتعمل في محل هارودز سنة ألف تمنمية تمانية وتسعين، والناس اتخضت لدرجة إن الموظفين كانوا واقفين فوق يفوّقوا اللي داخ. السلم الكهربا بيمشي حوالي نص متر في الثانية، وفي مترو موسكو سلم طوله حوالي مية ستة وعشرين متر، وفي اليابان واحد خمس درجات بس."
