  title: "Bedouin Tent: A House Woven From Goat Hair ⛺"
  text: |
    A house woven from goat hair that keeps out desert rain and still lets the breeze in. ⛺
    The black cloth throws deep shade and lets hot air slip out through the weave, wet goat hair swells and closes the gaps so the rain runs off, the walls are panels you pin down on the windy side, and the whole house packs onto a camel. Every strip is woven by hand.
    Have you ever slept in one? 👇
  next: "a washing machine 🧺"
  seo: "How a Bedouin black tent works: the bayt al-sha'ar, the house of hair, is woven from black goat hair by the women of the family on a loom laid out on the ground, in long narrow strips that are sewn together edge to edge to make the roof. The thick black cloth throws a deep shade in the desert sun, and the loose weave lets hot air rise and slip out. When it rains, the goat hair swells and closes the gaps in the weave, so the water runs off instead of dripping through. The side walls are separate woven panels pinned to the roof, so the family can close the side the wind and sand come from and open the other side to the breeze. The tent is held up by wooden poles and long ropes pegged into the sand, with no nails and no bricks, so it comes down quickly and packs onto a camel when the family moves with its herds. Inside, a woven curtain, often in red, white and black Sadu patterns, divides the tent into the guests' side, where the coffee is made, and the family's side. Al Sadu weaving is on UNESCO's list of intangible cultural heritage."
