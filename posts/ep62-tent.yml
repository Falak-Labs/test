  title: "بيت الشعر: بيت منسوج من شعر المعيز ⛺"
  text: |
    بيت منسوج من شعر المعيز، بيصد مطر الصحرا وبرضه بيعدّي النسمة! ⛺
    القماش الأسود بيعمل ضل تقيل والهوا السخن بيطلع من بين الخيوط، وشعر المعيز لما يتبل بينتفخ ويقفل الخروم والمطر يتزحلق، والحيطان ستاير بتنزّلها ناحية الهوا، والبيت كله بيتطوي ويركب على ضهر الجمل. وكل شريط فيه متنسوج بالإيد.
    عمرك نمت في خيمة زي دي؟ 👇
  next: "غسالة 🧺"
  seo: "إزاي خيمة البدو بتشتغل: بيت الشعر بيتنسج من شعر المعيز الأسود، والستات في العيلة بينسجوه على نول ممدود على الأرض، شرايط طويلة ورفيعة بتتخيط جنب بعض وتعمل السقف. القماش الأسود التقيل بيعمل ضل تقيل في شمس الصحرا، والنسيج المفتوح بيخلي الهوا السخن يطلع من بين الخيوط. ولما المطر ينزل، شعر المعيز بينتفخ ويقفل الخروم اللي في النسيج، فالمية تتزحلق من عليه بدل ما تنقط جوه. والحيطان ستاير منسوجة لوحدها بتتشبك في السقف، فالعيلة تقفل الناحية اللي جاي منها الهوا والرملة وتفتح الناحية التانية للنسمة. والبيت واقف على عواميد خشب وحبال طويلة متثبتة في الرملة، من غير ولا مسمار ولا طوبة، فبيتفك بسرعة ويركب على ضهر الجمل لما العيلة تتنقل ورا الغنم. وجوه البيت ستارة منسوجة، غالبًا بنقوش السدو الحمرا والبيضا والسودا، بتقسمه ناحية للضيوف فيها القهوة وناحية للعيلة. ونسيج السدو متسجل في قايمة اليونسكو للتراث."
