  title: "مترو الرياض: ١٧٦ كيلو وما فيه ولا سواق 🚇"
  text: |
    في الرياض أحلى مكان في القطار... مكان السواق! 🚇
    مترو الرياض فيه ست خطوط و٨٥ محطة وأكثر من ١٨٠ قطار، وولا واحد منها فيه سواق: الكمبيوتر يسوقها، وغرف تحكم تراقب كل قطار. حفروا أنفاق تحت المدينة ورفعوا السكة على أعمدة خرسانة فوق الشوارع، وتحت الصحرا لقوا موية جوفية كثيرة، وكانت أصعب شي في المشروع. وعلى الرصيف جدران زجاج ما تنفتح إلا مع أبواب القطار. وطوله ١٧٦ كيلو: أطول مترو بدون سواق في العالم.
    منشن واحد يقول إنه يسوق أحسن من الكمبيوتر 👇
  next: "كرسي تلفريك يفك الكيبل عن قصد 🚡"
  seo: "كيف يشتغل مترو الرياض: افتتحت الرياض مترو طوله ١٧٦ كيلومتر فيه ٨٥ محطة على ست خطوط بين ديسمبر ٢٠٢٤ ويناير ٢٠٢٥، وسجّلته موسوعة غينيس كأطول شبكة مترو بدون سائق في العالم. قطاراته تشتغل آلياً بالكامل بدون سائق، وتراقبها غرف تحكم مركزية، ووقت الذروة يجي قطار كل دقيقتين ونص تقريباً. حفرت مكائن حفر الأنفاق في الصخر الجيري تحت المدينة، وانبنت جسور خرسانية مسبقة الصب فوق الشوارع، وكانت المياه الجوفية أكبر تحدي في المشروع. المحطات مكيفة وفيها أبواب زجاجية على الرصيف، والقطارات محكمة ومفلترة ضد الرمل."
