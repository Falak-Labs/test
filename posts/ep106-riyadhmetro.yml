  title: "Riyadh Metro: 176 km of Trains and Not One Driver 🚇"
  text: |
    In Riyadh, the best seat on the train is… the driver's. 🚇
    The Riyadh Metro has six lines, 85 stations and over 180 trains, and not one of them has a driver: computers drive every train while control rooms watch them all. Boring machines dug tunnels under the city and concrete legs lift the rest over the streets, and under the desert the diggers hit so much groundwater that it became the job's biggest challenge. Glass walls line the platforms and open only when a train's doors do. At 176 km it's the longest driverless metro on Earth.
    Would you grab the front seat? 👇
  next: "a chairlift that lets go of its cable 🚡"
  seo: "How the Riyadh Metro works: Saudi Arabia's capital opened a 176-kilometer metro with 85 stations on six lines between December 2024 and January 2025, certified by Guinness World Records as the longest driverless metro network. Its trains run fully automatic with no onboard operators, overseen from central control rooms, and at peak a train arrives about every two and a half minutes. Tunnel boring machines cut through limestone under the city while precast concrete viaducts carried lines over the streets, and managing groundwater from underground aquifers was called the biggest challenge. The air-conditioned stations have platform screen doors, and the trains are sealed and filtered against desert sand."
