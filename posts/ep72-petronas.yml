  title: "Petronas Twin Towers: The Bridge That Slides 🇲🇾"
  text: |
    A bridge 170 m up that isn't bolted to either tower. 🌉
    The Petronas Twin Towers sway in the wind, each its own way, so the two-floor sky bridge rests on bearings and slides in and out of both towers. They are built of super-strong concrete because steel would have been shipped in at a huge price, the whole site was moved 60 m off limestone full of holes onto piles up to 114 m deep, and the bridge doubles as an escape route. Japan built one tower and Korea the other, in a race.
    Would you walk across it? 👇
  next: "the Lighthouse of Alexandria ⛵"
  seo: "How the Petronas Twin Towers' sky bridge works: the Petronas Towers in Kuala Lumpur, designed by César Pelli and finished in 1998, are 452 m tall with 88 floors, and they were the tallest buildings in the world until 2004. A two-storey sky bridge links them on the 41st and 42nd floors, 170 m above the street. The bridge, 58.4 m long and about 750 tonnes, is not bolted to the towers: it rests on bearings and slides in and out of each tower, because the two towers sway separately in strong wind and a rigid connection would break. It is held up by a two-hinged arch whose legs rest on bearings on the 29th floor of each tower, and it is also an escape route: if one tower has to be evacuated, people can cross to the other. Because imported steel was expensive, the towers were built of super high-strength reinforced concrete, which damps sway about twice as well as steel but makes the building about twice as heavy. Soil tests found the original site straddling limestone full of cavities and softer rock, so the towers were moved about 60 m to stand entirely on the softer rock, on 104 bored concrete piles up to about 114 m deep under a concrete raft 4.5 m thick. The floor plan is an eight-pointed star of two overlapping squares. Tower 1 was built by a consortium led by Japan's Hazama Corporation and Tower 2 by Korea's Samsung C&T and Kukdong, and the two teams raced each other to the top."
