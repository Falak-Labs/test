ar:
  at: "2026-11-24T14:00:00Z"    # 06:00 PT Tue Nov 24 = 5 pm Riyadh
  title: "أبراج بتروناس: الجسر اللي ينزلق 🇲🇾"
  text: |
    جسر على ارتفاع مية وسبعين متر، ولا هو مربوط في ولا برج! 🌉
    أبراج بتروناس تتمايل مع الهوا، كل برج على كيفه، فالجسر اللي بدورين قاعد على محامل، ويدخل ويطلع من البرجين. وانبنت من خرسانة قوية مرة لأن الحديد بينجاب من برا وسعره نار، وزحزحوا المكان ستين متر عن صخر جيري مليان فراغات، على أعمدة لين مية وأربعطعش متر تحت الأرض، والجسر طريق هروب بعد. واليابان بنت برج وكوريا الثاني، وصارت مسابقة!
    تمشي عليه ولا لا؟ 👇
  next: "منارة الإسكندرية ⛵"
  seo: "كيف جسر أبراج بتروناس يشتغل: أبراج بتروناس في كوالالمبور، صممها المعماري سيزار بيلي وخلصت سنة ألف وتسعمية وثمانية وتسعين، طولها أربعمية واثنين وخمسين متر وفيها ثمانية وثمانين دور، وكانت أطول مباني في العالم لين ألفين وأربعة. ويربطها جسر بدورين على الدور الواحد والأربعين والثاني والأربعين، على ارتفاع مية وسبعين متر عن الشارع. الجسر طوله حوالي ثمانية وخمسين متر ووزنه حوالي سبعمية وخمسين طن، وما هو مربوط في البرجين: قاعد على محامل ويدخل ويطلع من كل برج، لأن البرجين يتمايلون كل واحد على كيفه في الهوا القوي، والربط الثابت ينكسر. ويشيله قوس له رجلين قاعدة على محامل في الدور التاسع والعشرين من كل برج، وهو بعد طريق هروب: لو احتاجوا يطلّعون الناس من برج، يعبرون للبرج الثاني. ولأن الحديد المستورد كان غالي، انبنت الأبراج من خرسانة قوية مرة، تقاوم التمايل حوالي ضعف الحديد، بس تخلي المبنى أثقل بحوالي الضعف. وفحوصات الأرض لقت إن المكان الأول نصه صخر جيري مليان فراغات ونصه صخر ألين، فزحزحوا الأبراج حوالي ستين متر عشان توقف كلها على الصخر الألين، فوق مية وأربعة أعمدة خرسانة لين حوالي مية وأربعطعش متر تحت الأرض، وفوقها قاعدة خرسانة سماكتها أربعة متر ونص. وبرج بنته شركات يابانية تقودها هازاما، والثاني شركات كورية منها سامسونج، والفريقين تسابقوا لين فوق."
