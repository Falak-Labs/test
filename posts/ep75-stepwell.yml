  title: "Chand Baori: 3,500 Steps Down to Water 🪜"
  text: |
    An upside-down pyramid of 3,500 steps, dug all the way down to water. 🪜
    Chand Baori in Abhaneri, Rajasthan, is about 1,200 years old. In a land where it barely rains outside the monsoon, the square pit catches the rain and reaches the water underground. Steps line three walls so you can always walk down to the water as it sinks, the walls lean back in 13 stone floors so they don't cave in, and the stairs zigzag in pairs so lots of people can climb at once. The bottom is about 5°C cooler than the top.
    Would you climb all the way down? 👇
  next: "a pressure cooker 🍲"
  seo: "How the Chand Baori stepwell works: Chand Baori is a stepwell in the village of Abhaneri in Rajasthan, India, built around the 8th to 9th century and traditionally linked to King Chanda of the Nikumbha dynasty. It is one of the deepest and largest stepwells in India: about 30 m deep, with some 3,500 narrow steps arranged in double flights on three sides over 13 levels, while the fourth side has pavilions and galleries. In a dry region where most of the year's rain falls in a few monsoon weeks, a stepwell stores rainwater and reaches the groundwater, and the steps let people walk down to the water whatever its level. The deep, shaded pit loses less water to evaporation, and the air at the bottom is about 5-6 °C cooler than at the surface, so the stepwell was also a cool place for people to gather in the summer heat."
