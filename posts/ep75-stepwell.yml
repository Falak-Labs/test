  title: "بير تشاند باوري: هرم مقلوب من الدرج 🪜"
  text: |
    هرم مقلوب من الدرج، تنزل فيه لين توصل الموية! 🪜
    بير تشاند باوري في الهند عمره تقريبا ألف ومتين سنة. المطر هناك يجي كم أسبوع بالسنة بس، فالحفرة تتعبى من مطر الموسم والموية اللي تحت الأرض. والدرج على ثلاث جدران عشان توصل للموية لو نزلت، والجدران ترجع لورا ثلطعش دور عشان ما تطيح، والدرج متعرّج أزواج عشان الناس يطلعون وينزلون مع بعض. وتحت أبرد بخمس درجات تقريبا.
    تقدر تنزل كل هالدرج؟ 👇
  next: "قدر الضغط 🍲"
  seo: "كيف يشتغل بير تشاند باوري: تشاند باوري بير بدرج في قرية أبهانيري في راجستان بالهند، انبنى تقريبا بين القرن الثامن والتاسع، وينسبونه للملك تشاندا. وهو من أعمق وأكبر آبار الدرج في الهند: عمقه حوالي ثلاثين متر، وفيه تقريبا ثلاثة آلاف وخمسمية درجة ضيقة مرتبة أزواج على ثلاث جهات في ثلطعش دور، والجهة الرابعة فيها أجنحة وممرات. وفي منطقة ناشفة أغلب مطرها يجي في كم أسبوع وقت الموسم، البير يخزن موية المطر ويوصل للموية اللي تحت الأرض، والدرج يخلي الناس ينزلون للموية مهما كان مستواها. والحفرة العميقة المظللة يتبخر منها موية أقل، والهوا تحت أبرد من فوق بحوالي خمس لين ست درجات، فكان البير بعد مكان بارد يتجمع فيه الناس وقت حر الصيف."
