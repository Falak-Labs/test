  title: "Igloo: A Snow House That Stays Warm at -40° ❄️"
  text: |
    A family sleeping warm at minus forty, in a house made of nothing but snow. ❄️
    Wind-packed snow is mostly trapped air, the blocks rise in a spiral that holds itself up, the doorway sits below the floor so the cold sinks into the tunnel, and the melt refreezes into a skin of ice that makes the dome strong enough to stand on.
    Could you sleep in one? 👇
  next: "a Moroccan riad 🌿"
  seo: "How an igloo keeps people warm: snow houses of the Arctic are built from blocks of wind-packed snow cut with a snow knife. Snow is mostly trapped air, which makes it a good insulator: body heat alone can keep the inside at about -7 to 16 °C while it is around -40 °C outside, and a small seal-oil lamp warms it more. The blocks are laid in a rising spiral, each leaning on the one before, so the dome supports itself while it is built, with no wood for a frame. The entrance tunnel is dug lower than the floor: cold air is heavier, sinks into it and stays there, and people sleep on a raised platform where the warm air collects. The heat melts the inner surface a little, and it refreezes into a glaze of ice that makes the dome stronger and windproof, strong enough for a person to stand on top. A small hole in the top lets fresh air in, a block of clear ice can serve as a window, and a skilled builder can finish a small igloo in about an hour."
