  title: "بيت الثلج: دافي على سالب أربعين ❄️"
  text: |
    عيلة كاملة تنام دافية على سالب أربعين، في بيت كله ثلج! ❄️
    الثلج اللي دكّته الريح أغلبه هوا محبوس، والطوب ينرص لولبي والقبة تشيل نفسها، والمدخل أوطى من الأرضية عشان البرد ينزل للنفق ويقعد فيه، والذايب يتجمّد طبقة جليد لين تقدر توقف فوقها.
    تقدر تنام فيه ليلة؟ 👇
  next: "رياض مغربي 🌿"
  seo: "كيف بيت الثلج يدفّي: بيوت الثلج في القطب الشمالي تنبني من طوب ثلج دكّته الريح، ينقص بسكين ثلج. الثلج أغلبه هوا محبوس، والهوا المحبوس عازل ممتاز، فحرارة الناس وسراج زيت صغير تخلي داخل البيت فوق الصفر وبرا سالب أربعين. الطوب ينرص لولبي وهو يطلع، كل طوبة مايلة على اللي قبلها، فالقبة تشيل نفسها وهي تنبني بدون خشب. والمدخل نفق محفور أوطى من الأرضية: البرد أثقل، ينزل فيه ويقعد، والناس تنام فوق على دكة عالية مكان الدفا. والحرارة تذوّب الجدار من داخل شوي، ويرجع يتجمّد طبقة جليد تقوّي القبة وتسكّر الريح، لين يقدر واحد يوقف فوقها. وفيه خرم صغير فوق للهوا، وشباك من جليد صافي، والمحترف يبنيه في حوالي ساعة."
