  title: "Leaning Tower of Pisa: Why It Leans and Never Falls 🇮🇹"
  text: |
    It leans almost 4 meters, and it has stood for more than 800 years. 🇮🇹
    It started sinking into soft clay just five years into building, a century-long break for wars let the clay firm up, the upper floors were built taller on the low side so it curves like a banana, 600 tons of lead held it in the 1990s, and drilling soil out from under the high side pulled it back 45 cm. The twist: the same soft clay protects it from earthquakes.
    Would you climb it? 👇
  next: "a Bedouin tent ⛺"
  seo: "How the Leaning Tower of Pisa stays up: the bell tower was started in 1173 on soft river clay and sand with a foundation only about 3 m deep, and by 1178, five years in, it had started to sink on its south side. Wars between Pisa and its neighbours stopped the building for almost a century, and in that time the clay under it squeezed out water and grew firmer, which very likely saved it from falling. When building started again, the masons made the upper floors taller on the low side to correct the lean, so the tower is slightly curved, like a banana. By 1990 it leaned about 5.5 degrees with its top about 4.5 m out of line and it was closed to visitors. Engineers stacked about 600 tonnes of lead on the north side, tied steel cables around the third floor, then drilled out small amounts of soil from under the high side, about 38 cubic metres in all, and the tower settled back about 45 cm by 2001. Today it is about 56 m tall, weighs about 14,500 tonnes and leans almost 4 degrees. A 2018 study found that the soft soil that makes it lean also protects it: it changes how the tower shakes, so it does not resonate with earthquakes, and at least four strong ones have hit the area since 1280."
