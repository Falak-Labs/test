  title: "برج بيزا المايل: ليش مايل وما يطيح؟ 🇮🇹"
  text: |
    مايل قرابة أربعة متر، وواقف من أكثر من ثمانمية سنة! 🇮🇹
    بدأ يغوص في الطين بعد خمس سنين بس من البناء، والحروب وقّفت البناء قرابة مية سنة والطين قسى، وبنوا الأدوار اللي فوق أطول من الجهة النازلة فصار منحني مثل الموزة، وفي التسعينات حطوا ستمية طن رصاص وسحبوا التراب من تحت الجهة العالية ورجع خمسة وأربعين سانتي. والمفاجأة: نفس الطين يحميه من الزلازل.
    تطلع فوقه ولا لا؟ 👇
  next: "بيت الشعر ⛺"
  seo: "كيف برج بيزا المايل ما طاح: البرج بدأ بناه سنة ألف ومية وثلاثة وسبعين على طين ورمل ليّن، وأساسه عمقه حوالي ثلاثة متر بس، وبعد خمس سنين بدأ يغوص من الجهة الجنوبية. الحروب بين بيزا وجيرانها وقّفت البناء قرابة مية سنة، وفي هالوقت الطين طلّع الموية اللي فيه وقسى، وهذا غالبًا اللي أنقذه من الطيحة. ولما رجعوا يبنون، طوّلوا الأدوار اللي فوق من الجهة النازلة عشان يعدلون الميلان، فصار البرج منحني شوي مثل الموزة. وفي سنة ألف وتسعمية وتسعين كان مايل حوالي خمس درجات ونص وراسه طالع حوالي أربعة متر ونص، وسكّروه عن الزوار. المهندسين حطوا حوالي ستمية طن رصاص على الجهة الشمالية، ولفّوا كيابل حديد حول الدور الثالث، وبعدين سحبوا التراب شوي شوي من تحت الجهة العالية، حوالي ثمانية وثلاثين متر مكعب، ورجع البرج حوالي خمسة وأربعين سانتي لين سنة ألفين وواحد. طوله اليوم حوالي ستة وخمسين متر، ووزنه حوالي أربعطعش ألف وخمسمية طن، وميلانه قرابة أربع درجات. ودراسة سنة ألفين وثمنطعش لقت إن نفس الطين اللي ميّله يحميه من الزلازل، لأنه يغيّر طريقة اهتزاز البرج، وعدّت عليه أربعة زلازل قوية على الأقل من سنة ألف ومتين وثمانين."
