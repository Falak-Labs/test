  title: "How a Bank Vault Works: The Trap Hidden Inside the Door 🏦"
  text: |
    Why can't you just drill into a bank vault? 🏦
    Concrete walls full of steel, a hidden glass plate that jams the door if it cracks, a time lock nobody can open at night, and sensors that hear you digging.
    What would you keep in yours? 👇
