  title: "Pressure Cooker: Water Hotter Than Boiling 🍲"
  text: |
    A pot that gets water hotter than boiling, and cooks beans in minutes. 🍲
    Lock the lid and the trapped steam raises the pressure, so the water boils at about 120°C instead of 100°C. A little weight lets the extra steam out (that's the whistle), a backup plug melts if the vent clogs, and a pin keeps the lid locked until the pressure is gone.
    How many whistles for your lentils? 👇
  next: "the Golden Gate Bridge 🌉"
  seo: "How a pressure cooker works: the sealed lid traps steam, the pressure rises, and water boils at about 120 °C instead of 100 °C, so food cooks much faster, even high in the mountains where water boils cooler. A weighted valve lets extra steam out (the whistle), a safety plug melts if the vent clogs, and a locking pin keeps the lid shut until the pressure is gone."
