  title: "Louvre Abu Dhabi: The Dome That Rains Light 🇦🇪"
  text: |
    A steel dome as heavy as the Eiffel Tower, floating over a museum on the sea. ☀️
    It is 180 m wide and made of 7,850 metal stars in eight layers, so the sun falls through in little spots, like light through palm leaves: a "rain of light". It rests on just four legs hidden inside the buildings, and the basements sit below the sea, sealed like a giant bathtub. Architect Jean Nouvel laid the 55 white buildings out like an old Arab town.
    Would you go for the dome or for the art? 👇
  next: "a vacuum cleaner 🌪️"
  seo: "How the Louvre Abu Dhabi's dome works: the museum on Saadiyat Island in Abu Dhabi, designed by the French architect Jean Nouvel and opened in November 2017, sits under a dome 180 m wide that weighs about 7,500 tonnes, about as much as the Eiffel Tower. The dome is built of eight layers, four outer layers of stainless steel and four inner layers of aluminium, made of 7,850 star-shaped pieces in a geometric pattern. Sunlight passes through the layers in small spots that drift across the floor through the day, an effect called the 'rain of light', inspired by the sun falling through the woven palm leaves once used for roofs in the region. The dome rests on only four supports hidden inside the museum's buildings, so it seems to float, and its shade and the sea breeze make the plaza under it much cooler than the open sun. Below it, 55 white buildings, 23 of them galleries, are laid out like a medina, an old Arab town with narrow lanes and water channels. The museum sits on the sea: it was built on a dry site below sea level, its basements were sealed with waterproofing like a giant tub, and in 2016 the sea was let in around it."
