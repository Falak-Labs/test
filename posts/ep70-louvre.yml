  title: "متحف اللوفر أبوظبي: قبة تمطر نور 🇦🇪"
  text: |
    قبة حديد بوزن برج إيفل، طايرة فوق متحف على البحر! ☀️
    عرضها مية وثمانين متر، ومسوية من سبعة آلاف وثمنمية وخمسين نجمة حديد في ثمان طبقات، والشمس تنزل منها نقط نور مثل الشمس بين سعف النخل. قاعدة على أربع رجول بس مخبّاة داخل المباني، والقبو تحت مستوى البحر معزول مثل بانيو عملاق. والمعماري جان نوفيل رتّب المعارض مثل حارة عربية قديمة.
    رحت له قبل؟ ولا تبي تروح؟ 👇
  next: "مكنسة كهربا 🌪️"
  seo: "كيف قبة متحف اللوفر أبوظبي تشتغل: المتحف في جزيرة السعديات في أبوظبي، صممه المعماري الفرنسي جان نوفيل، وانفتح في نوفمبر سنة ألفين وسبعطعش. فوقه قبة عرضها مية وثمانين متر، ووزنها حوالي سبعة آلاف وخمسمية طن، تقريبا وزن برج إيفل. القبة مبنية من ثمان طبقات، أربع برا من حديد ما يصدي وأربع داخل من ألمنيوم، وفيها سبعة آلاف وثمنمية وخمسين قطعة على شكل نجمة. والشمس تعدي من الطبقات وتنزل نقط نور تتحرك على الأرض طول اليوم، وهذا اللي يسمونه مطر النور، والفكرة مأخوذة من الشمس اللي تنزل من بين سعف النخل اللي كانوا يسقفون فيه بيوتهم زمان. والقبة قاعدة على أربع رجول بس مخبّاة داخل مباني المتحف، عشان تبين كأنها طايرة، وظلها مع هوا البحر يخلي الساحة تحتها أبرد بكثير من الشمس برا. وتحتها خمسة وخمسين مبنى أبيض، منها ثلاثة وعشرين صالة عرض، مرتبة مثل حارة عربية قديمة بسكيك ضيقة ومجاري موية. والمتحف على البحر: انبنى في أرض ناشفة تحت مستوى البحر، والقبو انعزل بطبقات عزل مثل بانيو عملاق، وفي ألفين وستطعش دخّلوا البحر حوله."
