  title: "Korean Heated Floor: One Fire Cooks Dinner and Heats the House 🔥"
  text: |
    The fire that cooks the rice also heats the whole house, through the floor. 🔥
    Smoke from the kitchen fire runs through stone channels under the room, flat stones and thick clay soak up the heat like a battery and stay warm until morning, and paper soaked in bean oil makes the floor smooth enough to sit, eat and sleep on.
    Would you sleep on a warm floor? 👇
  next: "Dubai's sail-shaped hotel ⛵"
  seo: "How the Korean ondol heated floor works: in a traditional Korean house the kitchen fire (agungi) sits below the level of the room next to it. It cooks the rice in an iron pot, and its hot smoke is drawn under the room's floor through channels (gorae) built of stone before it leaves through a chimney (gulttuk) on the far side of the house. The channels spread the smoke under the whole floor instead of letting it rush straight to the chimney. Flat stone slabs (gudeuljang) cover the channels and a thick layer of clay goes on top: the stone and clay store the heat and give it back for hours, so a fire lit in the evening keeps the floor warm through the night. The floor is finished with layers of paper soaked in bean oil, smooth, shiny and waterproof, because people sit, eat and sleep on it. The warmest spot, nearest the fire, is given to elders and guests. Koreans have heated their floors like this for thousands of years; today almost every Korean home heats through the floor with hot-water pipes in the concrete, and the architect Frank Lloyd Wright, who sat in a heated Korean room in Tokyo, brought floor heating to his houses in America."
