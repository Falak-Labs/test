  title: "الأرضية الكورية الدافية: نار واحدة بتطبخ وبتدفّي البيت 🔥"
  text: |
    النار اللي بتطبخ الرز هي نفسها اللي بتدفّي البيت كله من الأرضية! 🔥
    دخان نار المطبخ بيعدّي في قنوات حجر تحت الأوضة، والحجر والطين التخين بيشربوا السخونية زي البطارية ويفضلوا دافيين لحد الصبح، وورق مدهون بزيت الصويا بيخلّي الأرضية ناعمة تقعد وتاكل وتنام عليها.
    تنام على أرض دافية؟ 👇
  next: "فندق دبي اللي شكله شراع ⛵"
  seo: "إزاي الأرضية الكورية الدافية بتشتغل: في البيت الكوري القديم نار المطبخ بتبقى أوطى من الأوضة اللي جنبها، بتطبخ الرز في حلّة حديد، ودخانها السخن بيتسحب تحت أرضية الأوضة في قنوات من الحجر قبل ما يطلع من مدخنة في الناحية التانية من البيت. القنوات بتوزّع الدخان تحت الأرضية كلها بدل ما يجري على المدخنة على طول. وفوق القنوات ألواح حجر، وفوقها طبقة طين تخينة، والحجر والطين بيشيلوا السخونية ويرجّعوها ساعات، فالنار اللي بتولع بالليل بتفضل مدفّية الأرضية لحد الصبح. والأرضية بتتلبس ورق مدهون بزيت الصويا، ناعم ولامع والمية متعديش منه، عشان الناس بتقعد وتاكل وتنام عليها. وأدفى حتة جنب النار بتبقى للكبار والضيوف. الكوريين بيدفّوا أرضياتهم كده من آلاف السنين، ولحد النهارده كل بيت كوري تقريبًا بيتدفّى من الأرضية بمواسير مية سخنة في الخرسانة، والمعماري الأمريكي فرانك لويد رايت قعد في أوضة كورية دافية في طوكيو ونقل فكرة التدفية من الأرضية لبيوته في أمريكا."
