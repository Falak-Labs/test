  title: "A Hotel Standing in the Open Sea ⚓ Survival Mode: You vs the Sea"
  text: |
    No land. No shortcut. No light. ⚓
    Level 1: Dubai. You want a hotel out in the open sea, where there's no land at all, so you ring the spot with rocks, fill it with sand, and drive 230 concrete piles 40 meters down.
    Three more bosses are waiting. All 4 levels are on our YouTube channel: @congratsengineer
    Which one would beat you first: the waves, the detour, the dark or the North Sea? 👇
  tags:
    tiktok: "#survival #engineering #burjalarab #howitworks #learnontiktok"
    instagram: "#survival #engineering #burjalarab #howitworks #dubai"
    youtube: "#survival #engineering"
