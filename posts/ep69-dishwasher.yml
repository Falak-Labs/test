  title: "Dishwasher: Spray Arms That Spin With No Motor 🍽️"
  text: |
    Water too hot for your hands, from arms that spin with no motor. 🍽️
    Only a few liters sit in the bottom and a pump throws them around again and again, a filter catches the food scraps, the jets leave the arms at an angle so their push spins them like a garden sprinkler, and enzymes chop up dried egg and starch. In 1886 Josephine Cochrane got tired of servants chipping her china, built her own, and hotels bought it first.
    Does your family really use it, or is it a drying rack? 👇
  next: "a dome that rains light ✨"
  seo: "How a dishwasher works: a dishwasher does not fill up like a bath. A few litres of water collect in the sump at the bottom, a heating element warms them, often to around 50-65 °C, hotter than hands can stand, and a pump sends the water up through the spray arms again and again during the wash. The arms have holes angled to the side, so the jets push them round like a garden sprinkler; there is no motor in the arms. A filter in the sump catches food scraps so that only cleaner water goes back up. Dishwasher detergent contains enzymes, proteases and amylases, which break down proteins such as dried egg and starches such as rice and pasta, the same kinds of enzymes the body uses to digest food. An efficient modern dishwasher uses roughly 10-15 litres of water a load, while washing the same dishes by hand with the tap running can use far more, up to about 100 litres. Josephine Cochrane of Illinois patented her dishwasher in 1886 after her servants kept chipping her fine china; her machine held the dishes in wire racks on a wheel while hot soapy water sprayed over them, and hotels and restaurants were its first customers."
