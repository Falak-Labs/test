  title: "غسالة الصحون: أذرع تلف بدون موتور 🍽️"
  text: |
    موية حارة ما تتحملها يدك، من أذرع تلف بدون موتور! 🍽️
    كم لتر بس تحت ومضخة ترشها مرة ورا مرة، وفلتر يمسك بقايا الأكل، والموية تطلع من الأذرع بزاوية فتلفها مثل رشاش الحديقة، وإنزيمات تقطّع البيض الناشف والنشا. وفي ألف وثمنمية وستة وثمانين، جوزفين كوكرين زهقت من الخدم يكسرون صحونها، فسوت غسالة بنفسها، وأول من اشتراها الفنادق.
    عندكم غسالة صحون ولا نشّافة؟ 👇
  next: "قبة تمطر نور ✨"
  seo: "كيف تشتغل غسالة الصحون: الغسالة ما تمتلي موية مثل البانيو. كم لتر بس يتجمعون في الحوض اللي تحت، وسخّان يحميها لين حوالي خمسين أو خمسة وستين درجة، أحر من اللي تتحمله اليد، ومضخة ترفع الموية للأذرع اللي ترش، مرة ورا مرة طول الغسلة. والأذرع فيها خروم مايلة على الجنب، فدفّة الموية نفسها تلفها مثل رشاش الحديقة، وما فيها أي موتور. وتحت فيه فلتر يمسك بقايا الأكل عشان بس الموية الأنظف ترجع فوق. وصابون الغسالة فيه إنزيمات تقطّع البروتين مثل البيض الناشف، والنشويات مثل الرز والمكرونة، نفس نوع الإنزيمات اللي جسمك يهضم فيها الأكل. والغسالة الحديثة الموفّرة تصرف تقريبا من عشرة لين خمسطعش لتر للغسلة، والغسيل باليد والحنفية مفتوحة ممكن يصرف أكثر بكثير، لين حوالي مية لتر. وجوزفين كوكرين من ولاية إلينوي سجلت اختراع غسالتها في ألف وثمنمية وستة وثمانين، بعد ما زهقت من الخدم يكسرون صحونها الغالية، وغسالتها كانت تحط الصحون في رفوف سلك على عجلة وترش عليها موية حارة وصابون، وأول زباينها كانوا الفنادق والمطاعم."
