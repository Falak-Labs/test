  title: "Hagia Sophia's Dome: Floating on a Ring of Light ✨"
  text: |
    A brick dome over 30 meters wide, floating on a ring of 40 windows. ✨
    Four giant arches and curved brick triangles turn a square hall into a circle, half domes and buttresses catch the push, and mortar as thick as the bricks lets it bend instead of breaking. Built in under six years, almost 1,500 years ago.
    Would you stand under it? 👇
  next: "a Korean heated floor 🔥"
  seo: "How the Hagia Sophia's dome works: built in Istanbul (then Constantinople) between 532 and 537, in under six years, by Anthemius of Tralles, a mathematician, and Isidore of Miletus, a geometer. The dome is about 31 m across and its crown is about 55 m above the floor. A round dome normally needs round walls; here it sits on a square of four huge piers and four great arches, and pendentives, curved triangles of brick between the arches, turn the square into the circle the dome rests on. A dome pushes outward at its base: two half domes on the east and west and massive buttresses on the north and south carry that push down to the ground. The dome is built of forty ribs with forty windows between them around its base, which make it lighter and fill the hall with light, so from the floor it seems to float. Its mortar joints are about as thick as the bricks, which lets the masonry flex in earthquakes. The first, flatter dome fell in 558 after earthquakes, twenty-one years after it was finished, and was rebuilt steeper and taller so it pushes outward less. It has stood through almost fifteen centuries of earthquakes since."
