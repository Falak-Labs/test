  title: "قبة آيا صوفيا: كأنها طايرة فوق حلقة نور ✨"
  text: |
    قبة طوب أعرض من ثلاثين متر، كأنها طايرة فوق أربعين شباك! ✨
    أربع أقواس ومثلثات طوب مقوّسة تخلي القاعة المربعة دايرة، ونص قبة من كل طرف ودعامات ضخمة تشيل الدفّة، والمونة سماكتها قد الطوبة عشان تنثني وما تنكسر. بنوها في أقل من ست سنين، قبل قرابة ألف وخمسمية سنة.
    تتخيل توقف تحتها؟ 👇
  next: "أرضية كورية دافية 🔥"
  seo: "كيف قبة آيا صوفيا واقفة: انبنت في إسطنبول بين سنة خمسمية واثنين وثلاثين وخمسمية وسبعة وثلاثين، في أقل من ست سنين، وبناها عالم رياضيات وعالم هندسة. القبة عرضها حوالي واحد وثلاثين متر، وأعلى نقطة فيها على علو حوالي خمسة وخمسين متر من الأرض. القبة الدايرية تبي جدار مدوّر تحتها، بس هنا القاعة مربعة على أربع أعمدة ضخمة وأربع أقواس، والمثلثات المقوّسة بين الأقواس تخلي المربع دايرة تقعد عليها القبة. والقبة تدف لبرا من تحت، فنص قبة من الشرق ونص قبة من الغرب ودعامات ضخمة من الشمال والجنوب تنزّل هالدفّة للأرض. والقبة مبنية من أربعين ضلع وبينها أربعين شباك حول قاعدتها، تخففها وتملا القاعة نور، فتحس القبة طايرة. والمونة بين الطوب سماكتها قد الطوبة، فتنثني مع الزلازل بدل ما تنكسر. القبة الأولى كانت أوطى وطاحت بعد زلازل، بعد واحد وعشرين سنة من بنائها، ورجعوا بنوها أعلى وأحدّ عشان تدف أقل، وصامدة من قرابة خمستعشر قرن."
