  title: "نفق طوكيو للفيضانات: قاعة أعمدة تحت الأرض 🌊"
  text: |
    اليابان بنت قاعة أعمدة عملاقة تحت الأرض... للفيضانات بس! 🌊
    الأعاصير تغرّق المدن حول طوكيو، فحفروا خمس آبار عملاقة جنب الأنهار تمسك الموية إذا فاضت، ووصلوها بنفق طوله ٦٫٣ كيلو وعمقه حوالي ٥٠ متر. الموية تصب في خزان عملاق تحت ٥٩ عمود عشان تهدى، وأربع مضخات تشغّلها محركات مثل محركات الطيارات ترفعها لنهر إيدو: تقريباً مسبح كامل كل ثانية.
    وعندنا عشر دقايق مطر... والشارع يصير مسبح 😅 صح ولا لا؟ 👇
  next: "جسر بروكلين (وفيه فيلة!) 🐘"
  seo: "كيف يشتغل نفق طوكيو للفيضانات: القناة الخارجية لتصريف المياه تحت الأرض في كاسوكابي بسايتاما، خلصت سنة ٢٠٠٦، تاخذ الموية الزايدة من الأنهار الصغيرة لخمس آبار عمقها حوالي ٧٠ متر، يوصلها نفق طوله ٦٫٣ كيلو على عمق حوالي ٥٠ متر. الموية توصل لخزان تهدئة الضغط، طوله ١٧٧ متر وعرضه ٧٨ وارتفاعه ١٨، شايله ٥٩ عمود كل واحد حوالي ٥٠٠ طن، ويسمونه المعبد تحت الأرض. وأربع مضخات تشغلها توربينات مثل محركات الطيارات ترفع لين ٢٠٠ متر مكعب في الثانية لنهر إيدو، تقريباً مسبح ٢٥ متر كل ثانية."
