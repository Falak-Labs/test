  title: "Tokyo's Underground Flood Tunnel: a Hall of 59 Pillars 🌊"
  text: |
    Japan built a giant hall of pillars underground… for floods. 🌊
    Typhoons flood the low towns around Tokyo, so five giant shafts by the rivers catch the overflow. A tunnel 6.3 km long, about 50 m down, joins them. The rushing water spills into a huge tank under 59 pillars to calm down, and four pumps driven by jet-engine-style turbines push it up into the Edo River: almost a whole swimming pool every second.
    Meanwhile your sink clogs on one noodle. Tag someone who needs this tunnel 👇
  next: "the Brooklyn Bridge (elephants included) 🐘"
  seo: "How Tokyo's G-Cans flood tunnel works: the Metropolitan Area Outer Underground Discharge Channel in Kasukabe, Saitama, finished in 2006, takes the overflow of small rivers into five shafts about 70 m deep, joined by a 6.3 km tunnel about 50 m underground. The water reaches the pressure-adjusting tank, 177 m long, 78 m wide and 18 m high, held up by 59 pillars of about 500 tonnes each and nicknamed the underground temple. Four pumps driven by aircraft-type gas turbines lift up to about 200 cubic metres a second into the Edo River, close to a 25 m swimming pool every second."
