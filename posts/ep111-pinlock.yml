  title: "Pin Tumbler Lock: Five Little Pins Guard Your Front Door 🔑"
  text: |
    Your front door is guarded by… five little pins. 🔑
    Springs push each pin down into the plug, so it can't turn. Every pin is cut in two, and the right key lifts every cut exactly to the plug's edge: click, it turns. The pins come in different lengths, so there are thousands of different keys. The first pin locks, about 4,000 years ago, were giant blocks of wood; by the 1860s an American father and son, the Yales, had shrunk the idea to a small flat metal key. The twist: the lock doesn't know your key, it only checks the heights, so any copy works.
    Who in your house always loses the keys? 👇
  next: "the bridge Sydney calls the Coathanger 🌉"
  seo: "How a pin tumbler lock works: a plug that turns sits inside a housing, and stacks of pins pushed down by springs cross the gap between them so the plug cannot turn. Each stack is a key pin and a driver pin; the right key lifts every gap between them exactly to the shear line, the edge of the plug, and the plug turns. Key pins of different lengths, typically five or six of them, make thousands of possible keys. Large wooden pin locks are about 4,000 years old; Linus Yale Sr. made a modern pin tumbler lock in the 1840s and his son Linus Yale Jr. patented the small flat key with serrated edges in the 1860s. The lock only checks the heights cut into the key, so any accurate copy opens it."
