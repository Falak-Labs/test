  title: "قفل الدبابيس: خمس دبابيس تحرس بابك 🔑"
  text: |
    باب بيتكم يحرسه... خمس دبابيس صغيرة! 🔑
    زنبركات تدز كل دبوس لتحت داخل قلب القفل فما يلف. وكل دبوس مقصوص نصين، والمفتاح الصح يرفع كل قصّة بالضبط لحافة قلب القفل: طق، ويلف. والدبابيس أطوالها مختلفة، فصار فيه آلاف المفاتيح المختلفة. وأول أقفال بالدبابيس قبل حوالي أربعة آلاف سنة كانت قطع خشب ضخمة، وفي القرن التسعطعش صغّرها أب وولده في أمريكا لمفتاح حديد مسطّح. والمفاجأة: القفل ما يعرف مفتاحك، يشيك على الأطوال بس، فأي نسخة تفتحه!
    منشن اللي يدوّر على المفتاح وهو في جيبه 👇
  next: "جسر يسمّونه أهل سيدني: الشمّاعة 🌉"
  seo: "كيف يشتغل قفل الدبابيس: فيه قلب يلف داخل جسم القفل، وأعمدة دبابيس تدزها زنبركات لتحت وتقطع الفاصل بينهم فما يلف القلب. كل عمود دبوسين، دبوس المفتاح ودبوس فوقه، والمفتاح الصح يرفع الفاصل بينهم بالضبط لحافة القلب فيلف. ودبابيس المفتاح أطوالها مختلفة، وغالباً خمسة أو ستة، فيطلع آلاف المفاتيح. وأقفال الدبابيس الخشب الكبيرة عمرها حوالي أربعة آلاف سنة، ولينوس ييل الأب سوّى قفل دبابيس حديث في الأربعينات من القرن التسعطعش، وولده لينوس ييل الابن سجّل المفتاح الصغير المسطّح المسنّن في الستينات. والقفل يشيك على الأطوال المقصوصة في المفتاح بس، فأي نسخة مضبوطة تفتحه."
