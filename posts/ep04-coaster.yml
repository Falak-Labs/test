  title: "كيف يشتغل قطار الموت؟ وليش ما يطير من السكة 🎢"
  text: |
    ليش قطار الموت ما يطير من السكة؟ 🎢
    يبدأ بعربية على سكتين، وبعدين تضيف سلسلة تسحبه لفوق، كفرات تقفل على السكة، لفة على شكل دمعة، وفرامل ما تحتاج كهربا.
    الكرسي الأول ولا الأخير؟ 👇
