en:
  title: "How Roller Coasters Work: Why They Don't Fly Off the Track 🎢"
  text: |
    Why don't roller coasters fly off the track? 🎢
    It starts as a cart on two rails. Then you add a chain lift, wheels that lock onto the rail, a teardrop loop and brakes that need no power.
    Front row or back row? 👇
  next: "a water slide 🌊"
  seo: "Chain lift and anti-rollback dogs, road wheels, side wheels and upstop wheels, the teardrop (clothoid) loop, shoulder bars and magnetic brakes."
