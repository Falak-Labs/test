  title: "Burj Al Arab: A Hotel on an Island Built Just for It ⛵"
  text: |
    A hotel shaped like a sail, standing in the sea on an island built just for it. ⛵
    A ring of rocks filled with sand, 230 concrete piles driven 40 m into the sand and held up by friction, hollow concrete blocks that take the waves' power, and a fabric sail that lets the light in and bounces the heat away. The island took longer to build than the hotel.
    Would you stay a night? 👇
  next: "an island shaped like a palm tree 🌴"
  seo: "How the Burj Al Arab was built: the sail-shaped hotel in Dubai, opened in 1999, is about 321 m tall and stands on its own man-made island about 280 m off Jumeirah Beach, linked to the shore by a curving bridge. The island was made by ringing the spot with rocks and filling it with sand. There is no bedrock under the seabed there, so the foundations are 230 concrete piles about 40 m long driven into the sand; they are held up by the friction of the sand along their sides. The island's edges are armored with hollow concrete blocks laid in a honeycomb pattern, which break the waves and soak up their energy instead of letting them wash the sand away. The front of the building is a double layer of Teflon-coated glass-fiber fabric, the sail, which lets daylight into the giant atrium while reflecting much of the desert heat, and lights up in colors at night. A helipad sits about 210 m up, where Roger Federer and Andre Agassi once played tennis in 2005. Building the island took about three years, longer than building the hotel on top of it."
