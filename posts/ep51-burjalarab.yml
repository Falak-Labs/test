  title: "برج العرب: فندق على جزيرة انبنت عشانه ⛵"
  text: |
    فندق على شكل شراع، واقف في البحر على جزيرة انبنت عشانه! ⛵
    صخور حوالين المكان تعبّت رمل، وميتين وثلاثين عمود خرسانة دقّوها أربعين متر في الرمل والاحتكاك يشيلها، وخرسانة مفرّغة مثل خلية النحل تكسر الموج، وشراع من قماش يدخّل النور ويرد الحر. والجزيرة أخذت وقت أكثر من الفندق نفسه.
    تبي تنام فيه ليلة؟ 👇
  next: "جزيرة على شكل نخلة 🌴"
  seo: "كيف انبنى برج العرب: الفندق اللي على شكل شراع في دبي، افتتح سنة ألف وتسعمية وتسعة وتسعين، علوه حوالي ثلاثمية وواحد وعشرين متر، وواقف على جزيرة صناعية خاصة فيه على بعد حوالي ميتين وثمانين متر من شاطئ جميرا، ويوصلها جسر منحني. الجزيرة انسوت بصخور حوالين المكان وانعبّت رمل. وما تحت قاع البحر هناك صخر، فالأساس ميتين وثلاثين عمود خرسانة طول الواحد حوالي أربعين متر مدقوقة في الرمل، والرمل يمسكها من جوانبها والاحتكاك يشيل المبنى. وأطراف الجزيرة متدرّعة بقطع خرسانة مفرّغة مرصوصة مثل خلية النحل، تكسر الموج وتشرب قوته بدل ما ياكل الرمل. وواجهة الفندق طبقتين من قماش ألياف زجاج مغطى بالتفلون، هو الشراع، يدخّل النور للبهو العملاق ويرد كثير من حر الصحرا، ويتلوّن بالليل. وفيه مهبط هليكوبتر على علو حوالي ميتين وعشرة متر، لعب عليه روجر فيدرر وأندريه أغاسي تنس سنة ألفين وخمسة. وبناء الجزيرة أخذ حوالي ثلاث سنين، أكثر من بناء الفندق نفسه."
