  title: "The Clock That Can't Be Late ⏱️ Survival Mode: You vs Time"
  text: |
    No pause. No rewind. No extra time. ⏱️
    Level 1: London. Big Ben's clock has to strike right to the second while wind, heat and cold push it off, so you fight back with a pendulum almost 4 m long and a stack of old pennies.
    Three more bosses are waiting. All 4 levels are on our YouTube channel: @congratsengineer
    Which one would beat you first: the lost second, the long wait, the rain or 2,000 years? 👇
