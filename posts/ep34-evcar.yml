  title: "إزاي العربية الكهربا بتسبق العربية السبور؟ ⚡"
  text: |
    مكان الموتور فيها شنطة، وبرضه بتسبق العربية السبور في الإشارة! ⚡
    تمن تلاف خلية بطارية تحت الأرضية، موتور كهربا قوته كاملة من أول لحظة وسرعة واحدة بس، فرامل بترجّع كهربا للبطارية، وصوت مخصوص عشان اللي بيعدّي الشارع يسمعها.
    تشتري عربية كهربا؟ 👇
  next: "موبايل 📱"
  seo: "إزاي العربية الكهربا بتشتغل: آلاف الخلايا الصغيرة متفرشة تحت الأرضية فالتقل يبقى تحت والعربية تمسك في الأرض، والموتور الكهربا قوته كاملة من أول لحظة وبسرعة واحدة من غير ما تغيّر فتيس، ولما ترفع رجلك الموتور يقلب دينامو ويرجّع كهربا للبطارية. في أوروبا كل عربية كهربا جديدة لازم تطلّع صوت لحد عشرين كيلو في الساعة عشان الناس تسمعها، وفي النرويج ستة وتسعين في المية من العربيات الجديدة السنة اللي فاتت كانت كهربا."
