  title: "How an Electric Car Beats a Sports Car Off the Line ⚡"
  text: |
    No engine under the hood, just a second trunk, and it still wins at the green light. ⚡
    Eight thousand battery cells laid flat under the floor, a motor with full force from a standstill and just one gear, brakes that turn the motor into a generator, and a sound it plays on purpose so people hear it coming.
    Would you switch to electric? 👇
  next: "a smartphone 📱"
  seo: "How electric cars work: thousands of small lithium-ion cells (a Tesla Model S P100D pack has 8,256) lie flat under the floor like a skateboard, so the weight sits low and the car hugs the road; an electric motor gives full torque from a standstill through a single-speed gearbox, which is why EVs beat sports cars off the line; regenerative braking turns the motor into a generator that puts energy back in the battery when you lift your foot; since July 2021 every new electric car in the EU must play a warning sound (AVAS) below about 20 km/h and when reversing. Plug it in at night like a phone. In 2025, 96% of new cars sold in Norway were electric."
