  title: "Fire Sprinklers: Only One Turns On 🔥"
  text: |
    One fire, a hundred sprinklers… and only one turns on. 🔥
    In 1874 a piano maker sealed his sprinklers with metal that melts in the heat. Today every head has its own tiny glass bulb of liquid: heat swells the liquid, the glass pops at about 68 °C, and only that head sprays, not the whole ceiling like in the movies. Hot rooms get bulbs that pop later (blue, about 121 °C), and the main valve is locked open with an alarm, because the top reason sprinklers fail is water that somebody shut off.
    Ever stared at one during a birthday party? 👇
  next: "towers that open umbrellas in the sun ☀️"
  seo: "How fire sprinklers work: every sprinkler head is its own heat switch. A small glass bulb filled with a glycerin-based liquid holds the water back; heat makes the liquid expand until the bulb breaks (red bulbs at about 68 °C), and the water hits the deflector and sprays only over that spot. Bulb colors mark the temperature (orange 57 °C, red 68 °C, yellow 79 °C, green 107 °C, blue 121 °C). Henry Parmelee's automatic sprinkler of 1874 protected his piano factory. In US fires of 2015-2019 where sprinklers operated, one head did the job in 77% of them, and the main reason sprinklers failed was a system shut off before the fire (NFPA)."
