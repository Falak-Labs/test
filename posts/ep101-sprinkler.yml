  title: "رشاش الحريق: واحد بس يشتغل 🔥"
  text: |
    حريق واحد ومية رشاش... واحد بس يشتغل! 🔥
    سنة ١٨٧٤ واحد يصنع بيانوهات سكّر الرشاشات بمعدن يذوب من الحرارة. اليوم كل رشاش فيه حبة زجاج صغيرة فيها سائل: الحرارة تنفخ السائل، والزجاجة تنكسر عند ٦٨ درجة تقريباً، وبس الرشاش اللي فوق النار يرش، مو مثل الأفلام اللي السقف كله يصب. الأماكن الحارة تحط حبات تنكسر متأخر (الزرقا حوالي ١٢١ درجة)، والمحبس الرئيسي يتربط مفتوح وعليه إنذار، لأن أكثر سبب يخلي الرشاشات تفشل إن أحد سكّر الموية.
    مين ولّع البخور تحت الرشاش وخاف؟ 👇
  next: "أبراج تفتح مظلاتها مع الشمس ☀️"
  seo: "كيف يشتغل رشاش الحريق: كل رشاش له مفتاح حرارة خاص فيه، حبة زجاج صغيرة فيها سائل تسكّر الفتحة؛ الحرارة تخلي السائل يتمدد لين تنكسر الحبة (الحمرا عند حوالي ٦٨ درجة)، والموية تضرب القرص وترش بس فوق المكان. ألوان الحبات تعرّف الحرارة (البرتقالي ٥٧، الأحمر ٦٨، الأصفر ٧٩، الأخضر ١٠٧، الأزرق ١٢١ درجة). هنري بارميلي سوّى رشاش أوتوماتيكي سنة ١٨٧٤ يحمي فيه مصنع البيانو حقه. وفي حرايق أمريكا من ٢٠١٥ لين ٢٠١٩ اللي اشتغلت فيها الرشاشات، رشاش واحد كفّى في ٧٧٪ منها."
