  title: "إزاي اتبنى الهرم الأكبر؟ 🏜️"
  text: |
    كان أطول مبنى في الدنيا تمانية وتلاتين قرن، ولونه كان أبيض وبيلمع! 🏜️
    مية على الرملة عشان نص الرجالة بس يشدوا حجر أتقل من عربية، مراكب في النيل لحد ميناء جنب الموقع، خمس أوض فاضية بكمرات جرانيت فوق أوضة الملك، وقاعدة مظبوطة لحد اتنين سنتي.
    زرت الأهرامات قبل كده؟ 👇
  next: "برج هوا بيبرّد البيت 🌬️"
  seo: "إزاي اتبنى الهرم الأكبر بتاع خوفو في الجيزة: حوالي مليونين وتلتمية ألف حجر، الحجر الواحد في المتوسط أتقل من عربية. دراسة من جامعة أمستردام لقت إن صب المية على الرملة قدام الزلاجة بيخلي الشد نص المجهود، زي ما مرسوم في مقبرة جحوتي حتب. الحجر الأبيض اتجاب من طرة في البر التاني، والجرانيت من أسوان على بعد أكتر من تسعمية كيلو، في مراكب على النيل لحد ميناء جنب الهرم، وده مكتوب في بردية مرر. فوق أوضة الملك خمس أوض فاضية بكمرات جرانيت وسقف مدبب بيزق التقل على الجناب، والقاعدة مظبوطة لحد حوالي اتنين سنتي ومتوجهة على الشمال بالظبط تقريبًا. بناه آلاف العمال مش عبيد، ومقابرهم جنب الأهرامات. كان طوله مية وستة وأربعين متر، وفضل أطول مبنى في الدنيا أكتر من تلات تلاف وتمنمية سنة."
