  title: "How the Great Pyramid of Giza Was Built 🏜️"
  text: |
    The tallest thing people built for 3,800 years, and it once gleamed white. 🏜️
    Water poured on the sand so half the crew could drag a block heavier than a car, boats down the Nile to a harbor by the site, five empty rooms of granite beams over the king's room, and a base level to 2 cm.
    Have you seen it in person? 👇
  next: "a wind tower that cools a house 🌬️"
  seo: "How the Great Pyramid of Giza (Khufu's pyramid, about 2560 BC) was built: about 2.3 million blocks averaging about 2.5 tonnes; a 2014 University of Amsterdam study found that wetting the sand in front of a sledge halves the pulling force, as shown in the tomb painting of Djehutihotep; the white Tura limestone casing came across the Nile and the granite from Aswan, more than 900 km away, by boat to a harbor at Giza, as the Diary of Merer records; five relieving chambers of granite beams and a pointed (gabled) roof protect the King's Chamber; the base is level to about 2 cm and the sides point north to within a tenth of a degree. Built by thousands of workers, not slaves; their tombs lie beside the pyramids. Originally 146.6 m tall, the tallest human-made structure for more than 3,800 years."
