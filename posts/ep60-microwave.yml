  at: "2026-11-22T14:00:00Z"    # 06:00 PT Sun Nov 22 = 4 pm Cairo
  title: "الميكروويف: بيغلي المية من غير نار 🍿"
  text: |
    لا نار ولا لهب، والمية بتغلي: الموجات بتهز جزيئاتها مليارات المرات في الثانية! 🍿
    لمبة ماجنترون من الرادار، وصندوق معدن بيرجّع الموجات، وشبكة في الباب خرومها أصغر من الموجة بس النور بيعدي، وطبق بيلف يعدّي كل لقمة على الحتت السخنة، ومفاتيح بتفصل الكهربا قبل ما الباب يتفتح. وكله بدأ لما الشوكولاتة ساحت في جيب مهندس رادار.
    أمك برضه بتقولك ابعد عن الميكروويف؟ 👇
  next: "برج بيزا المايل 🇮🇹"
  seo: "إزاي الميكروويف بيشتغل: جواه لمبة اسمها الماجنترون، نفس اللي في الرادار، بتطلع موجات طولها حوالي اتناشر سانتي. جزيء المية ليه طرف موجب وطرف سالب، والموجات بتلفه رايح جاي حوالي مليارين ونص مرة في الثانية، فالمية اللي في الأكل بتسخن من جوه، مش من برة لجوه زي النار. حيطان المعدن بترجّع الموجات جوه الصندوق، والباب فيه شبكة معدن خرومها أصغر بكتير من الموجة، فالموجات ماتعرفش تطلع، بس النور بموجاته الصغيرة بيعدي وانت تشوف الأكل. والموجات وهي بتخبط بتعمل حتت سخنة وحتت ساقعة، عشان كده الطبق بيلف ويعدّي الأكل عليهم. ومفاتيح في قفل الباب بتفصل الكهربا قبل ما الباب يتفتح. الفكرة جت سنة ألف تسعمية خمسة وأربعين، لما مهندس الرادار بيرسي سبنسر لقى الشوكولاتة اللي في جيبه سايحة جنب الماجنترون، وأول ميكروويف اتباع سنة ألف تسعمية سبعة وأربعين كان طوله حوالي متر وتمانين ووزنه حوالي تلتمية وأربعين كيلو."
