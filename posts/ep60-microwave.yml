  title: "Microwave Oven: Boiling Water With No Fire 🍿"
  text: |
    No fire, no flame, and the water boils: the waves shake its molecules billions of times a second. 🍿
    A magnetron borrowed from radar, a metal box that bounces the waves back, a door mesh with holes too small for them but not for light, a turntable that carries every bite through the hot spots, and switches that cut the power before the door opens. It all started when a radar engineer's chocolate bar melted in his pocket.
    Do you stop it at 0:01 so it won't beep? 👇
  next: "the Leaning Tower of Pisa 🇮🇹"
  seo: "How a microwave oven works: a magnetron, the same kind of tube used in radar, makes microwaves at about 2.45 GHz, waves about 12 cm long. Water molecules have a positive and a negative end, and the waves twist them back and forth about 2.45 billion times a second, so the water in the food heats up from inside instead of from the outside in like a flame. The metal walls bounce the waves back so they stay in the box, and the door has a metal mesh whose holes are much smaller than the waves, so they cannot get out while light, with its tiny waves, passes through and you can see your food. Waves bouncing inside make hot spots and cold spots, so a turntable carries the food through them. Switches in the door latch cut the power before the door opens. The idea came in 1945, when radar engineer Percy Spencer noticed the chocolate bar in his pocket had melted next to a magnetron; the first microwave oven, sold in 1947, stood almost 2 m tall and weighed about 340 kg."
