    أقراص حديد بتتدحرج وتكسر الصخر، وحلزونة كبيرة وسير بيطلعوا الردم لبرة، ودراع روبوت بيركب حلقات خرسانة ورا الراس، والأوضة اللي ورا الراس مليانة طين بيزق قصاد الأرض عشان الشارع اللي فوق ما يهبطش.
