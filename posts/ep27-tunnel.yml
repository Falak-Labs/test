  title: "How a Tunnel Boring Machine Digs Under a City 🚇"
  text: |
    How do you dig a tunnel under a whole city without it caving in? 🚇
    Steel discs roll and crack the rock, a giant screw and a conveyor belt carry the rubble out, a robot arm builds concrete rings behind the head, and the chamber stays packed with mud so the street above doesn't sink.
    What would you name yours? 👇
  next: "a bullet train 🚄"
  seo: "Tunnel boring machine (TBM) explained: disc cutters on the cutterhead, screw conveyor and belt conveyor for the muck, segment erector and concrete lining rings, thrust jacks pushing off the rings, earth pressure balance against settlement, why TBMs get women's names (Saint Barbara), Bertha in Seattle: 17.5 m wide, 99 m long, about 6,000 tons."
