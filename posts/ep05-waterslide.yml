  title: "How Water Slides Work: Why You Don't Fly Off the Turns 🌊"
  text: |
    Why don't you fly off a water slide? 🌊
    It starts as water on a plastic ramp. Then you add pumps, banked turns, a red light that waits for the rider ahead, and a splash pool deep enough to land in.
    What's the scariest slide you've ever ridden? 👇
  next: "a rocket that lands itself 🚀"
  seo: "Pumps that keep a sheet of water flowing, banked curves, raised walls and a closed tube, a dispatch light with an exit sensor, a run-out lane and a deep splash pool."
