  title: "نايلون الفقاعات: كان ورق جدران! 🫧"
  text: |
    نايلون الفقاعات اخترعوه عشان يكون... ورق جدران! 🫧
    سنة ١٩٥٧ اثنين مخترعين في أمريكا لزقوا ستارتين شاور على بعض عشان يسوون ورق جدران بارز. محد اشتراه، وحتى كعازل للبيوت الزجاجية ما مشى. اللي نجح هو الهوا المحبوس: فقاعات صغيرة كثير تمتص الصدمة، ولو وحدة انفقعت الباقي يشيل. البلاستيك الحار ينسحب لأكواب صغيرة على أسطوانة، وطبقة ثانية تسكّر على الهوا. وبعدين آي بي إم احتاجت تشحن كمبيوترها الجديد، ولفّته بالفقاعات. والحين فيه نوع يجي مسطّح وينفخونه وقت التغليف، عشان الشاحنات ما تشيل هوا.
    وأمكم، للحين حاطة النايلون على الكنب؟ 👇
  next: "نفق فيضانات طوكيو 🌊"
  seo: "كيف انخلق نايلون الفقاعات وكيف يتصنع: ألفريد فيلدينغ ومارك شافان لزقوا ستارتين شاور بلاستيك سنة ١٩٥٧ عشان يبيعونه ورق جدران بارز، وما نجح، ولا نجح كعازل للبيوت الزجاجية. شركتهم سيلد إير (١٩٦٠) لقت سوقها لما غلّفت كمبيوتر آي بي إم الجديد ١٤٠١ للشحن. يتصنع بسحب بلاستيك البولي إيثيلين الحار بالشفط لأكواب على أسطوانة، وبعدين تنلصق عليه طبقة مسطحة تحبس الهوا؛ الفقاعات الصغيرة الكثيرة توزع الصدمة، ولو انفقعت وحدة ما يروح الحماية. والأنواع الجديدة تنشحن مسطحة وتنتفخ عند طاولة التغليف عشان توفر مكان في الشاحنات."
