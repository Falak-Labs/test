  title: "Bubble Wrap Was Invented as Wallpaper 🫧"
  text: |
    Bubble wrap was invented to be… wallpaper. 🫧
    In 1957 two inventors in New Jersey sealed two shower curtains together to make a bumpy wallpaper. Nobody wanted it, and greenhouse insulation flopped too. What worked was the trapped air: lots of tiny bubbles cushion a fall, and if one pops the rest still hold. Hot plastic is sucked into little cups on a roller and a flat sheet seals the air in. Then IBM needed to ship its new computer, and bubble wrap kept it safe. Some bubble wrap now ships flat and gets pumped up where you pack, so trucks don't haul air.
    Be honest: how many bubbles do you pop before you use it? 👇
  next: "Tokyo's giant flood tunnel 🌊"
  seo: "How bubble wrap was invented and how it's made: Alfred Fielding and Marc Chavannes sealed two plastic shower curtains together in 1957 hoping to sell textured wallpaper; it flopped, and so did greenhouse insulation. Their company, Sealed Air (1960), found its market protecting IBM's new 1401 computer in shipping. Bubble wrap is made by vacuum-forming hot polyethylene film into cups on a roller and laminating a flat film on top to trap the air; many small bubbles spread a blow, and one pop does not lose the cushion. Newer kinds ship as flat film and are inflated at the packing table to save truck space."
