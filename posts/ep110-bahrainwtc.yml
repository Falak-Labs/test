  title: "مركز البحرين التجاري العالمي: برجين شايلين مراوح هوا 🌬️"
  text: |
    برجين في البحرين شايلين بينهم... ثلاث مراوح هوا عملاقة! 🌬️
    مركز البحرين التجاري العالمي في المنامة معلّق على كل جسر من جسوره الثلاثة مروحة عرضها ٢٩ متر، ولفّوا مع بعض أول مرة سنة ٢٠٠٨. المراوح مثبّتة ما تلف، فوجّهوها للشمال على نسمة البحر من الخليج، والبرجين اللي شكلهم شراع يلوون الهوا ويوجّهونه على الريش عدل. ووسايد مطاط في أطراف الجسور تخلّي البرجين يتحركون نص متر مع الهوا، والبرجين يضعفون كل ما ارتفعوا عشان الثلاث مراوح ياخذون تقريباً نفس الهوا. والمفاجأة: دراسة سنة ٢٠١٤ تقول لو كانوا بالعكس كان طلّعوا ١٤٪ زيادة!
    منشن أبوك اللي يطفّي الأنوار وراك 👇
  next: "قفل ما يفتحه إلا مفتاحك 🔑"
  seo: "كيف تشتغل مراوح الهوا في مركز البحرين التجاري العالمي: برجين في المنامة طول كل واحد ٢٤٠ متر و٥٠ دور، شكلهم مثل الشراع، صممتهم شركة أتكنز، وبينهم ثلاث جسور على كل جسر مروحة هوا قطرها ٢٩ متر وقوتها ٢٢٥ كيلوواط، موجّهة للشمال على نسمة الخليج، ولفّت الثلاث مع بعض أول مرة في أبريل ٢٠٠٨. المراوح ثابتة ما تقدر تلف على الهوا، فالبرجين يشتغلون مثل الجناح ويلوون الهوا ويضربونه على الريش عدل، ووسايد في أطراف الجسور تخلّي البرجين يتحركون حوالي نص متر عن بعض، والبرجين يضعفون مع الارتفاع عشان الثلاث مراوح ياخذون هوا متقارب. انحسبت تعطي حوالي ١١ إلى ١٥٪ من كهربا البرجين، ودراسة من جامعة آيندهوفن سنة ٢٠١٤ لقت إنهم لو كانوا بالعكس كان طلّعوا حوالي ١٤٪ طاقة زيادة."
