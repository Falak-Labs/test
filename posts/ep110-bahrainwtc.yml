  title: "Bahrain World Trade Center: Two Towers Holding Wind Turbines 🌬️"
  text: |
    These two towers in Bahrain hold… three giant wind turbines. 🌬️
    The Bahrain World Trade Center in Manama hangs a turbine 29 m wide on each of three sky bridges, and they first spun together in 2008. The turbines are bolted in place, so they face north into the steady sea breeze off the Gulf, and the sail-shaped towers bend the wind so it hits the blades straight on. Rubber bearings at the bridge ends let the swaying towers move half a meter, and the towers narrow as they rise, so all three turbines get about the same wind. The twist: a 2014 study says that the other way round, they'd make 14% more energy.
    Would you work between the blades? 👇
  next: "a lock that only your key can open 🔑"
  seo: "How the Bahrain World Trade Center's wind turbines work: two 50-floor, 240 m sail-shaped towers in Manama, designed by Atkins, hold three 225 kW turbines with 29 m rotors on sky bridges between them, aligned north toward the steady breeze from the Gulf; they turned together for the first time in April 2008. The rotors are fixed and cannot turn to face the wind, so the elliptical towers act like aerofoils that funnel the breeze and straighten it to strike the blades head on; bearings where the bridges meet the towers let the towers move about half a metre relative to each other, and the towers taper with height so the three turbines see similar wind speeds. They were designed to supply about 11 to 15 percent of the towers' power. A 2014 Eindhoven University of Technology (TU/e) study found they would produce about 14 percent more wind energy if the towers were positioned the other way round."
