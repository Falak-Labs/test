  title: "Great Wall of China: A Wall Glued With Rice Soup 🧱"
  text: |
    A wall that would wrap more than halfway around the Earth, and parts of it are glued with sticky rice soup. 🧱
    It rides the mountain ridges where horses can't charge, uses rammed earth, reeds and gravel where there's no stone, and its beacon towers pass smoke from tower to tower: one smoke for 100 raiders, five for 10,000.
    Did you know about the rice? 👇
  next: "an Omani falaj 💧"
  seo: "How the Great Wall of China was built and how it worked: a 2012 survey by China's cultural heritage administration measured all of its sections, built over more than 2,000 years from the 7th century BC to the Ming dynasty (1368-1644), at 21,196 km, more than half of Earth's circumference. It follows mountain ridges, where cliffs stop cavalry coming from the northern grasslands. In the Gobi Desert, with no stone or wood, Han-era builders rammed earth in wooden frames and stacked layers of reeds or willow with sand and gravel; some of it still stands 2,000 years later. Ming builders added sticky rice soup to lime mortar: the amylopectin in the rice makes smaller, tightly packed calcium carbonate crystals, so the mortar is stronger and resists water (Zhang Bingjian's team, Zhejiang University, 2010). Beacon towers within sight of each other relayed warnings with smoke by day and fire by night; under Ming rules one smoke and one cannon shot meant about 100 raiders and five meant 10,000. In Chinese, warning smoke is called wolf smoke (langyan). The wall cannot be seen from the Moon with the naked eye."
