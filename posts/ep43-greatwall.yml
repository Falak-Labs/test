  title: "سور الصين العظيم: سور ملصوق بشوربة رز 🧱"
  text: |
    سور يلف أكثر من نص الأرض، وأجزاء منه ملصوقة بشوربة رز! 🧱
    يمشي فوق قمم الجبال عشان الخيل ما تطلع، وفي الصحرا بنوه من تراب مدكوك وقصب وحصى، وأبراجه ترسل دخان من برج لبرج: دخانة يعني مية غازي، وخمس دخانات يعني عشرة آلاف.
    كنت تدري عن الرز؟ 👇
  next: "فلج عماني 💧"
  seo: "كيف انبنى سور الصين العظيم وكيف كان يشتغل: مسح رسمي في الصين سنة ألفين واثنعش قاس كل أجزاءه، وطلع طوله واحد وعشرين ألف ومية وستة وتسعين كيلو، يعني أكثر من نص محيط الأرض، وانبنى على أكثر من ألفين سنة لين أيام أسرة مينغ. السور يمشي فوق قمم الجبال، والجرف يوقف خيل الغزاة الجايين من سهول الشمال. وفي صحرا غوبي، ما فيه حجر ولا خشب، فدكوا التراب في قوالب خشب طبقة فوق طبقة، ورصوا قصب مع رمل وحصى، وبعضه للحين واقف من ألفين سنة. وأيام مينغ خلطوا شوربة الرز اللزج مع الجير، والنشا اللي في الرز يخلي بلورات الجير صغيرة ومشدودة، فتصير الخلطة أقوى وما تشرب موية. والأبراج تشوف بعض، ترسل دخان بالنهار ونار بالليل: دخانة وطلقة مدفع يعني حوالي مية غازي، وخمس يعني عشرة آلاف. والصينيين يسمون دخان التحذير دخان الذيب. وبالمناسبة، السور ما يبان من القمر بالعين."
