  title: "High-Speed Chairlift: Why the Chairs Let Go of the Cable 🚡"
  text: |
    These chairs let go of their cable… on purpose. 🚡
    The cable on a high-speed chairlift runs about as fast as a bike, way too fast to sit down on. So in the station a spring grip opens, the chair rolls off the cable onto a rail, and a row of spinning tires slows it to a walk while you sit. Then the tires speed it back up and the grip snaps shut on the cable again. Springs squeeze every grip shut, and one weak grip stops the whole lift. Steel cable gets longer in the heat, so a giant concrete weight keeps it tight. And the first chairlift, Sun Valley 1936? A railroad engineer who had worked on banana loaders swapped the hooks for chairs.
    Skis, snowboard, or hot chocolate in the lodge? 👇
  next: "ice that gets a hot water bath ⛸️"
  seo: "How a detachable (high-speed) chairlift works: the haul rope runs at about 1,000 feet per minute (around 5 m/s), too fast to board, so in each terminal a spring-loaded grip opens and the chair leaves the rope, rides a rail on rows of rubber tires that slow it to walking pace for loading, then speeds back up before the grip clamps the rope again. Grips are checked for clamping force before they leave the station, and insufficient grip force stops the lift. A counterweight or hydraulic tensioning system takes up the rope's stretch with temperature and keeps friction on the drive bullwheel. The world's first chairlifts opened at Sun Valley, Idaho, in December 1936, designed by Union Pacific engineer James Curran from a conveyor that loaded bananas onto ships, with chairs in place of the hooks."
