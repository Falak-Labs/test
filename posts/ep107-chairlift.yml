  title: "تلفريك الكراسي: ليش الكرسي يفك الكيبل؟ 🚡"
  text: |
    هالكراسي تفك الكيبل في كل محطة... عن قصد! 🚡
    كيبل التلفريك السريع يمشي تقريباً بسرعة السيكل، وما تقدر تقعد عليه وهو مسرع. فإذا وصل الكرسي المحطة، الماسكة تنفك ويطلع على سكة، وكفرات تدور تهدّيه لين يمشي على هونه وأنت تقعد، وبعدين تسرّعه وترجع الماسكة تسكّر على الكيبل. وسوست قوية تقفل كل ماسكة، ولو وحدة طلعت ضعيفة يوقف التلفريك كله. وكيبل الحديد يطوّل في الحر، فثقل خرسانة عملاق يخليه مشدود. وأول تلفريك كراسي؟ سنة ١٩٣٦، سوّاه مهندس سكة حديد كان يشتغل على رافعات موز: شال خطاطيف الموز وحط كراسي!
    منشن واحد يخاف من التلفريك 👇
  next: "ثلج يتسبّح بموية حارة ⛸️"
  seo: "كيف يشتغل تلفريك الكراسي السريع: الكيبل يمشي تقريباً ٣٠٠ متر بالدقيقة، أسرع من إنك تركب عليه، فإذا دخل الكرسي المحطة تنفك ماسكته (فيها سوست) ويمشي على سكة فوق صفوف كفرات تهدّيه لين سرعة المشي وقت الركوب، وبعدين تسرّعه وترجع الماسكة تمسك الكيبل. وتنفحص قوة كل ماسكة قبل تطلع من المحطة، ولو كانت ضعيفة يوقف التلفريك. وثقل خرسانة أو نظام هيدروليكي يشد الكيبل لأنه يطوّل مع الحرارة. وأول تلفريك كراسي في العالم انفتح في صن فالي بولاية أيداهو الأمريكية في ديسمبر ١٩٣٦، صممه مهندس سكك حديد اسمه جيمس كوران من سير يحمّل الموز على السفن، وحط كراسي بدل الخطاطيف."
