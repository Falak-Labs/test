  en: media/sm07-en.mp4
  ar: media/sm07-ar.mp4
# YouTube gets both the full video and this short through YouTube Studio (the main chat, `show` branch), so both YouTube
# targets stay on hold for good. TikTok and Instagram start on hold too: the main chat releases them with
