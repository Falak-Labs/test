en:
  at: "2026-11-28T20:15:00Z"      # 12:15 PT Sat Nov 28; the full video goes public on YouTube at 10:00 PT
  title: "Water Too Hot for Your Hands 🧽 Survival Mode: You vs Chores"
  text: |
    No hands. No ice. No broom. 🧹
    Level 1: the dinner table. A big dinner is over, and washing it all by hand can send up to a hundred liters down the drain, so you close the dishes in a box and let arms that spin with no motor wash them with about twelve.
    Three more bosses are waiting. All 4 levels are on our YouTube channel: @congratsengineer
    Which one would beat you first: the dishes, the laundry, the heat or the dust? 👇
  tags:
    tiktok: "#survival #engineering #dishwasher #howitworks #learnontiktok"
    instagram: "#survival #engineering #dishwasher #howitworks #chores"
    youtube: "#survival #engineering"
