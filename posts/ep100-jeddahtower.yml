  title: "برج جدة: أول برج طوله كيلو 🏙️"
  text: |
    في جدة قاعدين يبنون برج طوله كيلو كامل... ووصل تقريباً للنص! 🏙️
    أرض جدة صخر لين مليان صدف، فحطوا تحته ٢٧٠ عمود بعضها ينزل ١٠٥ متر، وفوقها قاعدة خرسانة سماكتها ٥ متر. وفوق، الهوا أسرع بعشر مرات من تحت، فالبرج يصير أنحف كل ما طلع، وثلاث أجنحة تسند النص مثل الستاند. وحبال المصاعد الحديد بهالطول تصير ثقيلة مرة، فالمصاعد بتمشي على سيور كربون خفيفة، فوق ٦٣٠ متر بطلعة وحدة.
    البناء رقم ١٠٠ في السلسلة! تركب هالمصعد ولا لا؟ 👇
  next: "رشاش الحريق: واحد بس يشتغل 🔥"
  seo: "كيف ينبني برج جدة: أول مبنى مخطط يتعدى ١٠٠٠ متر، في جدة بالسعودية. واقف على قاعدة خرسانة سماكتها ٥ متر فوق ٢٧٠ عمود محفور لين ١٠٥ متر في صخر جيري لين مليان صدف. شكله بثلاث أجنحة يصير أنحف كل ما طلع، يكسر دوامات الهوا ويسند القلب، ومصاعد كوني بحبال ألياف الكربون بتطلع أكثر من ٦٣٠ متر بطلعة وحدة. نهاية أكتوبر ٢٠٢٦ وصل القلب حوالي ٤٨٤ متر (الدور ١٢١) وعدّى أبراج بتروناس، والمتوقع يخلص سنة ٢٠٢٨."
