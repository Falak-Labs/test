  title: "Jeddah Tower: Our 100th Build Goes One Kilometer Up 🏙️"
  text: |
    Saudi Arabia is building a tower a thousand meters tall… and it's almost halfway. 🏙️
    Jeddah sits on soft limestone full of old seashells, so 270 piles go down as deep as 105 m under one thick slab. Up top the wind can blow ten times faster than on the street, so the tower gets skinnier as it rises and three wings brace the middle like a tripod. Steel lift ropes that long get too heavy, so the lifts will ride light carbon-fiber belts, over 630 m in one go.
    Our 100th build! Would you ride that lift? 👇
  next: "a fire sprinkler (only one turns on) 🔥"
  seo: "How the Jeddah Tower is being built: planned as the first building over 1,000 m tall, in Jeddah, Saudi Arabia. It stands on a 5 m thick raft over 270 bored piles up to 105 m deep in soft, porous limestone full of shells. Its three-winged, tapering shape (Adrian Smith + Gordon Gill) breaks up the wind's whirlpools and braces the core, and KONE's carbon-fiber UltraRope lifts will make a ride of more than 630 m. By late October 2026 the core had reached about 484 m (the 121st floor), past the Petronas Towers; completion is planned for 2028."
