  title: "Sydney Opera House: A Roof Cut From One Giant Ball 🎭"
  text: |
    A whole roof carved from slices of one giant ball. 🎭
    Nobody knew how to build the winning sketch, until every shell was cut from the same sphere, like peeling an orange: 2,194 pieces cast on site, set by cranes and pulled tight with 350 km of steel cable, then covered in over a million Swedish tiles that the rain washes clean.
    What's the longest your "quick" renovation ever took? 👇
  next: "a giant Ferris wheel 🎡"
  seo: "How the Sydney Opera House was built: the Danish architect Jørn Utzon won the 1957 design competition with a sketch of sail-like shells that nobody knew how to build. After years of trying, the answer was the spherical solution: every shell is cut from the surface of the same sphere, like slices of orange peel, so every curve is the same curve. That let the roof be made of 2,194 precast concrete pieces, cast on site in a few reusable molds, some weighing up to 15 tonnes, lifted into place by cranes and held together by about 350 km of tensioned steel cable. The shells are covered in 1,056,006 Swedish tiles in glossy white and matte cream that the rain washes clean. The highest shell is about 67 m above sea level. Utzon left the project in 1966 and never came back to see it finished; it opened in 1973, ten years late and at about fourteen times the first cost estimate, and became a UNESCO World Heritage Site in 2007."
