  title: "أوبرا سيدني: سقف من شرايح كورة وحدة 🎭"
  text: |
    سقف كامل طالع من شرايح كورة وحدة! 🎭
    التصميم اللي فاز محد عرف كيف ينبني، لين قصّوا كل قشرة من نفس الكورة مثل ما تقشر برتقالة: ألفين ومية وأربعة وتسعين قطعة انصبّت في الموقع، والرافعات رفعتها وحدة وحدة، وكيابل حديد شدّتها، وفوقها أكثر من مليون بلاطة سويدية المطر يغسلها.
    كم مرة قال لك المقاول: أسبوعين وأسلمك؟ 👇
  next: "عجلة دوّارة عملاقة 🎡"
  seo: "كيف انبنت دار أوبرا سيدني: المعماري الدنماركي يورن أوتزون فاز بالمسابقة سنة ألف وتسعمية وسبعة وخمسين برسمة أشرعة بيضا محد عرف كيف تنبني. وبعد سنين من المحاولات لقوا الحل: كل قشرة مقصوصة من سطح نفس الكورة، مثل شرايح قشر البرتقال، فكل الانحناءات صارت وحدة. وكذا قدروا يسوون السقف من ألفين ومية وأربعة وتسعين قطعة خرسانة انصبّت في الموقع بكم قالب بس، بعضها يوصل خمسطعش طن، والرافعات رفعتها وحدة وحدة، وشدّتها كيابل حديد طولها حوالي ثلاثمية وخمسين كيلو. والقشور متغطية بأكثر من مليون بلاطة سويدية، لامعة ومطفية، والمطر يغسلها. وأعلى قشرة حوالي سبعة وستين متر فوق البحر. أوتزون ترك المشروع سنة ألف وتسعمية وستة وستين وما رجع يشوفها خلصانة، وانفتحت سنة ألف وتسعمية وثلاثة وسبعين متأخرة عشر سنين وكلّفت حوالي أربعطعش ضعف التقدير الأول، وصارت من التراث العالمي سنة ألفين وسبعة."
