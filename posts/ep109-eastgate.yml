  title: "مركز إيستغيت: عمارة قلّدت بيت النمل الأبيض 🐜"
  text: |
    عمارة مكاتب في زيمبابوي... قلّدت بيت النمل الأبيض! 🐜
    مكاتب الزجاج تصير فرن مع الشمس، بس مركز إيستغيت في هراري (١٩٩٦) ما فيه تكييف عادي. جدرانه خرسانة سميكة ودرايشه صغيرة مستخبية ورا حواف تظللها، فتشرب حرارة النهار على مهلها. وبالليل مراوح كبيرة تدز هوا الليل البارد داخل أرضيات مجوّفة، والهوا يتجدد عشر مرات بالساعة، فتبرد الخرسانة. وبالنهار مراوح صغيرة تسحب الهوا من الأرضيات الباردة، والهوا الحار يطلع في ممرات طويلة ويخرج من ٤٨ مدخنة طوب فوق السطح. والمفاجأة: العلماء لقوا إن بيت النمل يتنفّس مثل الرية... يعني قلّدوه غلط، وللحين شغّال!
    منشن خويك اللي يتهاوش على ريموت المكيّف 👇
  next: "برجين شايلين مراوح هوا عملاقة 🌬️"
  seo: "كيف يبرد مركز إيستغيت في هراري بزيمبابوي بدون تكييف عادي: صممه المعماري ميك بيرس مع مهندسين شركة آروب وافتتح سنة ١٩٩٦، وهو عمارتين طويلة من الخرسانة بينهم ساحة بسقف زجاج. جدران الخرسانة والحواف البارزة تظلل الدرايش الصغيرة وتخزّن الحرارة، وبالليل مراوح كبيرة تجدد الهوا حوالي عشر مرات بالساعة داخل أرضيات مجوّفة فيها أسنان خرسانة فتبرد العمارة لليوم الجاي، وبالنهار مراوح صغيرة تسحب الهوا من الأرضيات الباردة، والهوا الحار يطلع في ممرات داخلية ويخرج من ٤٨ مدخنة طوب فوق السطح. الفكرة جات من اعتقاد قديم إن بيت النمل الأبيض يشتغل مثل المكيف، بس أبحاث سكوت تيرنر وفريق من هارفارد سنة ٢٠١٥ لقت إن بيت النمل يتنفّس مرة باليوم مثل الرية."
