  title: "Eastgate Centre: The Office That Copied a Termite Mound 🐜"
  text: |
    This office in Zimbabwe copied… a termite mound. 🐜
    Glass offices bake like ovens, but Harare's Eastgate Centre (1996) has no ordinary air conditioning. Thick concrete walls and small windows behind shady ledges soak up the day's heat slowly. At night, big fans push cold night air through hollow floors, about ten fresh air changes an hour, and the concrete cools down. By day, small fans pull air through those cold floors, and the warm air rises up tall shafts and out of 48 brick chimneys on the roof. The twist: scientists later found termite mounds mostly breathe, like a lung. It copied them wrong, and it still works.
    Would you work there? 👇
  next: "two towers holding giant wind turbines 🌬️"
  seo: "How the Eastgate Centre in Harare, Zimbabwe, keeps cool without conventional air conditioning: designed by architect Mick Pearce with engineers Arup and opened in 1996, it is two long concrete buildings linked by a glass-roofed atrium. Precast concrete walls with protruding ledges shade small windows and store heat; at night high-volume fans give about ten air changes an hour through hollow floor slabs lined with concrete teeth, cooling the structure for the next day; by day low-volume fans draw air through the cooled floors, and warm air rises through internal stacks to 48 brick chimneys on the red tiled roof. It was inspired by the old idea that termite mounds work as air conditioners; later research by Scott Turner and a Harvard team (2015) found the mounds mostly ventilate, breathing in and out once a day like a lung."
