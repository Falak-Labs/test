  text: |
    روبوت وزنه اتنين كيلو بيركب جمل سباق، وصاحبه بيزعقله من العربية! 🐪
    شنيور بيلف كرباج بلاستيك صغير، وسماعة جنب ودن الجمل بتوصّله صوت صاحبه من اللاسلكي، والروبوت لابس وش ونضارة شمس وهدوم سباق وكمان برفان الجوكية القدام.
    تسوق في الزحمة دي؟ 👇
  next: "عربية كهربا ⚡"
  seo: "سباق الهجن بالروبوت في الخليج: أول روبوتات جوكي في قطر كانت تقيلة قد شنطة السفر، ودلوقتي وزنها حوالي اتنين كيلو: شنيور بيلف كرباج بلاستيك بزرار من بعيد، لاسلكي وسماعة عشان صاحب الجمل يكلمه، ووش صغير ونضارة شمس وهدوم سباق وبرفان عشان الجمال ما تتخضش. أصحاب الجمال بيجروا وراهم بالعربيات على طريق جنب الحلبة، والجمل بيجري لحد خمسة وستين كيلو في الساعة وتمنه ممكن يعدي مليون درهم."
