  title: "How Robot Jockeys Race Camels at 60 km/h 🐪"
  text: |
    A 2 kg robot rides a racing camel while its owner shouts from an SUV. 🐪
    A cordless drill spins a little plastic whip, a speaker by the camel's ear plays the owner's voice over a walkie-talkie, and the robot wears a face, sunglasses, racing silks and even the old jockeys' perfume.
    Would you drive in that convoy? 👇
  next: "an electric car ⚡"
  seo: "How robot camel jockeys work in Gulf camel racing (Qatar, UAE, Saudi Arabia): the first robot jockeys (Qatar, 2004-2005) weighed as much as a suitcase; today's weigh about 2 kg: a cordless drill that spins a plastic whip at the press of a remote button, a two-way radio and a speaker so the owner can talk to the camel, sometimes the camel's speed and heart rate. Faces, sunglasses, racing silks and jockeys' perfume stopped the camels being scared. Owners chase them in SUVs on a road beside the track. Racing camels sprint up to 65 km/h and can be worth over a million dirhams."
