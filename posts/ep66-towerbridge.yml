  title: "Tower Bridge: The Road That Stands Up 🇬🇧"
  text: |
    A road in the middle of London that stands straight up to let a ship through. 🇬🇧
    Each half is a giant seesaw of over a thousand tons, balanced by a counterweight hidden in the tower, so a small push lifts it. In 1894 steam engines pumped water into tanks under pressure, ready the moment a ship arrived, and walkways 42 m up let people cross while the road was up. In 1952 it opened with a bus still on it, and the driver jumped the gap.
    Would you have floored it? 👇
  next: "the Colosseum 🏛️"
  seo: "How Tower Bridge lifts its road: London's Tower Bridge, built from 1886 to 1894 by Horace Jones and John Wolfe Barry, is a bascule and suspension bridge. London's busiest docks, the Pool of London, were upstream, so tall ships had to get past, and a fixed bridge low enough for carts would have blocked them. The road between the two towers is split into two bascules, each like a giant seesaw turning on an axle, weighing over 1,000 tonnes and balanced by a counterweight inside its pier, so only a small force is needed to raise it. The original machinery used steam engines to pump water into hydraulic accumulators, which stored it under pressure so the bridge could open as soon as a ship arrived; electro-hydraulic drives replaced them in the 1970s. The high walkways, 42 m above the river, let people on foot cross while the road was up. In December 1952 the bridge began to open while a number 78 double-decker bus was on it, and driver Albert Gunter accelerated and jumped the gap to the other half. The bridge still opens around 800 times a year, free of charge, for ships that book ahead."
