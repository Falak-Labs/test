  title: "جسر البرج: الطريق اللي يوقف على حيله 🇬🇧"
  text: |
    طريق في نص لندن يوقف على حيله عشان تمر سفينة! 🇬🇧
    كل نص مثل الميزان، يوزن أكثر من ألف طن، وطرفه الثقيل داخل البرج، ودفّة صغيرة ترفعه. وفي ألف وثمنمية وأربعة وتسعين كانت مكاين البخار تضخ موية في خزانات تحت ضغط جاهزة على طول، والممرات فوق على ارتفاع اثنين وأربعين متر للناس اللي يمشون. وقبل أكثر من سبعين سنة، الجسر انفتح وعليه باص، والسوّاق دعس ونط الفتحة!
    لو مكانه، تدعس ولا توقف؟ 👇
  next: "الكولوسيوم 🏛️"
  seo: "كيف جسر البرج في لندن يرفع الطريق: جسر البرج انبنى من ألف وثمنمية وستة وثمانين لين ألف وثمنمية وأربعة وتسعين، وهو جسر متحرك ومعلّق. أكبر ميناء في لندن كان ورا الجسر، والسفن الطويلة لازم تمر، والجسر الثابت الواطي كان بيسكّر عليها. الطريق بين البرجين مقسوم نصين، كل نص مثل الميزان يلف على محور، ويوزن أكثر من ألف طن، ويقابله ثقل داخل قاعدة البرج، فيحتاج قوة صغيرة بس عشان يرتفع. المكاين الأصلية كانت مكاين بخار تضخ موية في خزانات تخزنها تحت ضغط، عشان الجسر ينفتح أول ما توصل السفينة، وفي السبعينات بدلوها بنظام كهربائي هيدروليكي. والممرات اللي فوق، على ارتفاع اثنين وأربعين متر عن النهر، كانت للناس اللي يمشون عشان يعبرون والطريق مرفوع. وفي ديسمبر سنة ألف وتسعمية واثنين وخمسين بدأ الجسر ينفتح وعليه باص دورين، والسوّاق ألبرت غنتر دعس ونط الفتحة للنص الثاني. وللحين الجسر ينفتح حوالي ثمنمية مرة في السنة ببلاش، للسفن اللي تحجز قبل."
