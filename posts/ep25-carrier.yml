  title: "How an Aircraft Carrier Lands Jets on a Tiny Runway ✈️"
  text: |
    How do you land a fighter jet on a ship? ✈️
    The deck is only about three football fields long, so a catapult flings jets to 160 mph in two seconds, steel cables catch them on the way back, an angled strip lets a missed landing take off again, and two nuclear reactors keep it sailing for 20 years.
    Would you try that landing? 👇
