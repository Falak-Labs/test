  title: "شبام: ناطحات سحاب من طين 🏜️"
  text: |
    مدينة كاملة ناطحات سحاب من طين، وواقفة قرابة خمسمية سنة! 🏜️
    مبنية على تلة مرتفعة عشان السيل يمشي من حولها، وقرابة خمسمية بيت برج من خمس لإحدعش دور لازقة في بعض، والجدار عريض تحت ويرق مع كل دور، والنورة البيضا فوق، وبعد كل مطرة يلبّسون الجدران طين جديد. والأدوار اللي تحت بدون شبابيك: الحب والغنم تحت، والعيلة فوق.
    تسكن في الدور الحدعش؟ 👇
  next: "جسر البرج في لندن 🇬🇧"
  seo: "كيف ناطحات شبام الطين واقفة: شبام في وادي حضرموت مدينة مسوّرة فيها حوالي خمسمية بيت برج مبنية من طوب الطين المجفف بالشمس، وأغلبها من القرن السادس عشر، عشان كذا يسمونها أقدم مدينة ناطحات سحاب في العالم ومانهاتن الصحرا. المدينة مبنية على تلة مرتفعة وسط الوادي، فالسيل اللي ينزل نادر بس قوي يمشي من حولها، وحولها سور. والمكان فوق التلة ضيق، فالبيوت طلعت لفوق بدل ما تتمدد: من خمس لإحدعش دور، وبعضها أطول من ثلاثين متر، من أطول مباني الطين في العالم، ولازقة في بعض. الجدران أعرض شي تحت وترق مع كل دور، فالبرج يضيق وهو طالع وثقله ما يسحق الجدران اللي تحت. والطين يذوب مع المطر، فيصبغون الأدوار اللي فوق بالنورة البيضا، والأهل يلبّسون جدرانهم طين جديد كل شوي. والأدوار اللي تحت ما فيها شبابيك وكانت للحب والمواشي، والعيلة تسكن فوق. وشبام من مواقع التراث العالمي في اليونسكو من سنة ألف وتسعمية واثنين وثمانين."
