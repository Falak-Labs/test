  title: "Shibam: The Mud Skyscraper City 🏜️"
  text: |
    A whole city of skyscrapers made of mud, standing for about 500 years. 🏜️
    Built on a raised mound so desert flash floods flow around it, about 500 tower houses of 5 to 11 floors packed wall to wall, walls thick at the bottom and thinner on every floor, white lime on the tops, and fresh mud after every rain. The bottom floors have no windows: grain and goats down there, the family up high.
    Would you live on the 11th floor of a mud tower? 👇
  next: "London's Tower Bridge 🇬🇧"
  seo: "How Shibam's mud skyscrapers stand: Shibam, in Wadi Hadhramaut, is a walled city of about 500 tower houses built of sun-dried mud brick, most of them from the 16th century, which is why it is called the oldest skyscraper city in the world and the Manhattan of the desert. The city sits on a raised mound in the middle of the valley, so the rare but violent flash floods flow around it, and it is surrounded by a wall. With little space on the mound, the houses grew up instead of out: five to eleven storeys each, some over 30 m tall, among the tallest mud buildings in the world, packed wall to wall. Their walls are thickest at the bottom and get thinner on every floor, so each tower tapers as it rises and its weight does not crush the lowest walls. Mud washes away in the rain, so the tops are coated with white lime plaster and families keep patching their walls with fresh mud. The lower floors have no windows and were used for grain and animals, while the family lived in the upper floors. It is a UNESCO World Heritage site, listed in 1982."
