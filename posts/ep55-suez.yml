  title: "قناة السويس: سفينة تمشي وسط الصحرا 🚢"
  text: |
    سفينة أطول من برج إيفل، تمشي وسط الصحرا! 🚢
    قناة موية حلوة من النيل عشان العمال يشربون، وكراكات بخار تزحلق الرمل على الضفة، وسفن تمشي قوافل وتتلاقى في البحيرات المرة، وولا هويس واحد لأن البحرين بنفس المستوى تقريبًا.
    وش أكثر شي يقهرك: اللي يصف ورا سيارتك ولا اللي يقفل جواله؟ 👇
  next: "درج كهربائي ⬆️"
  seo: "كيف انحفرت قناة السويس: انحفرت في مصر من سنة ألف وثمانمية وتسعة وخمسين لين سنة ألف وثمانمية وتسعة وستين، وتوصل البحر المتوسط بالبحر الأحمر، وقبلها كانت السفن اللي من أوروبا تلف حول أفريقيا كلها: من لندن للهند صار الطريق أقصر بحوالي تسعة آلاف كيلو. طولها حوالي مية وثلاثة وتسعين كيلو. الصحرا ما فيها موية للعمال، فانحفرت قبلها قناة موية حلوة من النيل، ومخيم العمال عند بحيرة التمساح صار مدينة الإسماعيلية. أول شي كان الحفر بالإيد والرمل ينشال بالزنابيل، وبعدين كراكات تشتغل على البخار سوت أغلب الحفر وزحلقت الرمل على الضفة. القناة أغلبها مسار واحد، فالسفن تمشي قوافل وتتلاقى في البحيرة المرة الكبرى، وكانت وادي ملح ناشف وتعبّت موية لما انفتحت القناة. وما فيها ولا هويس لأن البحر المتوسط والبحر الأحمر تقريبًا بنفس المستوى. وانفتحت في سبعطعش نوفمبر ألف وثمانمية وتسعة وستين. وفي مارس ألفين وواحد وعشرين سفينة طولها أربعمية متر وقفت بالعرض وسكّرت القناة ستة أيام."
