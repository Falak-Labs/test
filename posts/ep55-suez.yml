  title: "Suez Canal: A Ship Sailing Through the Desert 🚢"
  text: |
    A ship longer than the Eiffel Tower, sailing straight through the desert. 🚢
    A fresh water canal from the Nile so the diggers could drink, steam dredgers pouring the sand onto the banks down long slides, convoys that pass each other in the Bitter Lakes, and not a single lock: the two seas sit almost level.
    Team giant ship or team tiny digger? 👇
  next: "an escalator ⬆️"
  seo: "How the Suez Canal was built: dug between 1859 and 1869 across the Isthmus of Suez in Egypt, it joins the Mediterranean to the Red Sea, so ships from Europe no longer have to sail all the way around Africa: from London to India the trip is almost 9,000 km shorter. It is about 193 km long and about 24 m deep. The desert had no drinking water for the thousands of workers, so a fresh water canal was first dug from the Nile, and the workers' camp at Lake Timsah grew into the city of Ismailia. At first the sand was dug by hand and carried up the banks in baskets; later, steam dredgers with bucket chains and long chutes did most of the digging. The canal is mostly one lane, so ships travel in convoys and pass each other in the Great Bitter Lake, a dry salt valley that filled with seawater when the canal was flooded. There are no locks: the Mediterranean and the Red Sea are almost at the same level. It opened on 17 November 1869. In March 2021 the 400 m container ship Ever Given got stuck sideways and blocked it for six days."
