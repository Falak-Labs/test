  title: "How Japan's Bullet Train Goes 320 km/h 🚄"
  text: |
    Why does Japan's bullet train have a bird's beak for a nose? 🚄
    Motors under almost every car, its own track with wide tilted curves, a long kingfisher nose that stops the tunnel boom, and sensors that cut the power before an earthquake's big shake arrives.
    Would you make it on time? 👇
  next: "a humanoid robot 🤖"
  seo: "How the Shinkansen works: motors spread along the train instead of one heavy locomotive, its own standard-gauge track with banked curves and no level crossings, the 500 Series nose shaped after the kingfisher's beak to stop the tunnel boom (Eiji Nakatsu), earthquake sensors that feel the first P-wave and cut the power, 320 km/h, 16 cars, a 24-second average delay, the 7-minute cleaning crew."
