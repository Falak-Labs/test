  title: "إزاي القطر الطلقة في اليابان بيجري تلتمية وعشرين كيلو؟ 🚄"
  text: |
    ليه بوز القطر الطلقة شبه منقار الطير؟ 🚄
    موتورات تحت كل عربية تقريبًا، وسكة لوحده بملفات واسعة مايلة لجوه ومن غير مزلقانات، وبوز طويل زي منقار الرفراف عشان آخر النفق ما يضربش زي المدفع، وحساسات بتقطع الكهربا قبل ما الهزة الكبيرة توصل.
    كنت هتلحقه ولا هيمشي من غيرك؟ 👇
  next: "روبوت شبه البني آدم 🤖"
  seo: "القطر الطلقة الياباني من جوه: موتورات متوزعة تحت العربيات بدل جرار واحد تقيل، سكة لوحده بملفات واسعة مايلة ومن غير مزلقانات، البوز اللي اتعمل زي منقار طير الرفراف عشان يمنع ضربة النفق، حساسات الزلازل اللي بتحس بأول رعشة وتقطع الكهربا، تلتمية وعشرين كيلو في الساعة، ستاشر عربية، ومتوسط تأخير أربعة وعشرين ثانية."
