  title: "Refrigerator: It Doesn't Make Cold, It Moves Heat 🧊"
  text: |
    Your fridge doesn't make cold. It carries the heat out of the box and dumps it in your kitchen. 🧊
    A liquid that boils far below freezing soaks up the heat inside, a compressor squeezes the gas until it's hot, the coils on the back throw that heat out, and a tube as thin as spaghetti drops the pressure so it comes out icy cold again.
    How long do you stand at the open fridge? 👇
  next: "the Eiffel Tower 🗼"
  seo: "How a refrigerator works: before fridges, cold meant ice, sawn from frozen lakes in winter, packed in sawdust and shipped as far as India in the 1800s. A fridge makes cold with a refrigerant, a liquid that boils far below freezing. In the evaporator coils inside the fridge it boils and soaks up the heat of the food, like sweat cooling your skin. The compressor at the bottom squeezes the gas, and squeezed gas gets hot, like a bike pump. The hot gas runs through the condenser coils on the back, where the heat escapes into the kitchen and the gas turns back into a liquid. The liquid, still under high pressure, is pushed through a capillary tube about as thin as spaghetti; its pressure drops, it turns icy cold and the loop starts again. A thermostat switches the compressor on and off, and a magnetic strip in the rubber door seal keeps the door shut. Fridges run at about 4 °C and freezers at about -18 °C. Albert Einstein and Leo Szilard patented a refrigerator design in 1930."
