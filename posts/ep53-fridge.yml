  title: "الثلاجة: ما تسوي برد، تطلّع الحرارة 🧊"
  text: |
    الثلاجة ما تسوي برد، هي تطلّع الحرارة من الصندوق وترميها في مطبخك! 🧊
    سائل يغلي تحت الصفر بكثير يسحب الحرارة من داخل، والكمبروسر يعصر الغاز لين يسخن، واللفّات اللي ورا تطلّع الحرارة، وماسورة رفيعة مثل المكرونة تنزّل الضغط ويرجع بارد مرة.
    كم تطوّل وأنت فاتح الثلاجة؟ 👇
  next: "برج إيفل 🗼"
  seo: "كيف الثلاجة تشتغل: زمان البرد يعني ثلج، يقصّونه من بحيرات متجمدة في الشتا ويغطونه بنشارة خشب ويشحنونه لين الهند. الثلاجة تسوي البرد بسائل يغلي تحت الصفر بكثير. في اللفّات اللي داخل الثلاجة يغلي ويسحب حرارة الأكل، مثل العرق يبرّد جلدك. والكمبروسر تحت يعصر الغاز، والغاز إذا انعصر يسخن مثل منفاخ السيكل. والغاز الحار يمشي في اللفّات اللي ورا الثلاجة، والحرارة تطلع للمطبخ، ويرجع سائل. وهذا السائل للحين تحت ضغط قوي، فيدخل ماسورة رفيعة مثل المكرونة، ضغطه ينزل ويبرد مرة، وترجع اللفة من أول. والثرموستات يشغّل الكمبروسر ويطفيه، وفي مطاط الباب مغناطيس يسكّره. الثلاجة حوالي أربع درجات، والفريزر سالب ثمنطعش، وأينشتاين سجّل اختراع ثلاجة."
