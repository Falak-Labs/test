  title: "How a Desert Wind Tower Cools a House With No Power 🌬️"
  text: |
    10 degrees cooler inside, in the desert, with no AC and not one watt of power. 🌬️
    A tall tower catches the breeze above the street, walls inside split the shaft so one side brings air in while the others pull hot air out, on still days the sun turns it into a chimney, and wet cloths or water cool the air on its way in.
    Would you live under one? 👇
  next: "Petra, a city carved into a cliff 🏜️"
  seo: "How a windcatcher (barjeel in the Gulf, malqaf in Egypt, badgir in Iran) cools a house without electricity: the tower rises about 5 m above the roof into cleaner, faster wind; its open windward side catches the breeze and pushes it down into the room, while suction on the lee side pulls warm air out; towers open on four sides have walls inside so they work whichever way the wind blows; on still days the sun-heated tower works like a chimney (the stack effect); wet cloths in the openings, a pool or a qanat cool the air by evaporation, up to about 10 °C. Old Dubai (Al Fahidi / Al Bastakiya) is full of them; Yazd in Iran has about 700, and the one at Dowlatabad Garden is about 33 m tall. Ancient Egyptian paintings show windcatchers on houses more than 3,000 years ago."
