  title: "إزاي البيت يبرد من غير تكييف؟ 🌬️"
  text: |
    بيت في الصحرا أبرد عشر درجات، من غير تكييف ولا نقطة كهربا! 🌬️
    برج عالي بيلقف النسمة، ومقسوم من جوة عشان جهة تدخّل الهوا والباقي يشفط الحر، ولو مفيش هوا الشمس تخليه زي المدخنة، والقماش المبلول والمية بيبرّدوا الهوا.
    تفتكر ينفع نرجّعه في بيوتنا؟ 👇
  next: "البترا، مدينة محفورة في الجبل 🏜️"
  seo: "إزاي الملقف أو البرجيل بيبرّد البيت من غير كهربا: البرج بيطلع حوالي خمسة متر فوق السطح لحد الهوا النضيف، والفتحة اللي في وش الهوا بتلقفه وتنزّله الأوضة، والفتحات التانية بتشفط الهوا السخن لبرة. البرج اللي مفتوح من الأربع جهات مقسوم من جوة بحيطان عشان يشتغل مهما الهوا غيّر اتجاهه، ولو مفيش هوا خالص الشمس بتسخن البرج فيشتغل زي المدخنة. القماش المبلول على الفتحات والمية تحت البرج بيبرّدوا الهوا بالتبخير، لحد عشر درجات تقريبًا. بيوت القاهرة القديمة كان فيها الملقف، ودبي القديمة مليانة براجيل، والمصريين القدام رسموه على بيوتهم من أكتر من تلات تلاف سنة."
