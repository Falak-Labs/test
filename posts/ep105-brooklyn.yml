  title: "Brooklyn Bridge: 21 Elephants and the Woman Who Finished It 🐘"
  text: |
    21 elephants once marched across this bridge… on purpose. 🐘
    Its engineer, John Roebling, died before work began, so his son Washington took over. Giant wooden boxes were sunk to the riverbed and pumped full of air so men could dig inside, but climbing out too fast gave them the bends, and Washington ended up running the job from his bed with a telescope. A crook sold them bad wire, so they added 150 extra wires to every cable. And who really finished it? His wife, Emily Warren Roebling: she learned the math, ran the job, and in 1883 rode across first with a rooster on her lap. In 1884 P.T. Barnum's 21 elephants showed everyone it was strong.
    Tag the person who really runs things in your house 👇
  next: "a metro where the trains drive themselves 🚇"
  seo: "How the Brooklyn Bridge was built (1869-1883): John A. Roebling designed it and died in 1869 before construction began; his son Washington Roebling sank timber caissons to the East River bed and filled them with compressed air so workers could dig inside. Caisson disease, the bends, struck many workers and left Washington bedridden, watching the work from his window in Brooklyn Heights; his wife Emily Warren Roebling studied engineering, carried his orders and ran the work, and was the first to cross on May 24, 1883. When contractor J. Lloyd Haigh's bad wire was found, 150 extra wires were added to each of the four main cables of 5,434 wires. In May 1884 P.T. Barnum led 21 elephants across to show it was safe."
