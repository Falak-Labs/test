  title: "جسر بروكلين: ٢١ فيل ومهندسة ما أحد يعرفها 🐘"
  text: |
    واحد وعشرين فيل مشوا على هالجسر... عن قصد! 🐘
    اللي صمّمه، جون رووبلينغ، مات قبل يبدأ الشغل، فمسكه ولده واشنطن. نزّلوا صناديق خشب عملاقة لقاع النهر وضخّوا فيها هوا عشان الرجال يحفرون داخلها، بس اللي يطلع بسرعة يجيه مرض الغواصين، وحتى واشنطن جاه وصار يدير الشغل من سريره بالدربيل. ونصّاب باع لهم سلك مغشوش، فزادوا ١٥٠ سلك على كل كيبل. ومين كمّله صدق؟ زوجته إميلي: تعلّمت الحساب وأدارت الشغل، وسنة ١٨٨٣ كانت أول وحدة تعبره وفي حضنها ديك! وسنة ١٨٨٤ مشّى عليه بارنوم ٢١ فيل عشان يثبت إنه قوي.
    منشن اللي يدير البيت صدق عندكم 👇
  next: "مترو الرياض بدون سواق 🚇"
  seo: "كيف انبنى جسر بروكلين (١٨٦٩-١٨٨٣): صممه جون رووبلينغ ومات سنة ١٨٦٩ قبل يبدأ البناء؛ ولده واشنطن نزّل صناديق خشب عملاقة لقاع النهر الشرقي وعبّاها هوا مضغوط عشان العمال يحفرون داخلها. مرض الغواصين صاب عمال كثير وخلّى واشنطن طريح الفراش يراقب الشغل من شباك بيته في بروكلين هايتس؛ وزوجته إميلي وارن رووبلينغ درست الهندسة ونقلت أوامره وأدارت الشغل، وكانت أول وحدة تعبر الجسر في ٢٤ مايو ١٨٨٣. ولما انكشف السلك المغشوش، زادوا ١٥٠ سلك على كل واحد من الكيابل الأربعة اللي فيها ٥٤٣٤ سلك. وفي مايو ١٨٨٤ مشّى بارنوم ٢١ فيل على الجسر عشان يثبت إنه آمن."
