  title: "How the World's Tallest Tower Stands on Desert Sand 🏙️"
  text: |
    How do you build an 828-meter tower on sand? 🏙️
    192 piles 50 meters deep hold it up, three wings brace a strong core like a tripod, 27 spiral setbacks confuse the wind, and the concrete was poured at night with ice and pumped a record 600 meters up.
    Would you take the stairs? 👇
  next: "a tunnel boring machine 🚇"
  seo: "Burj Khalifa engineering: piles gripped by the ground under a concrete raft in sand and weak rock, the Y-shaped buttressed core, spiral setbacks against wind vortices, night pours with ice and a record 606 m concrete pump, the 200 m spire raised from inside, 828 m, 163 floors, 57 elevators, 2,909 stairs."
