  title: "إزاي أطول برج في الدنيا واقف على الرملة؟ 🏙️"
  text: |
    إزاي تبني برج طوله تمنمية وتمانية وعشرين متر على رمل؟ 🏙️
    مية واتنين وتسعين عمود خمسين متر تحت الأرض شايلينه، وتلات جناحات ساندين قلب جامد زي حامل الكاميرا، وسبعة وعشرين دخلة على شكل حلزونة بتلخبط الهوا، والخرسانة اتصبت بالليل بالتلج واتضخت ستمية متر لفوق.
    هتطلع على السلم ولا إيه؟ 👇
  next: "مكنة حفر الأنفاق 🚇"
  seo: "برج خليفة من جوه: أعمدة الأساس في الرمل، القلب الخرساني والتلات جناحات، الدخلات الحلزونية ضد دوامات الهوا، صب الخرسانة بالليل بالتلج وضخها لارتفاع قياسي، السارية اللي اتزقت من جوه، تمنمية وتمانية وعشرين متر ومية تلاتة وستين دور وسبعة وخمسين أسانسير."
