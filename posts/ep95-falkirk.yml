  title: "Falkirk Wheel: A Ferris Wheel for Boats 🎡"
  text: |
    Scotland built a Ferris wheel… for boats. 🎡
    Two tubs of water balance on one wheel: a floating boat pushes out its own weight in water, so both sides always weigh the same. Giant gears keep the tubs level, about 15,000 bolts hold it together, and a half turn lifts boats 24 m on about the power of boiling eight kettles.
    Would you ride it? 👇
  next: "a hand warmer that starts with one click 🧤"
  seo: "How the Falkirk Wheel works: the world's only rotating boat lift (Falkirk, Scotland, opened 2002) lifts boats 24 m between the Forth and Clyde Canal and the Union Canal. Its two water-filled gondolas balance because a floating boat displaces its own weight of water, so little power is needed: about 1.5 kWh per half turn, roughly boiling eight kettles. Gears keep the gondolas level as the arms turn, it is bolted rather than welded, and it replaced a flight of 11 locks that took nearly a day. Boats then pass through a tunnel under the Roman Antonine Wall and two locks to the Union Canal."
