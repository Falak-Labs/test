    اسكتلندا سوت عجلة ملاهي... للقوارب! 🎡
    حوضين موية يتوازنون على عجلة وحدة: القارب اللي يطفو يطرد من الموية قد وزنه، فالجهتين دايم نفس الوزن. تروس ضخمة تخلي الحوض مستوي، وحوالي ١٥ ألف برغي ماسكينها، ونص لفة ترفع القوارب ٢٤ متر بكهربا قد غلي ثمان غلايات.
