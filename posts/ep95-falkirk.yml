  next: "دفاية يد تشتغل بضغطة وحدة 🧤"
  seo: "كيف تشتغل عجلة فالكيرك: الرافعة الدوارة الوحيدة للقوارب في العالم (فالكيرك، اسكتلندا، افتتحت سنة ٢٠٠٢) ترفع القوارب ٢٤ متر بين قناتين. الحوضين المليانين موية يتوازنون لأن القارب اللي يطفو يطرد من الموية قد وزنه، فتحتاج كهربا قليلة: حوالي ١٫٥ كيلوواط ساعة لنص اللفة، تقريباً مثل غلي ثمان غلايات. التروس تخلي الأحواض مستوية، والعجلة مركبة بالبراغي بدل اللحام، وكانت بدالها إحدى عشر بوابة تاخذ يوم كامل تقريباً."
