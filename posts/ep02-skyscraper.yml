    How do skyscrapers survive wind, earthquakes and fire? 🏙️
    Stack 100 apartments, then fix it 4 times: sky lobbies, a giant swinging steel ball, a frame that bends, and smoke-proof stairs.
    Would you live on floor 99? 👇
