  title: "Panama Canal Locks: How a Ship Climbs a Mountain on Water 🚢"
  text: |
    A cargo ship climbs 26 meters into the jungle hills, and the only power for the lift is rain. 🚢
    A dam turns a river into a giant lake up in the hills, concrete water steps fill from the lake through the floor with no pumps, hollow gates half float so small motors can swing them, and electric "mules" keep the ship dead center with half a meter to spare.
    Would you swim it for 36 cents? 👇
  next: "the Dutch storm barrier 🌊"
  seo: "How the Panama Canal locks work: ships are lifted about 26 m (85 ft) from the sea to Gatun Lake, a reservoir made by damming the Chagres River, the largest man-made lake in the world when it was finished in 1913. Each lock chamber fills by gravity with no pumps: water from the lake runs through giant culverts in the walls and up through openings in the floor, and a chamber can fill in about ten minutes. Ships climb three steps at Gatun on the Atlantic side and go down three on the Pacific side (Pedro Miguel and Miraflores). The original lock gates are hollow and buoyant; the heaviest leaf weighs about 662 tonnes, yet two 25-horsepower motors swing it. Panamax ships fit with about 60 cm to spare on each side, so electric locomotives called mules keep them centred on steel cables. Each transit sends about 197 million litres (52 million gallons) of fresh water to the sea; the 2016 locks reuse 60% of theirs in water-saving basins. Over a million ships have crossed since 1914. In 1928 the writer Richard Halliburton swam the canal and paid the lowest toll ever, 36 cents, set by his weight."
