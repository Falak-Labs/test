  title: "هويس قناة بنما: إزاي المركب يطلع الجبل؟ 🚢"
  text: |
    مركب بضاعة بيطلع ستة وعشرين متر لفوق في الجبل، واللي بيرفعه مية المطر بس! 🚢
    سد عمل بحيرة عالية في الجبل، وسلالم مية بتتملي من الأرضية من غير ولا طلمبة، وبوابات مجوفة نص عايمة، وقاطرات اسمها البغال ماسكة المركب في النص بالظبط.
    تعدّيها عوم بستة وتلاتين سنت؟ 👇
  next: "حاجز العواصف الهولندي 🌊"
  seo: "إزاي هويس قناة بنما بيشتغل: المراكب بتطلع حوالي ستة وعشرين متر من البحر لبحيرة جاتون، وهي بحيرة اتعملت بسد على نهر تشاجريس، وكانت أكبر بحيرة صناعية في العالم لما خلصت سنة ألف تسعمية تلاتاشر. كل حوض في الهويس بيتملي بالجاذبية من غير ولا طلمبة: مية البحيرة بتنزل في أنفاق عملاقة جوة الحيطان وتطلع من فتحات في الأرضية، والحوض ممكن يتملي في حوالي عشر دقايق. المركب بيطلع تلات درجات في جاتون من ناحية المحيط الأطلسي، وبينزل تلاتة من ناحية المحيط الهادي. البوابات القديمة مجوفة ونص عايمة، وأتقل ضلفة فيها وزنها حوالي ستمية اتنين وستين طن، ومع كده موتورين صغيرين بيفتحوها. المراكب الكبيرة بتدخل الحوض بالعافية، نص متر من كل ناحية، فقاطرات كهربا اسمها البغال بتمسكها بحبال حديد في النص. كل مركب بيعدي بياخد حوالي ميتين مليون لتر مية حلوة بتنزل البحر، وأكتر من مليون مركب عدّوا من سنة ألف تسعمية أربعتاشر. وسنة تمانية وعشرين واحد عدّى القناة عوم، ودفع أرخص رسوم في تاريخها: ستة وتلاتين سنت على حسب وزنه. وعلى عكس قناة بنما، قناة السويس مستوية ومفيهاش هويس."
