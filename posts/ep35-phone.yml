  title: "How Your Smartphone Knows Where You Are 📱"
  text: |
    A million times the memory of the computer that flew to the Moon, and we use it for cat videos. 📱
    A grid of invisible wires under the glass feels your finger, a speck of silicon on springs knows which way is up, satellites 20,000 km away find you on the map (with Einstein's help), and the camera merges 15 photos into one in the dark.
    How many hours a day are you on yours? 👇
  next: "Egypt's Great Pyramid 🏜️"
  seo: "How a smartphone works: the first mobile phone (Martin Cooper, Motorola, 1973) weighed about 1.1 kg, took 10 hours to charge and gave 35 minutes of talk; today one chip the size of a fingernail holds about 19 billion transistors (Apple A17 Pro); a capacitive touchscreen is a grid of transparent wires under the glass and your finger draws a little charge where it touches, which is why gloves don't work; a MEMS accelerometer smaller than a grain of rice holds a silicon weight on springs that moves when you tilt the phone; GPS satellites orbit about 20,200 km up and their clocks are corrected for Einstein's relativity, or positions would drift about 10 km a day; night mode merges up to 15 frames into one photo. The Apollo Guidance Computer had about 4 KB of memory."
