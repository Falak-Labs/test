  title: "إزاي الموبايل بيعرف انت فين؟ 📱"
  text: |
    في جيبك ذاكرة أكتر مليون مرة من كمبيوتر رحلة القمر، وبنتفرج بيه على قطط! 📱
    شبكة سلوك مش باينة تحت الإزاز بتحس بصباعك، حتة سيليكون على يايات بتعرف انت ماسكه إزاي، أقمار صناعية فوق بعشرين ألف كيلو بتعرف انت فين، والكاميرا بتجمع خمستاشر صورة في واحدة في الضلمة.
    بتقعد على الموبايل كام ساعة في اليوم؟ 👇
  next: "الهرم الأكبر 🏜️"
  seo: "إزاي الموبايل بيشتغل: أول موبايل في التاريخ سنة ألف تسعمية تلاتة وسبعين كان أتقل من كيلو ويتشحن عشر ساعات ويكلم نص ساعة وشوية، ودلوقتي شريحة قد الضفر فيها تسعتاشر مليار ترانزستور. الشاشة اللمس فيها شبكة سلوك شفافة تحت الإزاز وصباعك بيسحب شوية كهربا مكان اللمسة، وعشان كده الجوانتي مش بيشتغل. فيه حساس أصغر من حباية الرز جواه حتة سيليكون على يايات بتتحرك لما تميّل الموبايل. أقمار الجي بي إس على بعد حوالي عشرين ألف كيلو وساعاتها متظبطة بنسبية أينشتاين، وإلا مكانك على الخريطة يتوه حوالي عشرة كيلو في اليوم، والكاميرا بالليل بتجمع لحد خمستاشر صورة في صورة واحدة."
