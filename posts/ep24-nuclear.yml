  text: |
    إزاي ذرة صغيرة تنور مدينة كاملة؟ ⚛️
    ذرات اليورانيوم بتنقسم وتسخن المية، وقضبان التحكم بتشفط النيوترونات عشان تظبط القوة، ودايرتين مية بيخلوا المية المشعة مقفول عليها جوه، وكله جوه قبة خرسانة سمكها أكتر من متر.
    مخيفة ولا عبقرية؟ 👇
