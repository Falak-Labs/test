  title: "How a Nuclear Power Plant Boils Water With Atoms ⚛️"
  text: |
    How do you make electricity with atoms? ⚛️
    Uranium atoms split and heat water, control rods soak up the neutrons to set the power, two separate water loops keep the radioactive water sealed inside, and a concrete dome over a meter thick wraps it all.
    Scary or genius? 👇
