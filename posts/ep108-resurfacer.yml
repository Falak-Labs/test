  title: "مكينة تنعيم الثلج: ليش يسبّحون الثلج بموية حارة؟ ⛸️"
  text: |
    ثلج حلبات التزلج يتسبّح... بموية حارة! ⛸️
    أحذية التزلج تخدّش الثلج كله، فتطلع مكينة تلف الحلبة: شفرة طويلة تقشّر وجهه أرق من الريال المعدني، وبريمة ترفع القشر لخزان فوق، ورشاشات تغسل الخدوش وشفاط يسحب الموية الوسخة، وفي الآخر فوطة ورا تفرد موية حارة تتجمد مثل الزجاج. ليش حارة؟ لأنها تذوّب وجه الثلج القديم شوي، فالطبقة الجديدة تلزق فيه. وأول مكينة سوّاها صاحب حلبة في كاليفورنيا اسمه فرانك زامبوني سنة ١٩٤٩: ربع ساعة بدل ساعة ونص شغل باليد.
    منشن أمك اللي تقول: لا تشرب بارد وأنت حرّان 👇
  next: "عمارة تتنفّس مثل بيت النمل الأبيض 🐜"
  seo: "كيف تشتغل مكينة تنعيم الثلج: اخترعها فرانك زامبوني سنة ١٩٤٩ في كاليفورنيا في حلبته، وكان تنظيف الثلج قبلها ياخذ ثلاث أو أربع عمال حوالي ساعة ونص كشط وغسيل ومساحات؛ وأول مكينة سواها على شاصي جيب وسجّل براءتها سنة ١٩٥٣، وصارت تخلّص الحلبة في ربع ساعة تقريباً. شفرة حادة تقشّر طبقة رقيقة من الثلج، وبريمة أفقية تجمع القشر وبريمة عمودية ترفعه لخزان الثلج، وموية غسيل تطلّع الوسخ من الخدوش ويسحبها شفاط، وفي الآخر موية دافية حوالي ٦٠ درجة تفردها فوطة ورا المكينة فتذوّب وجه الثلج شوي وتلزق الطبقة الجديدة وتتجمد ناعمة."
