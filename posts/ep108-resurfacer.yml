  title: "Ice Resurfacer: Why the Rink Gets a Hot Water Bath ⛸️"
  text: |
    Every hockey rink gives its ice… a hot water bath. ⛸️
    Skates carve the ice full of grooves, so between periods a resurfacer drives an oval: a long blade shaves off a sliver thinner than a coin, a spinning screw lifts the snow into a tank, jets wash the grooves while a vacuum slurps the dirty water back up, and a towel at the back spreads hot water that freezes like glass. Why hot? It melts the top of the old ice a little, so the new layer sticks right to it. The first one was built in sunny California in 1949 by a rink owner, Frank Zamboni: about 15 minutes instead of 90 by hand.
    Would you drive one? 👇
  next: "an office that breathes like a termite mound 🐜"
  seo: "How an ice resurfacer works: Frank Zamboni invented it in 1949 in Paramount, California, at his own rink, where three or four workers had spent about 90 minutes scraping, washing and squeegeeing the ice; his first machine, built on a Jeep chassis and patented in 1953, gave a clean sheet in about 15 minutes. A sharp blade shaves a thin layer off the top; a horizontal auger collects the shavings and a vertical auger lifts them into the snow tank; wash water flushes dirt from the grooves and a squeegee and vacuum pick it up; and warm water, about 140 degrees Fahrenheit (60 C), spread by a towel at the back slightly melts the surface so the new layer bonds and freezes smooth."
