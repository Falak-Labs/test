  title: "برج تايبيه 101: كورة ذهبية تثبّت ناطحة سحاب 🇹🇼"
  text: |
    كورة حديد ذهبية بوزن خمسمية سيارة تتمرجح داخل راس برج تايبيه! 🇹🇼
    تايبيه تجيها أعاصير كل سنة وزلازل بعد، فبنوا البرج مثل الخيزران: ثمان قطع، كل قطعة ثمان أدوار، حول أعمدة حديد مليانة خرسانة. وقريب من فوق كورة ستمية وستين طن معلّقة بحبال غليظة مضبوطة على إيقاع البرج: إذا مال البرج يمين، الكورة تروح يسار، وتحتها ثمان مكابس تحوّل المرجحة لحرارة. وفي ألفين وخمسطعش إعصار مرجحها متر كامل، أكبر مرجحة في تاريخها.
    تطلع فوق وقت الإعصار؟ 👇
  next: "غسالة الصحون 🍽️"
  seo: "كيف برج تايبيه مية وواحد يظل ثابت: البرج طوله خمسمية وثمانية متر وفيه مية وواحد دور، وكان أطول مبنى في العالم من ألفين وأربعة لين ألفين وعشرة. تايوان تجيها أعاصير كل سنة تقريبا وزلازل كثيرة، والبرج الطويل المرن يتمايل مع الريح القوية، واللي في الأدوار العالية ممكن يدوخون. شكله مثل الخيزران، ثمان قطع كل قطعة ثمان أدوار، والثمانية رقم حظ في الثقافة الصينية، وهيكله فيه أعمدة حديد ضخمة مليانة خرسانة قوية. وبين الدور السابع والثمانين والدور الثاني والتسعين معلّقة كورة حديد عرضها خمسة متر ونص، مصنوعة من واحد وأربعين لوح حديد، ووزنها حوالي ستمية وستين طن، وهي أكبر كورة من نوعها في العالم يقدر الناس يشوفونها. معلّقة بحبال حديد طولها مضبوط على إيقاع تمايل البرج نفسه، فإذا مال البرج جهة، الكورة الثقيلة تسحب الجهة الثانية، وتحتها ثمان مكابس هيدروليك مثل المساعدات تحوّل الحركة لحرارة. وتقلل التمايل لين حوالي أربعين بالمية. وفي إعصار سوديلور في أغسطس ألفين وخمسطعش تمرجحت الكورة حوالي متر، أكبر حركة سجلوها لها، والزوار يشوفونها من الدور اللي فوق، ويطلعون له بواحد من أسرع المصاعد في العالم."
