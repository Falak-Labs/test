  title: "Taipei 101: The Giant Ball That Steadies a Skyscraper 🇹🇼"
  text: |
    A golden steel ball as heavy as 500 cars swings inside the top of Taipei 101. 🇹🇼
    Taipei gets typhoons almost every year and earthquakes too, so the tower was built like bamboo, eight sections of eight floors around steel columns filled with concrete. Near the top a 660-ton ball hangs on thick cables tuned to the tower's own rhythm: when the tower leans one way, the ball swings the other, and eight pistons under it turn the swing into heat. In 2015 a typhoon swung it a full meter, its biggest swing ever.
    Would you go up in a typhoon? 👇
  next: "a dishwasher 🍽️"
  seo: "How Taipei 101 stays steady: Taipei 101, 508 m tall with 101 floors, was the world's tallest building from 2004 to 2010. Taiwan gets typhoons almost every year and many earthquakes, and a tower that tall and flexible sways in strong wind, which can make people on the top floors feel sick. Its shape echoes bamboo, with eight sections of eight floors (eight is a lucky number in Chinese culture), and its frame uses huge steel columns filled with high-strength concrete. Between the 87th and 92nd floors hangs a tuned mass damper: a steel sphere 5.5 m across, built from 41 steel plates and weighing about 660 tonnes, the largest damper sphere in the world on public view. It hangs on steel cables whose length tunes its swing to the building's own sway, so when the tower leans one way the heavy ball pulls the other way, and eight hydraulic pistons under it act like shock absorbers, turning the motion into heat. It can cut the sway by up to about 40%. During Typhoon Soudelor in August 2015 the ball swung about 1 m, its largest movement on record, and visitors can watch it from the observatory, reached by one of the world's fastest elevators."
