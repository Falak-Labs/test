  title: "Instant Noodles: Full of Tiny Holes on Purpose 🍜"
  text: |
    Instant noodles are full of tiny holes… on purpose. 🍜
    Fresh noodles go bad in days, so you dry them, but dry noodles cook slow. In 1958, after a year of tinkering in a backyard shed, Momofuku Ando fried them like tempura: the hot oil blasts the water out and leaves tiny holes, and hot water soaks right back in. In 1971 he put them in a cup, the block wedged in the middle so it won't crack on the road and hot water can get underneath.
    Be honest: ever waited the full three minutes? 👇
  next: "Build #100, the Jeddah Tower 🏙️"
  seo: "How instant noodles work: Momofuku Ando invented them in 1958 (Chicken Ramen) after a year of experiments in a shed behind his house. Frying the noodles in hot oil boils the water out and leaves tiny holes, so they keep for months and hot water rehydrates them in minutes. Cup Noodles (1971) holds the noodle block in the middle of the cup so it does not break in transport and hot water can flow underneath. About 124 billion servings of instant noodles were eaten worldwide in 2025."
