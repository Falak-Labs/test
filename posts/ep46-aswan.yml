  title: "السد العالي: صخر قد سبعتاشر هرم في عرض النيل 🌊"
  text: |
    صخر قد سبعتاشر هرم متكوّم في عرض النيل! 🌊
    جبل صخر ورمل تخنه من تحت قرب الكيلو، وقلب طين وستارة أسمنت في قاع النهر عشان المية متعديش، وقناة اتفتحت في الجرانيت لفّ منها النيل لحد ما السد اتبنى. والبحيرة اللي وراه طولها حوالي خمسمية كيلو.
    كنت هتعرف تنقل معبد أبو سمبل؟ 👇
  next: "بيت من التلج ❄️"
  seo: "إزاي السد العالي في أسوان بيشتغل: اتبنى من سنة ألف وتسعمية وستين لسنة ألف وتسعمية وسبعين في عرض النيل، وهو سد ركامي من صخر ورمل، ارتفاعه حوالي مية وحداشر متر، وطوله تلاتة كيلو وتمنمية متر، وعرضه من تحت قرب الكيلو، وفيه حوالي تلاتة وأربعين مليون متر مكعب، يعني حوالي سبعتاشر مرة قد الهرم الأكبر. مش حيطة خرسانة، ده جبل بيحجز المية بتقله، وفي قلبه طين، وتحته ستارة أسمنت محقونة في قاع النهر عشان المية متنشّش من تحت. وعشان يتبني، اتفتحت قناة في الجرانيت على الضفة الشرقية والنيل لف منها. قبل السد كان الفيضان بييجي مرة في السنة: سنة يغرّق القرى وسنة ميجيش. دلوقتي الفيضان بيستنى في بحيرة ناصر اللي طولها حوالي خمسمية كيلو، وبينزل بالراحة طول السنة، وفيه اتناشر توربينة، ولما اشتغل كان بيطلّع حوالي نص كهربا مصر. ولما البحيرة طلعت، معابد أبو سمبل اتقطعت لأكتر من ألف حتة واتبنت تاني أعلى بخمسة وستين متر."
