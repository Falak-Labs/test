  title: "Aswan High Dam: 17 Pyramids of Rock Across the Nile 🌊"
  text: |
    Seventeen Great Pyramids' worth of rock, piled across the Nile. 🌊
    A hill of rock and sand almost a kilometer thick at the bottom, a clay core and a cement curtain deep in the riverbed to stop the seepage, and a channel blasted through the granite to carry the Nile around while it was built. The lake behind it is about 500 km long.
    Would you have moved Abu Simbel? 👇
  next: "an igloo ❄️"
  seo: "How Egypt's Aswan High Dam works: built 1960-1970 across the Nile at Aswan, it is an embankment dam of rock and sand about 111 m high, 3.8 km long and about 980 m wide at the base, roughly 43 million cubic meters of material, about 17 times the volume of the Great Pyramid of Giza. Instead of a concrete wall it uses its weight to hold back the water, with a clay core and a grout curtain injected deep into the riverbed to stop seepage. The Nile was diverted through a channel cut into the granite on the east bank while the dam was built. Before the dam, the Nile flood came once a year: some years it drowned villages, other years it barely came. Now the flood is stored in Lake Nasser, about 500 km long, and released steadily all year, and 12 turbines generate up to 2,100 MW; when it first reached full output it produced about half of Egypt's electricity. The rising lake would have drowned the temples of Abu Simbel, so in 1964-1968 they were cut into more than a thousand blocks and rebuilt 65 m higher."
