  title: "Al Bahar Towers: Umbrellas That Follow the Sun ☀️"
  text: |
    These towers in Abu Dhabi open umbrellas when the sun hits them. ☀️
    Desert sun turns glass offices into ovens, and dark tinted glass makes them gloomy. So the architects borrowed the mashrabiya, the old Arab wooden screen, and made it move: about 2,000 umbrella-like shades, each with its own motor, unfold where the sun shines and fold where it doesn't, steered by a computer that tracks the sun. In a storm, sensors on the roof fold them halfway. They keep out about half the sun's heat, so the glass can stay clear.
    Who else fights their car's sun shade every summer? 👇
  next: "bubble wrap (it started as wallpaper) 🫧"
  seo: "How Abu Dhabi's Al Bahar Towers keep cool: two 25-storey towers (Aedas, 2012) wrapped in a computer-controlled mashrabiya of 2,098 umbrella-like shading units, 1,049 per tower. Each unit is a frame of PTFE fabric panels opened and closed by a motor; sun-tracking software unfolds the units in direct sun and folds the ones in shade, and wind sensors on the roof fold them halfway in a storm. The screen cuts the heat gained from sunlight by about half, so the glass can stay clear instead of dark tinted. It won a CTBUH 2012 Tall Building Innovation Award."
