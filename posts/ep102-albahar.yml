  title: "أبراج البحر: مظلات تلحق الشمس ☀️"
  text: |
    أبراج في أبوظبي تفتح مظلاتها إذا جتها الشمس! ☀️
    شمس الصحرا تخلي مكاتب الزجاج أفران، والزجاج الغامق يخلي المكتب كئيب. فأخذوا فكرة المشربية، الشباك الخشب العربي القديم، وخلوها تتحرك: حوالي ألفين مظلة، كل وحدة فيها موتور، تنفتح وين ما تجي الشمس وتتسكر في الظل، وكمبيوتر يلحق الشمس طول اليوم. وإذا جا العجاج، حساسات فوق السطح تسكرها لنصها. وتوقف تقريباً نص حر الشمس، فالزجاج يظل شفاف.
    مين بعد يتهاوش مع مظلة السيارة كل صيف؟ 👇
  next: "نايلون الفقاعات 🫧"
  seo: "كيف تبرد أبراج البحر في أبوظبي: برجين كل واحد ٢٥ دور (تصميم إيداس، ٢٠١٢) ملفوفين بمشربية يتحكم فيها الكمبيوتر، فيها ٢٠٩٨ مظلة، ١٠٤٩ لكل برج. كل مظلة ألواح قماش تفلون على إطار يفتحه ويسكره موتور؛ برنامج يتبع الشمس يفتح المظلات اللي عليها شمس ويسكر اللي في الظل، وحساسات الهوا فوق السطح تسكرها لنصها وقت العاصفة. المشربية تقلل حرارة الشمس الداخلة تقريباً للنص، فالزجاج يقدر يظل شفاف بدل الغامق."
