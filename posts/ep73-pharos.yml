  title: "Lighthouse of Alexandria: A Fire on a 100 m Tower 🔥"
  text: |
    A bonfire on top of a 100 m stone tower, seen far out at sea. 🔥
    The Lighthouse of Alexandria stood on the island of Pharos at the harbor mouth, as tall as a 30-floor building. A fire burned on top all night, a polished bronze mirror threw its light out over the waves, and a ramp inside let animals haul the wood up. Sailors said they saw it about 50 km out, until earthquakes threw it into the harbor. Last year, 22 of its giant stones were lifted from the sea.
    Would you climb to the top? 👇
  next: "a concert hall that vanishes in the desert 🪞"
  seo: "How the Lighthouse of Alexandria worked: the Pharos of Alexandria was built about 2,300 years ago under the Ptolemies on the island of Pharos, at the mouth of Alexandria's harbour in Egypt, to guide ships past the reefs of a low, flat coast. One of the Seven Wonders of the Ancient World, it was probably at least 100 m tall, built in three tiers: a square base, an eight-sided middle and a round top. A fire burned at the summit at night and, according to ancient and medieval accounts, a large polished metal mirror threw its light out to sea, while a ramp inside the tower let pack animals carry the fuel up. Ancient writers said its light could be seen about 300 stadia, roughly 50 km, away. Damaged by earthquakes, it collapsed in the 14th century, and in 1477 Sultan Qaitbay built his citadel on the site with some of its stones. Divers found its blocks on the floor of Alexandria's Eastern Harbour in 1994, and in 2025 archaeologists lifted 22 huge blocks out of the sea to help rebuild it digitally. Its name became the word for lighthouse in several languages: phare in French, faro in Italian and Spanish."
