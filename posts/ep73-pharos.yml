  title: "منارة الإسكندرية: نار فوق برج مية متر 🔥"
  text: |
    نار شابة فوق برج حجر طوله مية متر، تشوفها السفن من بعيد! 🔥
    منارة الإسكندرية كانت على جزيرة فاروس عند مدخل الميناء، طولها مثل عمارة ثلاثين دور. فوقها نار تولّع طول الليل، ومراية برونز ترمي نورها فوق الموج، وطريق يلف داخلها عشان الحيوانات تطلّع الحطب لفوق. البحارة كانوا يشوفونها من خمسين كيلو، لين ما طيّحتها الزلازل في البحر، والسنة اللي فاتت طلّعوا اثنين وعشرين حجر منها من قاع البحر.
    تتخيل تطلع لين فوقها؟ 👇
  next: "مبنى يختفي في الصحرا 🪞"
  seo: "كيف كانت تشتغل منارة الإسكندرية: منارة الإسكندرية، أو فاروس، انبنت قبل تقريبا ألفين وثلاثمية سنة أيام البطالمة على جزيرة فاروس عند مدخل ميناء الإسكندرية في مصر، عشان تدل السفن وتبعدها عن الصخور على ساحل واطي ومستوي. وهي من عجايب الدنيا السبع القديمة، وطولها غالبا ما يقل عن مية متر، ومبنية ثلاث طبقات: قاعدة مربعة، وفوقها طبقة بثمان جوانب، وفوقها طبقة دائرية. وفوقها كانت تولّع نار بالليل، وحسب الروايات القديمة كان فيه مراية معدن كبيرة مصقولة ترمي نورها للبحر، وداخل البرج طريق يلف عشان الحيوانات تطلّع الوقود لفوق. والكتّاب القدماء قالوا إن نورها كان يبان من تقريبا خمسين كيلو. وبعد زلازل كثيرة طاحت في القرن الرابع عشر، وفي ألف وأربعمية وسبعة وسبعين بنى السلطان قايتباي قلعته مكانها واستخدم بعض حجارتها. وفي ألف وتسعمية وأربعة وتسعين لقى الغواصين حجارتها في قاع الميناء الشرقي، وفي ألفين وخمسة وعشرين طلّع علماء الآثار اثنين وعشرين حجر عملاق من البحر عشان يعيدون بناها رقميا."
