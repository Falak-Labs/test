  title: "مرايا العلا: المبنى اللي يختفي في الصحرا 🪞"
  text: |
    مبنى كامل ملبّس مرايا لين يختفي في الصحرا! 🪞
    مرايا العلا جدرانها الأربعة مغطاة بقريب عشرة آلاف متر مربع مرايا، فتشوف الجبال والسما بداله. والمرايا ترد شمس الصحرا للسما، وكل لوح معلّق وحوله فراغ صغير عشان القزاز يكبر بالحر وينكمش بالبرد بدون ما ينكسر، وعليه طبقة قوية تتحمل الرمل. وموسوعة غينيس تقول إنه أكبر مبنى مرايا بالعالم.
    رحت له قبل؟ 👇
  next: "بير فيه ثلاثة آلاف وخمسمية درجة 🪜"
  seo: "مرايا العلا، قاعة الحفلات اللي كلها مرايا: مرايا قاعة حفلات في وادي عشار في العلا شمال غرب السعودية، وادي صحراوي بين جبال من الحجر الرملي، مو بعيد عن مقابر الأنباط في الحجر، أول موقع سعودي في قائمة التراث العالمي لليونسكو. صممها استوديو جيو فورما الإيطالي، وهي صندوق بسيط جدرانه الأربعة مغطاة بحوالي تسعة آلاف وسبعمية وأربعين متر مربع من القزاز العاكس، فتعكس الجبال والرمل والسما وكأنها تختفي في المكان. وفي ألفين وعشرين سجلتها موسوعة غينيس للأرقام القياسية كأكبر مبنى مغطى بالمرايا في العالم. وداخلها قاعة فيها تقريبا خمسمية كرسي للحفلات والفعاليات. والواجهة العاكسة ترد كثير من شمس الصحرا بدال ما تمتصها، وألواح القزاز في الواجهات تتعلق وحولها فراغات صغيرة وفواصل مرنة عشان تكبر وتنكمش بين حر النهار وبرد الليل، والطبقات الواقية تساعد القزاز يتحمل الحر والرمل."
