  title: "Maraya: The Building That Vanishes in the Desert 🪞"
  text: |
    A concert hall so covered in mirrors it vanishes into the desert. 🪞
    Maraya in AlUla, Saudi Arabia, wears almost 10,000 m² of mirror on its four walls, so you see the rocks and the sky instead of the building. The mirrors bounce the desert sun back to the sky, every panel hangs with a small gap so the glass can grow in the heat and shrink at night without cracking, and a tough coating fights the sand. Guinness lists it as the largest mirrored building in the world.
    Would you go to a concert inside? 👇
  next: "a well with 3,500 steps 🪜"
  seo: "Maraya, the mirrored concert hall in AlUla: Maraya (Arabic for mirrors) is a concert hall in the Ashar Valley of AlUla in north-west Saudi Arabia, a desert valley of sandstone cliffs not far from the Nabataean tombs of Hegra, Saudi Arabia's first UNESCO World Heritage Site. Designed by the Italian studio Giò Forma, it is a simple box whose four walls are clad in about 9,740 m² of mirrored glass, so it reflects the cliffs, the sand and the sky and seems to disappear into the landscape. In 2020 Guinness World Records named it the largest mirrored building in the world. Inside is a hall with about 500 seats for concerts and events. A mirrored skin reflects much of the desert sun instead of soaking it up, glass panels on a façade are hung with small gaps and flexible joints so they can expand and contract between hot days and cold nights, and protective coatings help glass stand up to heat and blowing sand."
