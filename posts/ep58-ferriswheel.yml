  title: "عجلة ملاهي عملاقة: إطارها متعلق في كابلات رفيعة 🎡"
  text: |
    عجلة أطول من ناطحة سحاب، وإطارها متعلق في كابلات رفيعة! 🎡
    معمولة زي عجلة البسكلتة: كابلات مشدودة من المحور شايلة الإطار، وكل كابينة بتلف على حلقة لوحدها عشان أرضيتها تفضل مستوية، وكاوتشات بتلف الإطار براحة لدرجة إنك تركب وهي ماشية. وعجلة لندن اتبنت نايمة فوق النهر واترفعت بالكابلات.
    تركبها ولا تتفرج عليها من تحت؟ 👇
  next: "تمثال الحرية 🗽"
  seo: "إزاي عجلة الملاهي العملاقة بتشتغل: عجلة بالحجم ده ماينفعش تقف على أسياخ تخينة زي عجلة الكارو، لأنها هتبقى تقيلة أوي واللي تحت هتتني. عشان كده بتتعمل زي عجلة البسكلتة: كابلات حديد رفيعة مشدودة من المحور شايلة الإطار، فالعجلة كلها تبقى خفيفة وجامدة. كل كابينة إزاز قاعدة على حلقة لوحدها برة الإطار، وموتور بيلفها عشان أرضيتها تفضل مستوية طول اللفة. والعجلة مش بتلف من المحور، كاوتشات بتمسك الإطار وتلفه براحة، لدرجة إن الناس بتركب وهي ماشية. عجلة لندن طولها مية خمسة وتلاتين متر، واتبنت حتت نايمة على منصات فوق نهر التايمز، وبعدين اترفعت بالكابلات والجاكات سنة ألف تسعمية تسعة وتسعين. وعجلة دبي طولها حوالي ميتين وخمسين متر، فيها تمانية وأربعين كابينة تشيل حوالي ألف وسبعمية وخمسين واحد، واللفة الواحدة حوالي تمانية وتلاتين دقيقة. وأول عجلة ملاهي في التاريخ عملها المهندس جورج فيريس في معرض شيكاغو سنة ألف تمنمية تلاتة وتسعين، عشان أمريكا ترد على برج إيفل."
