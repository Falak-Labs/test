  title: "Giant Ferris Wheel: Its Rim Hangs From Thin Cables 🎡"
  text: |
    A wheel taller than a skyscraper, and its rim hangs from thin cables. 🎡
    Built like a bicycle wheel, with tight cables from the hub holding the rim, every cabin turning on its own ring to keep its floor level, and tyres rolling the rim so slowly you step on while it moves. London's wheel was even built lying flat over the river and winched upright.
    Would you ride it, or watch from the ground? 👇
  next: "the Statue of Liberty 🗽"
  seo: "How a giant Ferris wheel works: a wheel this big cannot stand on thick spokes like a wagon wheel, because they would be so heavy that the bottom ones would buckle. Instead it is built like a bicycle wheel: thin steel cables pulled tight from the hub hold the rim, so the whole wheel is light and stiff. Each glass cabin sits on its own ring outside the rim and is turned by motors so its floor stays level all the way round. The wheel is not turned from the axle; tyres grip the rim and roll it, so slowly that people step on while it moves. London's 135 m wheel was built in sections lying flat on platforms over the River Thames and then pulled upright with cables and jacks in 1999. Dubai's observation wheel is about 250 m tall, with 48 cabins for up to about 1,750 people, and one turn takes about 38 minutes. The very first Ferris wheel was built by the engineer George Ferris for the 1893 World's Fair in Chicago, as America's answer to the Eiffel Tower."
