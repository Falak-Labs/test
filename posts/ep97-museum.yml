  title: "Museum of the Future: Windows Made of Words 🏛️"
  text: |
    Dubai built a silver ring with no columns inside… and Arabic writing for windows. 🏛️
    The outside holds it up: about 2,400 steel beams cross like a basket, a frame a computer found after trying thousands of shapes. Every tube has the same width and is short enough to ride a truck through the city. Robot arms shaped 1,024 curved panels, water jets cut more than 10,000 glass pieces to fit the letters, and 14 km of lights make the words glow at night.
    Who's cleaning all those windows? 👇
  next: "a waterfall inside an airport 💧"
  seo: "How Dubai's Museum of the Future was built: a 77 m tall stainless-steel ring (torus) with column-free floors, carried by a steel diagrid of about 2,400 diagonal beams found with a growth algorithm that tried thousands of shapes, all tubes one diameter and short enough to travel on city roads. The facade has 1,024 stainless-steel-clad fibreglass panels made with robotic arms, more than 10,000 pieces of glass cut with water jets for the Arabic calligraphy windows, and 14 km of LED lighting. Opened February 22, 2022."
