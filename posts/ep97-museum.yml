  title: "متحف المستقبل: شبابيكه حروف 🏛️"
  text: |
    دبي بنت خاتم فضي ما فيه ولا عمود... وشبابيكه حروف عربية! 🏛️
    برّاه هو اللي شايله: حوالي ٢٤٠٠ عارضة حديد متشابكة مثل السلة، شكل لقاه الكمبيوتر بعد آلاف المحاولات. كل الأنابيب بنفس العرض وقصيرة تكفي تنحمل على تريلة في شوارع المدينة. أذرع روبوت شكّلت ١٠٢٤ لوح منحني، وموية بضغط قوي قصّت أكثر من ١٠ آلاف قطعة زجاج على مقاس الحروف، و١٤ كيلو أنوار تخلي الحروف تلمع بالليل.
    مين بيمسح كل هالشبابيك؟ 👇
  next: "شلال داخل مطار 💧"
  seo: "كيف انبنى متحف المستقبل في دبي: خاتم من الستانلس ستيل طوله ٧٧ متر وأدواره بدون أعمدة، يشيله هيكل شبكي من حوالي ٢٤٠٠ عارضة حديد مائلة، صممه الكمبيوتر بعد آلاف المحاولات، وكل الأنابيب بنفس القطر وقصيرة تكفي تمشي في شوارع المدينة. الواجهة فيها ١٠٢٤ لوح من الألياف الزجاجية مكسي بالستانلس ستيل سوتها أذرع روبوت، وأكثر من ١٠ آلاف قطعة زجاج قصّتها الموية بضغط عالي لشبابيك الخط العربي، و١٤ كيلو إضاءة. افتتح في ٢٢ فبراير ٢٠٢٢."
