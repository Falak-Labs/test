  title: "تمثال الحرية: جلد نحاس رقيق مثل عملتين 🗽"
  text: |
    عملاقة نحاس جلدها رقيق مثل عملتين فوق بعض، وواقفة في عواصف البحر من أكثر من مية وثلاثين سنة! 🗽
    غوستاف إيفل، صاحب البرج نفسه، بنى لها برج حديد من داخل، وأسياخ رفيعة على شكلها، والجلد معلّق بمشابك مرتخية يتحرك براحته، وانبنت في باريس أول وانشحنت ثلاثمية وخمسين قطعة. والأخضر؟ هوا البحر صبغ النحاس، وهالأخضر هو اللي يحميه.
    كنت تدري إنها كانت بنية؟ 👇
  next: "مايكرويف 🍿"
  seo: "كيف انبنى تمثال الحرية: جلده نحاس سماكته حوالي ملّيين ونص بس، مثل عملتين فوق بعض، انطرق على شكله باليد، وهو أرق من إنه يشيل شكله بنفسه. غوستاف إيفل، مهندس برج إيفل نفسه، صمم البرج الحديد اللي داخله ويشيل الوزن، وشبكة أسياخ حديد رفيعة ماشية على شكلها. والجلد معلّق على هالشبكة بمشابك مرتخية، عشان يتحرك إذا سخن من الشمس ويتمايل مع الريح: في الريح القوية التمثال يتمايل حوالي سبعة سانتي والشعلة حوالي ثلاثطعش. والنحاس إذا لمس الحديد في هوا البحر المالح يصير بطارية والحديد يصدّي، فحطوا بينهم قماش مشرّب ورنيش، وفي الترميم في الثمانينات بدّلوا الأسياخ الحديد بستيل ما يصدّي. التمثال انبنى وانوقف أول في باريس، وبعدين فكّوه ثلاثمية وخمسين قطعة في مية وأربعطعش صندوق وشحنوه لنيويورك سنة ألف وثمنمية وخمسة وثمانين، وافتتحوه السنة اللي بعدها. كان لونه بني مثل النحاس الجديد، وصار أخضر خلال حوالي ثلاثين سنة، وهالطبقة الخضرا تحمي النحاس اللي تحتها. طوله حوالي ستة وأربعين متر، ومع القاعدة حوالي ثلاثة وتسعين متر من الأرض للشعلة."
