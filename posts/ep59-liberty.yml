  title: "Statue of Liberty: A Copper Skin as Thin as Two Coins 🗽"
  text: |
    A copper giant with a skin as thin as two coins, standing in harbor storms since 1886. 🗽
    Gustave Eiffel built an iron tower inside her, thin iron bars follow her shape and loose clips let the skin slide and sway, and she stood in Paris first before crossing the ocean in 350 pieces. And the green? The sea air turned her copper, and that green coat protects it.
    Did you know she used to be brown? 👇
  next: "a microwave oven 🍿"
  seo: "How the Statue of Liberty was built: her skin is copper only about 2.4 mm thick, about the thickness of two coins, hammered into shape by hand, far too thin to hold its own shape. Gustave Eiffel, the engineer of the Eiffel Tower, designed the iron tower inside her that carries the weight, and a web of thin iron bars that follows her shape. The skin hangs on that web with loose clips, so it can slide when it heats up in the sun and sway in the wind: in strong wind the statue sways about 7.6 cm and her torch about 13 cm. Copper touching iron in salty sea air makes a battery and the iron rusts, so the two metals were kept apart with a layer of varnished cloth; in the 1980s restoration the iron bars were replaced with stainless steel. The statue was built and first put up in Paris, then taken apart into 350 pieces, packed in 214 crates and shipped to New York in 1885, and she was dedicated in 1886. She was the brown of new copper at first and turned green in about thirty years; that green layer protects the copper underneath. She is about 46 m tall, and about 93 m from the ground to the torch with the pedestal."
