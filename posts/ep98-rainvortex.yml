  title: "Rain Vortex: An Airport Waterfall Fed by Rain 💧"
  text: |
    Singapore's airport has a 40 m waterfall pouring through a hole in its roof. 💧
    The roof is a giant glass doughnut that catches the rain. The hole sits off center, so the water falls in a smooth curve instead of smashing straight down, into a clear drum two floors tall that keeps the spray in. A low glass wall sends the air the water drags down back up, so the garden stays calm. Then pumps carry the same water back up to the roof.
    Ever turned a tap on full over a spoon? 👇
  next: "noodles full of tiny holes 🍜"
  seo: "How the Rain Vortex at Jewel Changi Airport works: the world's tallest indoor waterfall, about 40 m, pours through an off-centre opening in a doughnut-shaped glass roof. Rain collected on the roof feeds it, up to 10,000 gallons a minute in the heaviest storms; the water falls in a curved arc into a two-storey clear acrylic drum that keeps the spray from visitors, a one-metre glass wall turns the air dragged down by the falling water upward, and the water is filtered and pumped back up to the roof. More than 2,000 trees grow in the indoor forest around it. Opened April 2019."
