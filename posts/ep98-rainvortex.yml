  title: "شلال المطر: شلال داخل مطار سنغافورة 💧"
  text: |
    مطار سنغافورة فيه شلال طوله ٤٠ متر، ينصب من فتحة في السقف! 💧
    السقف دونات زجاج عملاقة تجمع المطر. والفتحة مو بالنص بالضبط، فالموية تنزل على شكل قوس ناعم بدل ما تضرب الأرض دغري، وتطيح داخل أسطوانة شفافة طولها دورين تمسك الرذاذ. وجدار زجاج قصير يرفع الهوا اللي تسحبه الموية لفوق، فتظل الحديقة هادية. وبعدين المضخات ترجّع نفس الموية للسقف.
    جربت تفتح حنفية المطبخ على آخرها فوق ملعقة؟ 👇
  next: "نودلز مليانة خروم 🍜"
  seo: "كيف يشتغل شلال المطر في مطار جويل شانغي بسنغافورة: أطول شلال داخلي في العالم، حوالي ٤٠ متر، ينصب من فتحة مو بالنص في سقف زجاج شكله دونات. المطر اللي يجمعه السقف يغذيه، لين حوالي ٣٨ ألف لتر بالدقيقة في أقوى العواصف. الموية تنزل على شكل قوس داخل أسطوانة أكريليك شفافة طولها دورين تمسك الرذاذ، وجدار زجاج طوله متر يرفع الهوا اللي تسحبه الموية لفوق، والموية تتصفى وترجع بالمضخات للسقف. حوله غابة داخلية فيها أكثر من ألفين شجرة. افتتح في أبريل ٢٠١٩."
