  title: "Colosseum: A Roof of Sails and Lions From the Floor 🏛️"
  text: |
    A roof of sails over 50,000 people, and lions that rise out of the floor. 🏛️
    Sailors from the Roman navy rigged a giant awning on 240 wooden poles, 80 numbered arches let the crowd in and out (your ticket told you which gate), and under the sand two floors of tunnels hid cages that men lifted up to trapdoors with wooden winches. All those holes in its walls? People dug out the iron clamps that held the stones.
    Would you sit in the sun or the shade? 👇
  next: "Taipei 101's giant swinging ball ⚖️"
  seo: "How the Colosseum worked: the Flavian Amphitheatre in Rome was opened in 80 AD by the emperor Titus with 100 days of games and held about 50,000 spectators. On hot days a huge awning, the velarium, was stretched over the seats from about 240 wooden poles set in the top of the outer wall, where the stone brackets that held them can still be seen. It was rigged by sailors of the Roman fleet based at Misenum, who knew how to handle ropes and canvas, and its ropes are thought to have been tied down to stone posts around the building. Eighty arches at ground level let the crowd in and out; most were numbered, and a spectator's token showed which entrance, section and row to use, so the building could fill and empty quickly. Under the wooden arena floor, covered with sand (harena in Latin, which gave us the word arena), the emperor Domitian added the hypogeum: two levels of tunnels and cages where animals, fighters and scenery waited, and lifts worked by men turning capstans raised them to trapdoors in the floor, so a lion could appear in the middle of the arena. A working replica of one of these lifts was built and tested in 2015. The travertine blocks of the outer wall were held together with iron clamps; in the Middle Ages people dug the metal out, which left the holes that cover the walls today, and earthquakes brought down part of the outer ring."
