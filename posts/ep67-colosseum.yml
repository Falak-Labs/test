  title: "الكولوسيوم: سقف أشرعة وأسد يطلع من الأرض 🏛️"
  text: |
    سقف أشرعة فوق خمسين ألف واحد، وأسد يطلع من تحت الأرض! 🏛️
    بحّارة من الأسطول الروماني يشدّون مظلة ضخمة على ميتين وأربعين صاري، وثمانين بوابة كلها بأرقام وتذكرتك مكتوب فيها بوابتك، وتحت الرمل دورين أنفاق فيها أقفاص يرفعها رجال برافعات خشب لين فتحات في الأرض. والخروم اللي في جدرانه؟ الناس قلعوا مشابك الحديد اللي تمسك حجارته.
    تقعد في الشمس ولا في الظل؟ 👇
  next: "كورة برج تايبيه ⚖️"
  seo: "كيف اشتغل الكولوسيوم: مدرج روما الكبير انفتح سنة ثمانين ميلادية أيام الإمبراطور تيتوس بألعاب استمرت مية يوم، ويوسع حوالي خمسين ألف متفرج. وفي الأيام الحارة كانوا يشدّون فوق المقاعد مظلة ضخمة اسمها الفيلاريوم، على حوالي ميتين وأربعين صاري خشب مركّبة فوق السور الخارجي، وللحين تشوف الحجارة اللي كانت تمسكها. واللي يشدّونها بحّارة من الأسطول الروماني اللي في ميزينوم، لأنهم يعرفون الحبال والأشرعة، والحبال يقولون إنها كانت مربوطة في أعمدة حجر حول المبنى. وفي الدور الأرضي ثمانين بوابة يدخل منها الجمهور ويطلع، أغلبها عليها أرقام، والتذكرة فيها البوابة والقسم والصف، عشان المكان يمتلي ويفضى بسرعة. وتحت أرضية الساحة الخشب المغطاة بالرمل، والرمل بالّلاتيني هارينا ومنه جات كلمة أرينا، الإمبراطور دوميتيان زاد الهيبوجيوم: دورين أنفاق وأقفاص تنتظر فيها الحيوانات والمقاتلين والديكورات، ورافعات يدفّها رجال ترفعها لين فتحات في الأرضية، فيطلع الأسد فجأة في نص الساحة. وفي ألفين وخمسطعش سوّوا نسخة شغالة من وحدة من هالرافعات وجرّبوها. وحجارة السور الخارجي كانت ماسكتها مشابك حديد، وفي العصور الوسطى الناس قلعوا الحديد، وهذي الخروم اللي تشوفها في جدرانه اليوم، والزلازل طيّحت جزء من السور الخارجي."
