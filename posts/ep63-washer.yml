  title: "Washing Machine: Its Drum Beats a Car on the Highway 🧺"
  text: |
    No hands, and the drum wall spins faster than a car on the highway. 🧺
    A drum full of holes tumbles your clothes, detergent molecules grab grease with one end and water with the other, the spin throws the water out through the holes at 1,400 turns a minute, and a concrete block, springs and shock absorbers stop the whole thing from walking away.
    Does yours walk across the bathroom too? 👇
  next: "Big Ben's clock 🕰️"
  seo: "How a washing machine works: the clothes go into a drum full of small holes that sits inside a sealed tub. The motor turns the drum back and forth, and paddles on its wall lift the clothes and drop them again, so the water and detergent are pushed through the fabric instead of just soaking it. Detergent molecules have one end that sticks to water and one end that sticks to grease, so they surround the grease, lift it off the threads and carry it away in the water. To dry the clothes, the drum spins fast, up to about 1,400 turns a minute in many front loaders: the clothes are pressed against the wall with hundreds of times the pull of gravity and the water is thrown out through the holes. At about 1,400 turns a minute the wall of a 48 cm drum moves at roughly 130 km/h. A heavy load on one side makes the drum wobble at that speed, so the tub is weighed down with blocks of concrete, often around 25 kg, hung on springs from the top and held by shock absorbers from below, and many machines check the balance before they spin. Before electric washers arrived more than a century ago, washday meant a whole day of boiling water and scrubbing clothes by hand."
