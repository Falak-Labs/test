  title: "الغسالة: حوضها أسرع من سيارة على الخط السريع 🧺"
  text: |
    بدون ما تلمس الملابس، وحوضها يلف أسرع من سيارة على الخط السريع! 🧺
    حوض كله خروم يقلّب الملابس، والصابون جزيئاته تمسك الدهن من طرف والموية من طرف، والعصر يطيّر الموية من الخروم بألف وأربعمية لفة في الدقيقة، وحجر خرسانة وسوست ومساعدات تمنعها تمشي في الحمام.
    غسالتكم للحين تمشي؟ 👇
  next: "ساعة بيغ بن 🕰️"
  seo: "كيف تشتغل الغسالة: الملابس تنحط في حوض كله خروم صغيرة، وهو داخل حوض ثاني مقفّل. الموتور يلف الحوض رايح جاي، وفيه زعانف على جداره ترفع الملابس وتطيّحها، عشان الموية والصابون يدخلون في القماش بدل ما ينقع بس. جزيئات الصابون لها طرف يمسك الموية وطرف يمسك الدهن، فتلف حول الدهن وتشيله من الخيوط وتاخذه مع الموية. ولما يجي وقت العصر، الحوض يلف بسرعة، لين ألف وأربعمية لفة في الدقيقة في غسالات كثيرة، والملابس تنضغط على الجدار بقوة مئات المرات الجاذبية والموية تطير من الخروم، وجدار الحوض يمشي حوالي مية وثلاثين كيلو في الساعة، أسرع من سيارة على الخط السريع. ولو الحمل على جهة وحدة، الحوض يرج بقوة على هالسرعة، فيثقّلونه بحجر خرسانة، غالبًا حوالي خمسة وعشرين كيلو، ويعلّقونه على سوست من فوق ومساعدات من تحت، وغسالات كثيرة تفحص التوازن قبل العصر. وقبل الغسالات الكهربا اللي جت قبل أكثر من مية سنة، يوم الغسيل كان يوم كامل غلي موية وفرك باليد."
