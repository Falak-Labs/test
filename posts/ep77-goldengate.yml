  text: |
    لون جسر البوابة الذهبية البرتقالي المشهور كان مجرد طبقة أساس! 🌉
    الحديد وصل مدهون بطبقة حمرا، والمهندس خلاها لأنها تبان في الضباب، والبحرية كانت تبيه مخطط أسود وأصفر. البرج الجنوبي انبنى داخل حوض خرسانة وسط البحر، وكل كيبل فيه ٢٧٥٧٢ سلك، وشبكة تحت الجسر أنقذت ١٩ عامل.
    تمشي عليه؟ 👇
  next: "قوس البوابة 🌈"
  seo: "كيف انبنى جسر البوابة الذهبية: افتتح سنة ١٩٣٧ فوق مضيق فيه تيارات قوية وموج وضباب، وبرجه الجنوبي واقف في البحر المفتوح وانبنى داخل حوض خرسانة شفطوا منه الماي. لونه البرتقالي جا من طبقة الأساس الحمرا على الحديد ويبان في الضباب. كيبلين كل واحد فيه ٢٧٥٧٢ سلك شايلين الجسر، وشبكة تحته أنقذت ١٩ عامل. ويوم الافتتاح مشى عليه حوالي ٢٠٠ ألف شخص."
