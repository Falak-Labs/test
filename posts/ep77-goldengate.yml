  title: "Golden Gate Bridge: Its Orange Was the Undercoat 🌉"
  text: |
    The Golden Gate's famous orange started out as the undercoat. 🌉
    The steel arrived in a reddish primer, and architect Irving Morrow kept the color because it stands out in the fog (the Navy wanted black and yellow stripes). The south tower was built inside a concrete tub in the open sea, each main cable is spun from 27,572 wires, and a safety net under the deck saved 19 workers.
    Have you walked across it? 👇
  next: "the Gateway Arch 🌈"
  seo: "How the Golden Gate Bridge was built: opened in 1937 across a strait with strong tides, ocean swells and fog, its south tower stands in the open sea, built inside a concrete fender that was pumped dry. Its International Orange came from the red primer on the steel and stays visible in fog. Two main cables of 27,572 wires each carry the deck, and a safety net under it saved 19 workers, the Halfway to Hell Club. About 200,000 people walked across on opening day."
