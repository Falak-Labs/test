  title: "Smoke Alarm: The Radioactive Speck on Your Ceiling 🚨"
  text: |
    Lots of smoke alarms have a tiny speck of radioactive metal inside. 🚨 (Sealed and safe.)
    It charges the air between two plates so a tiny current flows, and smoke breaks that current. Other alarms see smoke bounce a light beam onto a sensor. And the 2 a.m. chirp? A weak battery sags as the house cools down at night.
    Has yours ever chirped at 2 a.m.? 👇
  next: "a Ferris wheel for boats 🎡"
  seo: "How a smoke alarm works: an ionization smoke alarm holds a tiny sealed amount of americium-241 that charges the air between two metal plates, so a small current flows; smoke particles break the current and the alarm sounds. A photoelectric alarm sees smoke scatter a light beam onto a sensor. Low-battery chirps often come at night because a weak battery's voltage sags as the house cools. Sealed 10-year batteries end the chirping. Sleeping people can't smell smoke, and in fire tests a room of modern furniture burst into flames in under four minutes."
