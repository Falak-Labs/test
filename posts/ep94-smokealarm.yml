  title: "جهاز إنذار الدخان: حبة مشعة فوق راسك 🚨"
  text: |
    كثير من أجهزة الدخان فيها حبة صغيرة من معدن مشع! 🚨 (مقفولة وآمنة.)
    الحبة تشحن الهوا بين لوحين فيمشي تيار صغير، والدخان يقطعه فيصيح الجهاز. والنوع الثاني يشوف الدخان لما يرد الضو على الحساس. وصفرة الساعة ثنتين بالليل؟ البطارية الضعيفة تتعب لما يبرد البيت.
    جهازكم صفّر عليكم الساعة ثنتين؟ 👇
  next: "عجلة ملاهي للقوارب 🎡"
  seo: "كيف يشتغل جهاز إنذار الدخان: جهاز التأين فيه كمية صغيرة مقفولة من الأمريسيوم تشحن الهوا بين لوحين معدن فيمشي تيار صغير، والدخان يقطع التيار فيصيح الجهاز. والجهاز الضوئي يشوف الدخان لما يشتت شعاع ضو على الحساس. صفرة البطارية تجي غالباً بالليل لأن البطارية الضعيفة تتعب لما يبرد البيت، والبطاريات المقفولة اللي تعيش عشر سنين تنهي الصفير. وأنت نايم ما تشم الدخان، وفي تجارب الحرايق غرفة بأثاث اليوم ولّعت في أقل من أربع دقايق."
