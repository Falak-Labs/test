  title: "Why Japanese Pagodas Don't Fall in Earthquakes 🏯"
  text: |
    Five wooden roofs that sway like a snake in an earthquake, and only two pagodas lost to quakes in 1,400 years. 🏯
    Wood that bends, a thousand joints with almost no nails, floors that each sway the opposite way, a giant tree trunk up the middle that bumps them back, and wide eaves that keep the walls dry.
    Which would you trust in a quake? 👇
  next: "the Panama Canal locks 🚢"
  seo: "Why Japan's five-storey wooden pagodas survive earthquakes: they are built of wood joined with very few nails, about a thousand joints that twist and rub and soak up the shaking; the storeys are stacked like loose boxes and sway in alternating directions (a 'snake dance'); a central pillar, the shinbashira, runs up the middle without holding up the floors and stops any storey from swinging too far; very wide eaves keep rain off the walls and add to the tower's stability. The pagoda of Horyu-ji in Nara is about 1,300 years old, its central pillar cut from a cypress felled in 594; records show only two pagodas lost to earthquakes in 1,400 years. Tokyo Skytree (634 m) has a 375 m concrete central column that cuts earthquake shaking by up to about half, a design named after the pagoda's shinbashira."
