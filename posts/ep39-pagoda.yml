  title: "ليه الباجودا اليابانية مبتقعش في الزلازل؟ 🏯"
  text: |
    خمس سقوف خشب بتتلوّى زي التعبان في الزلزال، واتنين بس وقعوا في أربعتاشر قرن! 🏯
    خشب يتني ويرجع، ألف وصلة من غير مسامير تقريبًا، كل دور يتمايل عكس اللي تحته، جذع شجرة في النص يرجّع الدور مكانه، ورفرف عريض يحمي الحيطان.
    تثق في مين وقت الزلزال؟ 👇
  next: "هويس قناة بنما 🚢"
  seo: "ليه الباجودا اليابانية الخشب أم خمس أدوار مبتقعش في الزلازل: مبنية خشب بيتني ويرجع، وفيها حوالي ألف وصلة من غير مسامير تقريبًا بتتلوّى وتتحك وتمتص الهزة. الأدوار مرصوصة فوق بعض زي الصناديق ومش مربوطة، وكل دور بيتمايل عكس اللي تحته، وده اسمه رقصة التعبان. وفي النص جذع شجرة ضخم اسمه شينباشيرا، لو دور اتمايل زيادة بيخبط فيه ويرجع. والرفرف العريض بيحمي الحيطان من المطر وبيساعد البرج يتوازن. باجودا هوريوجي في نارا عمرها حوالي تلتاشر قرن، ومن أربعتاشر قرن اتنين بس وقعوا من الزلازل. وبرج طوكيو سكاي تري، طوله ستمية وأربعة وتلاتين متر، فيه عمود خرسانة في النص على نفس الفكرة، بيقلل الهزة لحد النص تقريبًا."
