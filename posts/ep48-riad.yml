  title: "الرياض المغربي: جنينة مستخبية ورا حيطة صمّا 🌿"
  text: |
    من الحارة هتشوف حيطة طين صمّا، ومن جوه: جنينة وشجر برتقان ونافورة! 🌿
    كل أوضة بتفتح على حوش عالي وضيق بيفضل ساقع، والحيطان متلبسة جير متلمّع بحجر وصابون بلدي، والمدخل بيلف في زاوية عشان محدش يشوف جوه.
    تحب تعيش في بيت زي ده؟ 👇
  next: "قبة آيا صوفيا 🏛️"
  seo: "إزاي الرياض المغربي بيشتغل: في المدن القديمة زي فاس ومراكش، الحواري يا دوب تساع حمار، فالبيت التقليدي اتقلب لجوه: الحيطان اللي على الشارع صمّا تقريبًا، وكل أوضة بتفتح على حوش أو جنينة في النص، فيها نافورة وشجر برتقان، وكلمة رياض أصلها جمع روضة يعني جنينة. الحوش العالي والضيق الحيطان بتضلله، وهوا الليل الساقع بينزل فيه ويفضل طول الصبح، والحيطان التخينة بتمنع الحر. والحيطان والحمامات متلبسة تادلاكت: جير بيتدك ويتلمّع بحجر من النهر ويتدعك بالصابون البلدي لحد ما المية تزحلق عليه. والمدخل بيلف في زاوية عشان اللي معدّي في الحارة ميشوفش جوه. والأرضيات والحيطان متغطية زليج: حتت سيراميك صغيرة كل حتة متكسّرة بالإيد. وفاس القديمة، عمرها حوالي اتناشر قرن، فيها أكتر من تسع تلاف حارة، وأكبر منطقة في العالم من غير عربيات."
