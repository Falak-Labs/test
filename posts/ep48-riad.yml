  title: "Moroccan Riad: A Hidden Garden Behind a Blank Wall 🌿"
  text: |
    From the alley it's a blank mud wall. Inside: a garden, orange trees and a fountain. 🌿
    Every room opens onto a tall, narrow courtyard that stays cool, the walls are sealed with lime plaster polished with a river stone and black soap, and the entrance turns a corner so nobody can see in.
    Would you live in one? 👇
  next: "the Hagia Sophia's dome 🏛️"
  seo: "How a Moroccan riad works: in the packed old medinas of Fez and Marrakech, where alleys are barely wide enough for a donkey, the traditional house turns inside out. Its outer walls are almost blank, and every room opens onto an inner courtyard or garden, usually with a fountain and orange trees (riad comes from the Arabic word for garden). A tall, narrow courtyard is shaded by its own walls, and cool night air sinks into it and stays through the morning, while thick earth walls keep the heat out. Walls and bathrooms are protected with tadelakt, a lime plaster compacted and polished with a river stone and treated with black olive soap until water beads and rolls off. The entrance turns a corner, so people passing in the alley never see inside. Floors and walls are covered in zellige, mosaics of small glazed tiles each chipped by hand. The old medina of Fez, Fes el-Bali, founded about twelve centuries ago, has over 9,000 alleys and is the largest car-free urban area in the world."
