en:
  title: "How a Space Station Keeps You Alive: Air, Water and Yesterday's Coffee 🛰️"
  text: |
    How do you stay alive in a sealed room in orbit? 🛰️
    Machines make oxygen from water, filters turn sweat and pee back into drinking water, you work out two hours a day, and shields stop specks of paint moving at 28,000 km/h.
    Would you drink the recycled coffee? 👇
  next: "a suspension bridge 🌉"
  seo: "Oxygen from electrolysis and CO2 scrubbers, water recycling, daily exercise against bone and muscle loss, and layered debris shields."
