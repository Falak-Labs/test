card:
  lines:
  - قُلْ يَٰعِبَادِيَ ٱلَّذِينَ أَسْرَفُواْ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُواْ مِن
    رَّحْمَةِ ٱللَّهِۚ
  - لَلَّهُ أَرْحَمُ بِعِبَادِهِ مِنْ هَذِهِ بِوَلَدِهَا
  ref: 'الزمر: 53 · متفق عليه: البخاري 5999، مسلم 2754 · قصة قاتل المئة: البخاري 3470،
    مسلم 2766'
  hold: 6.0
