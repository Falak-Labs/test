palette: teal
beats:
- line: 1
  sub: 'رجل قتل تسعة وتسعين نفس.. وبعدها سأل سؤال واحد بس: لي توبة؟'
- line: 2
  sub: 'أول واحد جاوبه قال: لا.. وكانت هذي آخر كلمة قالها في حياته.'
- line: 3
  sub: والثاني.. قال له جواب.. غيّر مصيره كله.
- line: 4
  sub: قصة صحيحة.. في البخاري ومسلم. خلك معي للآخر.. لأن بآخرها حديث ثاني.. يهز أي
    قلب.
- line: 5
  sub: 'النبي صلى الله عليه وسلم.. هو اللي حكى هذي القصة لأصحابه. قال:'
- line: 6
  sub: كَانَ فِيمَنْ كَانَ قَبْلَكُمْ رَجُلٌ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا.
- line: 7
  sub: رجل من الأمم اللي قبلنا. ما نعرف اسمه.. ولا نعرف بلده.
- line: 8
  sub: 'وهذي لحالها رسالة: القصة مو قصته هو بس.. ممكن تكون قصتك أنت.'
- line: 9
  sub: تخيّل رجل.. ما يقدر ينام.
- line: 10
  sub: يحط راسه على المخدة.. ويسكّر عيونه.. ويشوف وجيه.
- line: 11
  sub: وجيه ناس راحوا بسببه. تسعة وتسعين وجه.
- line: 12
  sub: يقوم من نومه.. ويطلع برا.. ويرجع. والوجيه ما تروح.
- line: 13
  sub: الناس تخاف منه. يمشي في السوق.. والكل يبعد عن طريقه.
- line: 14
  sub: وهو؟ من جوّا.. مكسور.
- line: 15
  sub: 'تخيّل كم ليلة عاش كذا. كم مرة قال لنفسه: خلاص.. أنا انتهيت.'
- line: 16
  sub: وبعدين.. جات عليه ليلة.. غير كل الليالي.
- line: 17
  sub: 'وقف.. وقال لنفسه: وبعدين؟ هذا آخري؟ أموت وأنا كذا؟'
- line: 18
  sub: هنا بدأت القصة الحقيقية. مو لما قتل.. لما ندم.
- line: 19
  sub: 'وطلع يدور على جواب. يسأل الناس: مين أعلم أهل الأرض؟'
- line: 20
  sub: فدلّوه على راهب.
- line: 21
  sub: تخيّل الراهب.. رجل عابد من الأمم اللي قبلنا.. عايش في صومعته.. يعني بيت صغير
    منعزل للعبادة.
- line: 22
  sub: 'اللي يشوفه يقول: هذا أقرب الناس لله.'
- line: 23
  sub: ومشى الرجل لين وصل باب الراهب. تخيّل كيف كان قلبه يدق.
- line: 24
  sub: 'ويمكن قال في نفسه طول الطريق: إذا قال لي إيه.. بتغيّر. بعيش من جديد.'
- line: 25
  sub: 'دق الباب.. ودخل.. وقال: قتلت تسعة وتسعين نفس.. لي توبة؟'
- line: 26
  sub: تخيّل الراهب ساكت.. والرجل يستنى. هالثواني كانت أطول من عمره كله.
- line: 27
  sub: 'وبعدها.. قال الراهب: لا.'
- line: 28
  sub: كلمة وحدة. لا.
- line: 29
  sub: الراهب عنده عبادة كثير.. بس علمه قليل. وتكلم في شي ما يعرفه.
- line: 30
  sub: والرجل؟ كان واقف على الحافة. وكلمة لا.. طيّحته.
- line: 31
  sub: فقتله.. وكمّل فيه المية.
- line: 32
  sub: تخيّل. كان باقي له خطوة ويوصل الباب.. وجاه واحد.. وسدّ الباب في وجهه.
- line: 33
  sub: 'ومن أخطر الأشياء في الدنيا.. الشخص اللي يقول لك: ما فيه أمل.'
- line: 34
  sub: 'وقّف شوي. تخيّل لو الرجل وقّف هنا.. وقال: خلاص، أنا انتهيت.. حتى أهل الدين
    يقولون ما لي توبة.'
- line: 35
  sub: كثير مننا.. يعيش مع ذنب ما يروح من باله.
- line: 36
  sub: 'ويمكن.. أحد قال له مرة: انت ما فيك خير.. وصدّقها.'
- line: 37
  sub: وصار يعيش وهو مقتنع إن ما له رجعة. لا يصلي.. ولا يدعي.. لأنه يحس إن الباب مقفل.
- line: 38
  sub: بس هذا الرجل.. ما رضى ييأس.
- line: 39
  sub: 'مية نفس.. وللحين يسأل. سأل مرة ثانية: مين أعلم أهل الأرض؟'
- line: 40
  sub: وهالمرة.. دلّوه على رجل عالم. مو عابد.. عالم.
- line: 41
  sub: 'راح للعالم.. وقال له: قتلت مية نفس.. لي توبة؟'
- line: 42
  sub: 'وهنا.. اسمع وش قال العالم:'
- line: 43
  sub: نَعَمْ، وَمَنْ يَحُولُ بَيْنَهُ وَبَيْنَ التَّوْبَةِ؟
- line: 44
  sub: 'يعني: إيه.. لك توبة. ومين اللي يمنعك منها؟'
- line: 45
  sub: مين يقدر يقفل باب.. فتحه الله؟
- line: 46
  sub: 'شفت الفرق؟ الراهب قال: لا. والعالم قال: إيه.. ومين يقدر يقول لا؟'
- line: 47
  sub: 'وبعدها.. ما تركه بكلمة حلوة وبس. أعطاه شي عملي. قال له:'
- line: 48
  sub: انْطَلِقْ إِلَى أَرْضِ كَذَا وَكَذَا، فَإِنَّ بِهَا أُنَاسًا يَعْبُدُونَ اللَّهَ،
    فَاعْبُدِ اللَّهَ مَعَهُمْ، وَلَا تَرْجِعْ إِلَى أَرْضِكَ، فَإِنَّهَا أَرْضُ سَوْءٍ.
- line: 49
  sub: 'يعني: اطلع من أرضك.. فيه أرض ثانية أهلها يعبدون الله. روح لهم.. واعبد الله
    معهم. ولا ترجع لأرضك.. لأنها أرض شر.'
- line: 50
  sub: شوف الحكمة. التوبة مو بس كلمة باللسان.
- line: 51
  sub: التوبة ندم.. وترك.. وتغيير.
- line: 52
  sub: أحياناً ما تقدر تتوب وانت في نفس المكان.. ونفس الشلة.. ونفس الطريق اللي طحت
    فيه.
- line: 53
  sub: وش هي أرضك انت اليوم؟
- line: 54
  sub: يمكن أرضك.. شلة تسحبك كل ليلة لنفس الغلط.
- line: 55
  sub: يمكن أرضك.. جوالك. تطبيق.. ولا حساب.. ولا مقطع تفتحه وانت تدري إنه يبعدك.
- line: 56
  sub: يمكن أرضك.. عادة. سهرة.. ولا مكان.. ولا شخص.
- line: 57
  sub: وتعرف أرضك.. لأنك كل مرة تروح لها.. تحس قلبك أثقل. وكل مرة تبعد عنها.. تحس
    إنك أخف.
- line: 58
  sub: 'العالم ما قال للرجل: انتظر لين يتغير قلبك. قال: قوم.. وروح.'
- line: 59
  sub: 'والتوبة الصادقة فيها شي مهم.. لازم تعرفه:'
- line: 60
  sub: إذا أخذت حق أحد.. رجّعه له.. أو اطلب منه يسامحك. هذا من تمام التوبة.
- line: 61
  sub: الله يغفر حقه سبحانه.. بس حقوق الناس.. ما تضيع.
- line: 62
  sub: وطلع الرجل.
- line: 63
  sub: تخيّل. خلّى وراه كل شي. بيته.. أرضه.. اسمه.. وكل اللي يعرفونه.
- line: 64
  sub: يمشي.. وما يدري يوصل ولا لا.
- line: 65
  sub: بس كان يمشي. وكل خطوة.. كانت توبة.
- line: 66
  sub: تخيّل الطريق. شمس.. وغبار.. ورجلينه تعبانة.
- line: 67
  sub: 'وكل ما تعب.. يمكن جاه صوت من داخله يقول: ارجع.. انت ما تستاهل.'
- line: 68
  sub: بس هو ما رجع. لأنه يدري إن الرجعة.. يعني نفس الأرض.. ونفس الغلط.
- line: 69
  sub: وفي نص الطريق.. جاه الموت.
- line: 70
  sub: ما وصل. ما دخل الأرض اللي كان رايح لها.
- line: 71
  sub: ما لحق يصلي مع أهلها ركعة.
- line: 72
  sub: بس في آخر لحظة.. مال بصدره ناحيتها. ثم مات.
- line: 73
  sub: حتى وهو يموت.. وجهه كان رايح لله.
- line: 74
  sub: وهنا.. اختلفت فيه الملائكة. ملائكة الرحمة.. وملائكة العذاب.
- line: 75
  sub: 'ملائكة الرحمة قالت:'
- line: 76
  sub: جَاءَ تَائِبًا مُقْبِلًا بِقَلْبِهِ إِلَى اللَّهِ.
- line: 77
  sub: 'وملائكة العذاب قالت:'
- line: 78
  sub: إِنَّهُ لَمْ يَعْمَلْ خَيْرًا قَطُّ.
- line: 79
  sub: ومين يحسم؟
- line: 80
  sub: 'جاهم ملَك.. في صورة إنسان. وقال: قيسوا المسافة بين الأرضين.. وأي وحدة أقرب
    له.. فهو منها.'
- line: 81
  sub: 'وأوحى الله للأرض الصالحة: تقرّبي. وللأرض الثانية: تباعدي.'
- line: 82
  sub: فقاسوا.. ولقوه أقرب للأرض الصالحة.. بشبر.
- line: 83
  sub: شبر واحد.
- line: 84
  sub: فغفر الله له.
- line: 85
  sub: شبر. تعرف وش يعني؟
- line: 86
  sub: شبر.. أصغر من كف يدك. وهذا الشبر.. كان الفرق كله.
- line: 87
  sub: يعني ما يهم كم كنت بعيد.. المهم وين وجهك.. وإنك تاخذ خطوة وحدة.. لله.
- line: 88
  sub: الأرض نفسها.. تحركت.. عشان رجل واحد صادق.
- line: 89
  sub: وهذا اللي يخليني أقول لك حديث ثاني.
- line: 90
  sub: وصلوا أسرى للنبي صلى الله عليه وسلم.. وفيهم امرأة.. تدوّر.
- line: 91
  sub: ضايع منها ولدها. صدرها مليان حليب.. وكل ما لقت طفل بين الأسرى.. ضمّته.. وأرضعته.
- line: 92
  sub: ولما لقت ولدها.. ضمّته لها.. وأرضعته.
- line: 93
  sub: 'فقال النبي صلى الله عليه وسلم لأصحابه:'
- line: 94
  sub: أَتُرَوْنَ هَذِهِ طَارِحَةً وَلَدَهَا فِي النَّارِ؟
- line: 95
  sub: 'قالوا: لَا، وَهِيَ تَقْدِرُ عَلَى أَلَّا تَطْرَحَهُ.'
- line: 96
  sub: 'فقال:'
- line: 97
  sub: لَلَّهُ أَرْحَمُ بِعِبَادِهِ مِنْ هَذِهِ بِوَلَدِهَا.
- line: 98
  sub: اسمعها مرة ثانية. رحمة الله بك.. أكبر من رحمة هذي الأم بولدها. وأكبر من رحمة
    أي أم.
- line: 99
  sub: وانت.. تفكر إن الله ما يقبلك؟
- line: 100
  sub: الرجل ما لحق يصلي.. ولا يتصدق.
- line: 101
  sub: 'بس كان عنده أعظم شي: توبة صادقة.. وخطوة.'
- line: 102
  sub: والله قبله.
- line: 103
  sub: 'تذكر وش قلت لك في أول القصة؟ أول واحد جاوبه.. قال: لا. وخسر حياته بسبب هالكلمة.'
- line: 104
  sub: 'بس الرجل ما وقّف. لأنه فهم شي: كلام الناس.. ما يقفل باب الله.'
- line: 105
  sub: 'الليلة.. قبل لا تنام.. فكّر: وش هو الشي اللي تقول عنه: هذا ما ينغفر؟'
- line: 106
  sub: مو لازم تصلّح كل شي الليلة. بس اتجه. خطوة وحدة. شبر.
- line: 107
  sub: 'قول: يا رب.. وارجع.'
- line: 108
  sub: 'والتوبة سهلة تفهمها: تندم من قلبك.. وتوقّف الذنب الحين.. وتنوي إنك ما ترجع
    له.. وإذا عليك حق لأحد.. ترجّعه.'
- line: 109
  sub: بس لا تفهمني غلط.. رحمة الله مو عذر إنك تكمّل في الذنب.
- line: 110
  sub: الرجل هذا ما قعد في أرضه.. ينتظر الرحمة وهو على ذنبه. لا.. قام.. وطلع.. ومشى.
- line: 111
  sub: والموت جاه في نص الطريق.. بدون موعد. وما أحد فينا يدري.. متى يجيه.
- line: 112
  sub: 'واللي يقول لك: ما لك توبة.. يتكلم بغير علم.'
- line: 113
  sub: باب التوبة مفتوح.. لين تطلع الشمس من مغربها.. أو توصل الروح الحلقوم.
- line: 114
  sub: والباب مفتوح.. الحين.
