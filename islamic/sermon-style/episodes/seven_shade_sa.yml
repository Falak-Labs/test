# Episode 2: "Seven whom Allah shades on the day there is no shade but His" (Sahih al-Bukhari 660, wording of al-Bukhari;
# also Muslim 1031). Saudi dialect, Mansour (eleven_v4). Hook: number + "maybe you are one of them"; the seven come one
# by one; mid-video question «لاحظت شي؟»; ends on choosing one of the seven today. Background: Nasheed 37 (Pixabay).
