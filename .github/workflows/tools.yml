name: Tools
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "script in scripts/ to run (without .py)"
        required: true
      args:
        description: "arguments"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: posting
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml
      - name: Run
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/${{ inputs.cmd }}.py ${{ inputs.args }}
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: ${{ inputs.cmd }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
