name: Islamic music find
# Searches open-licence audio (Openverse) on the runner and keeps CC0 / public-domain / CC BY files as background-bed
# candidates in islamic/music/candidates with their source and licence (index.json).
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Openverse search phrases separated by |"
        required: false
        default: ""
      pages:
        description: "name=pixabay-track-page-url pairs separated by spaces"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: islamic-music
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            islamic/tools
            islamic/music
            scripts
      - name: ffmpeg
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: Find and download
        env:
          QUERIES: ${{ inputs.queries }}
          PAGES: ${{ inputs.pages }}
        run: |
          if [ -n "$QUERIES" ]; then IFS='|' read -ra Q <<< "$QUERIES"; timeout 1200 python3 -I -u islamic/tools/music_find.py islamic/music/candidates "${Q[@]}" || true; fi
          if [ -n "$PAGES" ]; then python3 -I -u islamic/tools/music_pages.py islamic/music/candidates $PAGES || true; fi
      - name: Save to the repo
        if: always()
        run: bash scripts/save_state.sh "islamic music candidates $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" islamic/music
