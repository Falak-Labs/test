name: Post episodes
on:
  push:
    branches: [main]
    paths: ["posts/**", "media/**", "config.yml", "scripts/post.py"]
  workflow_dispatch:
  schedule:
    - cron: "40 16 10 11 *"     # Nov 10, 16:40 and 17:05 UTC: add episodes 16-20 once 5 of 6-15 have gone out (remove after)
    - cron: "5 17 10 11 *"
permissions:
  contents: write
concurrency:
  group: posting
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # the newest state/, so a run that waited behind another never posts twice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml
      - name: Schedule new posts
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/post.py
      - name: Check statuses
        if: always()
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/status.py --wait-now 8
      - name: Save state
        if: always()
        run: |
          bash scripts/save_state.sh "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
