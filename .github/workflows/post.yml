name: Post episodes
on:
  push:
    branches: [main]
    paths: ["posts/**", "media/**", "config.yml", "scripts/post.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posting
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # the newest state/, so a run that waited behind another never posts twice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml
      - name: Schedule new posts
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/post.py
      - name: Check statuses
        # Not on push runs: a full status look costs about 11 Buffer API requests per account and the 30-day
        # allowance ran low (Nov 26: Arabic 174, English 253 left); post.py counts queue places from state/ by dueAt.
        if: always() && github.event_name != 'push'
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/status.py   # one look at Buffer (polling used up the daily API allowance on Nov 10)
      - name: Save state
        if: always()
        run: |
          bash scripts/save_state.sh "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
