name: Produce videos
on:
  workflow_dispatch:
    inputs:
      only:
        description: "episode slugs, comma separated (empty = everything that is missing)"
        required: false
        default: ""
      langs:
        description: "languages to make"
        required: false
        default: "en,ar"
      force:
        description: "remake even if the video exists"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  pages: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - id: p
        run: |
          python scripts/produce.py plan --only "${{ inputs.only }}" --langs "${{ inputs.langs }}" ${{ inputs.force && '--force' || '' }} | tee -a "$GITHUB_OUTPUT"
  make:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TTS_HOME: /home/runner/tts
      BIK_WORKERS: "4"
      WHISPER_DIR: /home/runner/tts/asr/sherpa-onnx-whisper-base.en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci*.txt
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Python packages
        run: |
          pip install --quiet -r scripts/requirements-ci.txt
          if [ "${{ matrix.ar }}" = "true" ]; then
            pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet --no-deps chatterbox-tts==0.1.7
            pip install --quiet -r scripts/requirements-ci-saudi.txt
          fi
          pip list 2>/dev/null | grep -i -E "^(torch|numpy|transformers|diffusers|chatterbox|skia|scipy|sherpa)" || true
      - uses: actions/cache@v4
        with:
          path: /home/runner/tts
          key: tts-${{ matrix.ar }}-v1
      - name: Models
        run: |
          bash scripts/ci_models.sh "${{ matrix.langs }}"
      - name: Make the videos
        run: |
          python scripts/produce.py make "${{ matrix.slug }}" "${{ matrix.kit }}" "${{ matrix.langs }}" "${{ matrix.look }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.slug }}
          path: ci_out/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 7
  collect:
    needs: [plan, make]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: ci_out
      - run: |
          pip install --quiet pyyaml
          python scripts/produce.py collect
      - name: Save to the repo
        run: |
          bash scripts/save_state.sh "produce: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" media review kit/series/voice
      - name: Refresh the public video links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
