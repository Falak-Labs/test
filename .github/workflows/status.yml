name: Post status
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posting
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml
      - name: Check statuses
        env:
          BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
          BUFFER_KEY_AR: ${{ secrets.BUFFER_KEY_AR }}
        run: python scripts/status.py
      - name: Save state
        run: |
          bash scripts/save_state.sh "status: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
