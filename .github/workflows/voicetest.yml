name: Arabic voice test
on:
  workflow_dispatch:
    inputs:
      kit:
        description: "episode kit whose Saudi lines are read"
        required: false
        default: "racecar"
      lines:
        description: "line numbers"
        required: false
        default: "1,2,3,14"
      engines:
        description: "engines (see scripts/voicetest.py)"
        required: false
        default: "namaa,ms_hamed,ms_fahed,silma,gemini_fenrir,gemini_charon,azure_hamed"
      lang:
        description: "ar (Saudi script) or en"
        required: false
        default: "ar"
      rate:
        description: "speed for every Microsoft voice, e.g. +25% (empty = each voice's own)"
        required: false
        default: ""
      pause_cap:
        description: "longest pause kept inside a line, seconds (0 = keep)"
        required: false
        default: "0"
      out:
        description: "output folder"
        required: false
        default: "review/voicetest"
permissions:
  contents: write
concurrency:
  group: voicetest
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TTS_HOME: /home/runner/tts
      VT_KIT: ${{ inputs.kit }}
      VT_LINES: ${{ inputs.lines }}
      VT_ENGINES: ${{ inputs.engines }}
      VT_LANG: ${{ inputs.lang }}
      VT_RATE: ${{ inputs.rate }}
      VT_PAUSE_CAP: ${{ inputs.pause_cap }}
      VT_OUT: ${{ inputs.out }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Python packages
        run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy scipy soundfile sherpa-onnx requests edge-tts
      - name: Speech check model (Whisper small)
        run: |
          mkdir -p "$TTS_HOME/asr"
          curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 | tar xj -C "$TTS_HOME/asr"
      - name: Voices
        run: python -I scripts/voicetest.py make --skip silma
      - name: SILMA TTS (open source; allowed to fail)
        if: contains(inputs.engines, 'silma')
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install --quiet silma-tts --extra-index-url https://download.pytorch.org/whl/cpu
          python -I scripts/voicetest.py make --only silma
      - name: Score and pack
        run: python -I scripts/voicetest.py score
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git commit -q -m "review: Arabic voice test (${{ inputs.kit }}) [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 6; done
