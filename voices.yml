# Narrator voice per language for NEW episodes. An episode whose voice files already exist in kit/series/voice keeps
# them (Episodes 1-20: Easton + NAMAA Saudi; builds 21-23: ElevenLabs for both).
#   engine: phonon = Phonon 31M (gradium/phonon-31m-en, Apache 2.0, free, runs on the runner's CPU); voice = catalogue name
#   engine: eleven = ElevenLabs (needs the ELEVENLABS_API_KEY Actions secret; voice = ElevenLabs voice ID, not secret)
# From Nov 12 2026 (owner's call): English on free Easton, only Arabic on ElevenLabs.
# Nov 22 2026: ElevenLabs is Pro (613,234 characters a month, reset Dec 22). Credit rules: NIGHT_NOTES "Nov 22 11:25". Saved takes are always reused.
# ar.dialect = the dialect the Arabic scripts are written in (egyptian or jordanian). Nov 12 21:12 PT: he rejected
# UZbXudn9g5q7bjznYXcC and is trying kU20U5bOr9ND3yqlsdwV with a Jordanian script; until he approves it, the
# Egyptian voice he accepted for builds 21-25 stays.
# Nov 23 21:59 PT, owner picked J. Ballen (Southern storyteller, comic timing) after rejecting Easton ("annoying") and
# 15 other samples: "Baller for sure, let's try it". English now costs ElevenLabs credits (~1,000 per build).
en: {engine: eleven, voice: 2LxhCRvenFtT95JOekmF, model: eleven_multilingual_v2}
# previous: en: {engine: phonon, voice: Easton}
# Nov 22 11:35 PT, owner: "only ElevenLabs for Arabic, not the Egyptian one". From build 64 every NEW Arabic voice is Saudi
# Mansour (below). Egyptian voice IES4nrmZdUBHByLBde0P stays only for the old builds that already have it.
ar: {engine: eleven, voice: 5HAezIQAaoSgJypcI0NP, model: eleven_multilingual_v2, dialect: saudi}
# (A/B test over: Mansour won. ar_alt.kits stays as the list of builds already made with him.)
# A/B test from Nov 17 22:15 PT (owner picked Gulf voice 1, Mansour): the Arabic of every ODD-numbered build from 41 on
# uses this voice with a Saudi-dialect script; even builds keep the Egyptian voice above. A run adds the kit name of
# each odd build to `kits` when it picks it. Compare views per voice on Dec 1 (Instagram + TikTok Arabic).
ar_alt: {engine: eleven, voice: 5HAezIQAaoSgJypcI0NP, model: eleven_multilingual_v2, dialect: saudi, kits: [barrier, greatwall, machupicchu, igloo, hagiasophia, burjalarab, fridge, suez, operahouse, liberty, pisa, washer]}
